<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lake Shore Trust — Teller Window</title>
  <link href="https://api.fontshare.com/v2/css?f[]=gambarino@400,700&f[]=switzer@500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wallet.css">
  <script src="wallet.js"></script>
  <script src="music.js"></script>
  <style>
    :root {
      --ink: #0e1412;
      --lobby: #1a2420;
      --marble: #d8d2c4;
      --marble-vein: #b8b0a0;
      --brass: #c4a35a;
      --brass-hot: #e8c878;
      --brass-deep: #7a6230;
      --forest: #1e3a32;
      --forest-deep: #122820;
      --glass: rgba(180, 210, 200, 0.12);
      --cream: #efe8d8;
      --muted: #8a948c;
      --debt: #e85a6b;
      --ok: #6ecf8e;
      --font-display: 'Gambarino', Georgia, serif;
      --font-ui: 'Switzer', system-ui, sans-serif;
      --bill-w: min(42vw, 280px);
      --bill-h: calc(var(--bill-w) * 0.423);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--cream);
      font-family: var(--font-ui);
      background: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .scene {
      position: relative;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr minmax(38%, 46%);
      background:
        radial-gradient(ellipse 90% 50% at 50% 0%, rgba(196, 163, 90, 0.14), transparent 55%),
        radial-gradient(ellipse 70% 40% at 70% 100%, rgba(30, 58, 50, 0.5), transparent 50%),
        linear-gradient(180deg, #15201c 0%, var(--ink) 42%, #0a0e0c 100%);
    }
    .scene.is-slam .counter-top {
      animation: counter-thump 180ms cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .scene.is-slam .cage {
      animation: cage-rattle 220ms ease-out;
    }

    /* —— header / brand —— */
    .mast {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding:
        max(10px, env(safe-area-inset-top))
        max(14px, calc(var(--purse-hud-clearance-right, 148px) + 4px))
        0
        max(14px, env(safe-area-inset-left));
      pointer-events: none;
    }
    .brand {
      pointer-events: none;
    }
    .brand .eyebrow {
      margin: 0 0 2px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.85rem, 4.5vw + 0.6rem, 3.4rem);
      line-height: 0.92;
      letter-spacing: -0.02em;
      color: var(--cream);
      text-shadow: 0 2px 28px rgba(196, 163, 90, 0.2);
    }
    .brand p {
      margin: 6px 0 0;
      max-width: 34ch;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .leave-row {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      border: 1px solid rgba(196, 163, 90, 0.35);
      background: rgba(14, 20, 18, 0.55);
      color: var(--cream);
      font: 600 0.78rem/1 var(--font-ui);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 160ms ease, background 160ms ease;
    }
    .btn:hover {
      border-color: var(--brass-hot);
      background: rgba(30, 58, 50, 0.65);
    }

    /* —— teller booth —— */
    .booth {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: end center;
      min-height: 0;
      padding: 0 4vw;
      perspective: 900px;
    }

    .cage {
      position: relative;
      width: min(720px, 92vw);
      height: min(52vh, 420px);
      max-height: 100%;
      border-radius: 4px 4px 0 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%),
        linear-gradient(180deg, #243530 0%, var(--forest) 40%, var(--forest-deep) 100%);
      border: 1px solid rgba(196, 163, 90, 0.28);
      border-bottom: none;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.35),
        0 30px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(232, 200, 120, 0.12);
      overflow: hidden;
      transform-origin: 50% 100%;
    }

    .cage-rail {
      height: 10px;
      background: linear-gradient(180deg, var(--brass-hot), var(--brass) 45%, var(--brass-deep));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.4);
    }

    .cage-sign {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      padding: 6px 18px 5px;
      background: linear-gradient(180deg, #2a2214, #1a160e);
      border: 1px solid rgba(196, 163, 90, 0.55);
      border-radius: 2px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--brass-hot);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .bars {
      position: absolute;
      inset: 10px 0 0;
      z-index: 4;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 22px,
          rgba(196, 163, 90, 0.22) 22px 24px
        );
      mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 78%, transparent 100%);
    }
    .bars::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        rgba(255,255,255,0.1) 0%,
        transparent 28%,
        transparent 60%,
        rgba(180,210,200,0.06) 100%
      );
      mix-blend-mode: screen;
    }

    .fluorescent {
      position: absolute;
      top: 14px;
      left: 10%;
      right: 10%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, rgba(220, 240, 230, 0.55), transparent);
      box-shadow: 0 0 40px 10px rgba(200, 230, 210, 0.18);
      animation: hum 4.5s ease-in-out infinite;
      z-index: 2;
    }

    /* —— bored teller —— */
    .teller {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: min(220px, 48vw);
      height: min(260px, 58%);
      z-index: 2;
    }
    .teller-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 48%;
      background:
        linear-gradient(180deg, #2a3a48 0%, #1a2834 55%, #121c26 100%);
      border-radius: 40% 40% 8% 8% / 30% 30% 8% 8%;
      box-shadow: inset 0 8px 16px rgba(255,255,255,0.06);
    }
    .teller-collar {
      position: absolute;
      top: -6%;
      left: 50%;
      transform: translateX(-50%);
      width: 54%;
      height: 18%;
      background: #ebe4d6;
      clip-path: polygon(0 40%, 50% 100%, 100% 40%, 85% 0, 15% 0);
    }
    .teller-tie {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 12%;
      height: 42%;
      background: linear-gradient(180deg, #6a2030, #3a1018);
      clip-path: polygon(50% 0, 100% 12%, 62% 100%, 38% 100%, 0 12%);
    }
    .teller-head {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 46%;
      height: 42%;
      background: linear-gradient(180deg, #e8c4a8, #d4a888 70%, #c49878);
      border-radius: 46% 46% 42% 42% / 50% 50% 40% 40%;
      box-shadow: inset -6px -4px 12px rgba(120, 70, 40, 0.2);
      animation: head-bob 5.5s ease-in-out infinite;
      transform-origin: 50% 90%;
    }
    .teller.is-blink .eye {
      transform: scaleY(0.08);
    }
    .teller.is-sigh .mouth {
      transform: translateX(-50%) scaleX(1.15);
      border-color: #8a5a48;
    }
    .teller.is-notice .brow {
      transform: translateY(-2px);
    }
    .hair {
      position: absolute;
      top: -8%;
      left: 6%;
      right: 6%;
      height: 42%;
      background: linear-gradient(180deg, #3a3028, #2a221c);
      border-radius: 50% 50% 20% 20% / 70% 70% 20% 20%;
      z-index: 0;
    }
    .ear {
      position: absolute;
      top: 42%;
      width: 14%;
      height: 18%;
      background: #d4a888;
      border-radius: 50%;
      z-index: -1;
    }
    .ear.l { left: -8%; }
    .ear.r { right: -8%; }
    .brow {
      position: absolute;
      top: 38%;
      width: 22%;
      height: 3px;
      background: #3a3028;
      border-radius: 2px;
      transition: transform 200ms ease;
    }
    .brow.l { left: 18%; transform: rotate(-4deg); }
    .brow.r { right: 18%; transform: rotate(4deg); }
    .eye {
      position: absolute;
      top: 46%;
      width: 12%;
      height: 9%;
      background: #f5f0e8;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 80ms linear;
      transform-origin: 50% 50%;
    }
    .eye.l { left: 22%; }
    .eye.r { right: 22%; }
    .pupil {
      position: absolute;
      top: 28%;
      left: 30%;
      width: 42%;
      height: 55%;
      background: #2a221c;
      border-radius: 50%;
    }
    .nose {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translateX(-50%);
      width: 12%;
      height: 14%;
      background: #c49878;
      border-radius: 40% 40% 50% 50%;
    }
    .mouth {
      position: absolute;
      top: 76%;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      height: 6%;
      border-bottom: 2px solid #a07058;
      border-radius: 0 0 50% 50%;
      transition: transform 300ms ease, border-color 300ms ease;
    }
    .hand-chin {
      position: absolute;
      bottom: 28%;
      right: 8%;
      width: 22%;
      height: 18%;
      background: linear-gradient(160deg, #e8c4a8, #c49878);
      border-radius: 40% 50% 40% 45%;
      box-shadow: -2px 4px 8px rgba(0,0,0,0.2);
      z-index: 3;
      transform: rotate(-18deg);
    }
    .hand-chin::before {
      content: '';
      position: absolute;
      top: -35%;
      left: 15%;
      width: 70%;
      height: 55%;
      background: #d4a888;
      border-radius: 40%;
    }
    .nameplate {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 4px 12px;
      background: linear-gradient(180deg, var(--brass), var(--brass-deep));
      color: #1a1208;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    /* —— counter —— */
    .counter {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .counter-lip {
      height: 14px;
      background: linear-gradient(180deg, #a89878, #6a5a42 40%, #4a3e2e);
      box-shadow: 0 4px 0 rgba(0,0,0,0.35);
      border-top: 1px solid rgba(255,240,200,0.25);
    }
    .counter-top {
      position: relative;
      flex: 1;
      min-height: 0;
      background:
        radial-gradient(ellipse 40% 30% at 20% 40%, rgba(255,255,255,0.18), transparent 50%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(140, 120, 90, 0.2), transparent 55%),
        linear-gradient(165deg, #e8e2d4 0%, var(--marble) 45%, #c8c0b0 100%);
      box-shadow: inset 0 20px 40px rgba(0,0,0,0.12);
      overflow: hidden;
      transform-origin: 50% 0%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .counter-top:focus-visible {
      outline: 2px solid rgba(196, 163, 90, 0.7);
      outline-offset: -4px;
    }
    .counter-top::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background:
        repeating-linear-gradient(
          105deg,
          transparent 0 40px,
          rgba(140, 120, 100, 0.12) 40px 42px,
          transparent 42px 90px,
          rgba(160, 140, 120, 0.08) 90px 91px
        );
      pointer-events: none;
    }
    .counter-front {
      height: 56px;
      background:
        linear-gradient(180deg, #3a3228 0%, #2a241c 40%, #1a1612 100%);
      border-top: 2px solid #5a4e3e;
      box-shadow: inset 0 12px 24px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 16px max(8px, env(safe-area-inset-bottom));
    }

    .debt-board {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      text-align: center;
      pointer-events: none;
    }
    .debt-board .label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #5a5040;
    }
    .debt-board .amt {
      margin-top: 2px;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw + 1rem, 2.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #3a2018;
      letter-spacing: -0.02em;
      transition: color 200ms ease, transform 160ms ease;
    }
    .debt-board .amt.is-debt { color: #8a2030; }
    .debt-board .amt.is-clear { color: #1a4a30; }
    .debt-board .amt.is-punch {
      animation: debt-punch 280ms cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .debt-board .sub {
      margin-top: 2px;
      font-size: 0.72rem;
      color: #6a6050;
      font-weight: 600;
    }

    .stack {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }
    .bill {
      position: absolute;
      width: var(--bill-w);
      height: var(--bill-h);
      left: 50%;
      top: 50%;
      margin-left: calc(var(--bill-w) / -2);
      margin-top: calc(var(--bill-h) / -2);
      border-radius: 4px;
      box-shadow:
        0 2px 2px rgba(0,0,0,0.2),
        0 10px 24px rgba(0,0,0,0.35),
        0 0 0 1px rgba(0,0,0,0.12);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .bill img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      pointer-events: none;
    }
    .bill.is-flying {
      z-index: 20;
      animation: bill-slam 320ms cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
    }
    .bill.is-settled {
      transition: none;
    }

    .prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--cream);
    }
    .prompt kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 5.5rem;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      border: 1px solid rgba(196, 163, 90, 0.5);
      background: linear-gradient(180deg, rgba(196, 163, 90, 0.22), rgba(14, 20, 18, 0.7));
      font: 700 0.85rem/1 var(--font-ui);
      letter-spacing: 0.14em;
      color: var(--brass-hot);
      box-shadow: 0 4px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
      cursor: pointer;
      transition: transform 80ms ease, box-shadow 80ms ease, background 160ms ease;
    }
    .prompt kbd:active,
    .prompt kbd.is-press {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .prompt kbd:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .prompt .hint {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .prompt .hint b { color: var(--brass); font-weight: 700; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(96px, calc(env(safe-area-inset-bottom) + 88px));
      transform: translateX(-50%) translateY(12px);
      z-index: 40;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      background: rgba(14, 20, 18, 0.88);
      border: 1px solid rgba(196, 163, 90, 0.35);
      color: var(--cream);
      font: 600 0.85rem/1.3 var(--font-ui);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.bad { border-color: rgba(232, 90, 107, 0.5); color: #f0b0b8; }
    .toast.good { border-color: rgba(110, 207, 142, 0.45); color: #b8ecc8; }

    .paid-chip {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      bottom: 72px;
      z-index: 6;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(14, 20, 18, 0.55);
      border: 1px solid rgba(196, 163, 90, 0.28);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .paid-chip b {
      display: block;
      margin-top: 2px;
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0;
      color: var(--brass-hot);
      font-variant-numeric: tabular-nums;
    }

    @keyframes bill-slam {
      0% {
        opacity: 0.85;
        transform: translate3d(var(--sx, 0px), var(--sy, 180px), 0)
          rotate(var(--sr, -28deg)) scale(1.35);
        filter: brightness(1.15);
      }
      55% {
        opacity: 1;
        filter: brightness(1.05);
      }
      78% {
        transform: translate3d(var(--tx, 0px), calc(var(--ty, 0px) + 6px), 0)
          rotate(var(--tr, 0deg)) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0)
          rotate(var(--tr, 0deg)) scale(1);
        filter: brightness(1);
      }
    }
    @keyframes counter-thump {
      0% { transform: translateY(0); }
      35% { transform: translateY(7px); }
      100% { transform: translateY(0); }
    }
    @keyframes cage-rattle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      55% { transform: translateX(2px); }
    }
    @keyframes debt-punch {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes hum {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes head-bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(2px); }
    }

    @media (max-width: 640px) {
      .brand p { display: none; }
      .cage { height: min(46vh, 340px); }
      .paid-chip { bottom: 80px; right: 10px; }
      .counter-front { height: 64px; }
    }

    /* Phones / touch: no Space key — tap the marble */
    @media (hover: none), (pointer: coarse) {
      .prompt kbd { display: none; }
      .counter-front { height: 48px; }
      .prompt .hint {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bill.is-flying { animation-duration: 1ms; }
      .fluorescent, .teller-head { animation: none; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <header class="mast">
      <div class="brand">
        <p class="eyebrow">Est. 1894 · Member FDIC*</p>
        <h1>Lake Shore Trust</h1>
        <p>Slide cash under the glass. Every hundred chips the credit balance.</p>
      </div>
      <div class="leave-row">
        <a class="btn" href="frogger.html?resumeDrive=1">Leave</a>
        <a class="btn" href="frogger.html?enter=casino">Tables</a>
      </div>
    </header>

    <section class="booth" aria-label="Teller window">
      <div class="cage" id="cage">
        <div class="cage-rail" aria-hidden="true"></div>
        <div class="fluorescent" aria-hidden="true"></div>
        <div class="cage-sign">Window 3 · Please have ID ready</div>
        <div class="bars" aria-hidden="true"></div>

        <div class="teller" id="teller" aria-hidden="true">
          <div class="teller-body">
            <div class="teller-collar"></div>
            <div class="teller-tie"></div>
          </div>
          <div class="teller-head">
            <div class="hair"></div>
            <div class="ear l"></div>
            <div class="ear r"></div>
            <div class="brow l"></div>
            <div class="brow r"></div>
            <div class="eye l"><div class="pupil"></div></div>
            <div class="eye r"><div class="pupil"></div></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
          <div class="hand-chin"></div>
        </div>
        <div class="nameplate">D. Kessler · Sr. Teller</div>
      </div>
    </section>

    <section class="counter" aria-label="Marble counter">
      <div class="counter-lip" aria-hidden="true"></div>
      <div
        class="counter-top"
        id="counterTop"
        role="button"
        tabindex="0"
        aria-label="Slam a hundred on the counter"
        title="Tap the counter to slam a hundred"
      >
        <div class="debt-board">
          <div class="label">Credit balance</div>
          <div class="amt is-debt" id="debtAmt">−$10,000</div>
          <div class="sub" id="debtSub">Tap the counter — $100</div>
        </div>
        <div class="stack" id="stack" aria-hidden="true"></div>
        <div class="paid-chip">Slammed today<b id="paidAmt">$0</b></div>
      </div>
      <div class="counter-front">
        <div class="prompt">
          <kbd id="slamBtn" role="button" tabindex="0" title="Slam a hundred on the counter">Space</kbd>
          <div class="hint" id="cashHint">Cash on hand <b id="cashAmt">$0</b></div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
(() => {
  const BILL = 100;
  const MAX_VISIBLE = 28;
  const scene = document.getElementById('scene');
  const stack = document.getElementById('stack');
  const teller = document.getElementById('teller');
  const counterTop = document.getElementById('counterTop');
  const slamBtn = document.getElementById('slamBtn');
  const debtAmt = document.getElementById('debtAmt');
  const debtSub = document.getElementById('debtSub');
  const cashAmt = document.getElementById('cashAmt');
  const paidAmt = document.getElementById('paidAmt');
  const toastEl = document.getElementById('toast');
  const isTouchUi = window.matchMedia('(hover: none), (pointer: coarse)').matches;

  let sessionPaid = 0;
  let toastTimer = null;
  let pressTimer = null;
  let slamAnimTimer = null;
  let audioCtx = null;

  function money(n) {
    return Wallet.format(n);
  }

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.classList.remove('bad', 'good', 'show');
    if (kind) toastEl.classList.add(kind);
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  function thump() {
    const ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(90, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.12);
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.55, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.2);

    // Paper slap layer
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2.2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    const nGain = ctx.createGain();
    const nFilter = ctx.createBiquadFilter();
    nFilter.type = 'bandpass';
    nFilter.frequency.value = 1400;
    nFilter.Q.value = 0.7;
    nGain.gain.setValueAtTime(0.22, t);
    nGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.09);
  }

  function refresh() {
    const digital = Wallet.digital();
    const cash = Wallet.cash();
    const inDebt = digital < 0;
    debtAmt.textContent = money(digital);
    debtAmt.classList.toggle('is-debt', inDebt);
    debtAmt.classList.toggle('is-clear', !inDebt);
    cashAmt.textContent = money(cash);
    paidAmt.textContent = money(sessionPaid);

    if (cash < BILL) {
      debtSub.textContent = cash <= 0
        ? 'No cash — come back with paper'
        : `Need ${money(BILL)} to slam a bill`;
      slamBtn.disabled = true;
      counterTop.setAttribute('aria-disabled', 'true');
    } else if (!inDebt) {
      debtSub.textContent = 'Account clear — still accepting deposits';
      slamBtn.disabled = false;
      counterTop.setAttribute('aria-disabled', 'false');
    } else {
      debtSub.textContent = isTouchUi
        ? `Tap the counter — ${money(BILL)}`
        : `Spacebar or tap — ${money(BILL)}`;
      slamBtn.disabled = false;
      counterTop.setAttribute('aria-disabled', 'false');
    }
  }

  function settleBill(el, tx, ty, tr) {
    el.classList.remove('is-flying');
    el.classList.add('is-settled');
    el.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${tr}deg)`;
    el.style.removeProperty('--sx');
    el.style.removeProperty('--sy');
    el.style.removeProperty('--sr');
    el.style.removeProperty('--tx');
    el.style.removeProperty('--ty');
    el.style.removeProperty('--tr');

    while (stack.children.length > MAX_VISIBLE) {
      stack.removeChild(stack.firstChild);
    }
  }

  function spawnBill() {
    const el = document.createElement('div');
    el.className = 'bill is-flying';
    const img = document.createElement('img');
    img.src = 'assets/hundred-dollar.jpg';
    img.alt = '';
    img.draggable = false;
    el.appendChild(img);

    const tx = (Math.random() - 0.5) * 120;
    const ty = 28 + (Math.random() - 0.5) * 50 + Math.min(stack.children.length, 12) * -1.2;
    const tr = (Math.random() - 0.5) * 26;
    const sx = (Math.random() - 0.5) * 80;
    const sy = 160 + Math.random() * 80;
    const sr = (Math.random() > 0.5 ? 1 : -1) * (18 + Math.random() * 22);

    el.style.setProperty('--tx', `${tx}px`);
    el.style.setProperty('--ty', `${ty}px`);
    el.style.setProperty('--tr', `${tr}deg`);
    el.style.setProperty('--sx', `${sx}px`);
    el.style.setProperty('--sy', `${sy}px`);
    el.style.setProperty('--sr', `${sr}deg`);
    el.style.zIndex = String(10 + stack.children.length);

    stack.appendChild(el);
    el.addEventListener('animationend', () => settleBill(el, tx, ty, tr), { once: true });
  }

  function noticeTeller() {
    teller.classList.add('is-notice');
    setTimeout(() => teller.classList.remove('is-notice'), 420);
    if (Math.random() < 0.35) {
      setTimeout(() => {
        teller.classList.add('is-sigh');
        setTimeout(() => teller.classList.remove('is-sigh'), 700);
      }, 280);
    }
  }

  function slam() {
    if (Wallet.cash() < BILL) {
      toast(Wallet.cash() <= 0 ? 'Pockets empty.' : `Need ${money(BILL)} in cash.`, 'bad');
      return;
    }

    spawnBill();
    thump();

    slamBtn.classList.add('is-press');
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => slamBtn.classList.remove('is-press'), 80);

    scene.classList.remove('is-slam');
    void scene.offsetWidth;
    scene.classList.add('is-slam');
    clearTimeout(slamAnimTimer);
    slamAnimTimer = setTimeout(() => scene.classList.remove('is-slam'), 220);

    const result = Wallet.payCashTowardCredit(BILL);
    if (!result.ok) {
      toast(result.reason || 'Declined', 'bad');
      return;
    }

    sessionPaid += result.paid;
    debtAmt.classList.remove('is-punch');
    void debtAmt.offsetWidth;
    debtAmt.classList.add('is-punch');
    noticeTeller();
    paidAmt.textContent = money(sessionPaid);

    if (result.digital >= 0 && result.digital - result.paid < 0) {
      toast('Paid in full. Kessler almost smiled.', 'good');
    }
  }

  // Idle teller life
  function blinkLoop() {
    const wait = 2200 + Math.random() * 4200;
    setTimeout(() => {
      teller.classList.add('is-blink');
      setTimeout(() => {
        teller.classList.remove('is-blink');
        blinkLoop();
      }, 120 + Math.random() * 80);
    }, wait);
  }
  function sighLoop() {
    setTimeout(() => {
      if (!teller.classList.contains('is-notice')) {
        teller.classList.add('is-sigh');
        setTimeout(() => teller.classList.remove('is-sigh'), 900);
      }
      sighLoop();
    }, 8000 + Math.random() * 10000);
  }

  window.addEventListener('keydown', (ev) => {
    if (ev.code === 'Space' || ev.key === ' ') {
      const t = ev.target;
      const tag = (t && t.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'A') return;
      if (t === counterTop || t === slamBtn) return;
      ev.preventDefault();
      slam();
    }
  });

  slamBtn.addEventListener('click', (ev) => {
    ev.preventDefault();
    slam();
  });
  slamBtn.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      slam();
    }
  });

  counterTop.addEventListener('pointerdown', (ev) => {
    if (ev.button != null && ev.button !== 0) return;
    ev.preventDefault();
    slam();
  });
  counterTop.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      slam();
    }
  });

  // First gesture unlocks audio on mobile
  window.addEventListener('pointerdown', () => ensureAudio(), { once: true });

  Wallet.subscribe(refresh);
  refresh();
  blinkLoop();
  sighLoop();
})();
  </script>
</body>
</html>
