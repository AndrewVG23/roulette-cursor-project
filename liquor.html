<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bottle Run — Corner Liquor</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wallet.css">
  <script src="wallet.js"></script>
  <script src="orientation.js"></script>
  <script src="music.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    body {
      margin: 0;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(90, 60, 160, .25), transparent 50%),
        linear-gradient(180deg, #0b0b14, #050508 70%);
      color: #f5edd8;
      font-family: 'Press Start 2P', monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      font-size: 10px;
      color: #ffd23f;
      text-shadow: 2px 2px 0 #000;
      background: linear-gradient(180deg, rgba(5,5,8,.8), transparent);
      pointer-events: none;
      padding-right: var(--purse-hud-clearance-right, 120px);
    }
    .topbar .btn { pointer-events: auto; }
    .topbar .title { letter-spacing: 1px; }
    .topbar .spacer { flex: 1; }
    .btn {
      font-family: inherit;
      font-size: 8px;
      color: #f5edd8;
      background: #1b1f3a;
      border: 2px solid #3a3f6e;
      border-radius: 3px;
      padding: 6px 8px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: #262c52; }
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .touch {
      position: fixed;
      inset: auto 0 0 0;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 14px calc(14px + env(safe-area-inset-bottom));
      pointer-events: none;
      z-index: 5;
    }
    .touch .pad, .touch .acts { display: flex; gap: 10px; pointer-events: auto; }
    .tbtn {
      width: 58px; height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255, 210, 63, .5);
      background: rgba(27, 31, 58, .75);
      color: #ffd23f;
      font-family: inherit;
      font-size: 14px;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tbtn:active { background: rgba(255, 210, 63, .3); }
    @media (pointer: coarse) {
      .touch { display: flex; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="title">BOTTLE RUN</span>
    <span class="spacer"></span>
    <button class="btn" id="pauseBtn" type="button">Pause</button>
    <button class="btn" id="muteBtn" type="button">Sound</button>
    <a class="btn" href="frogger.html" title="Back out to the street">Leave</a>
    <a class="btn" href="frogger.html?enter=casino">Tables</a>
  </div>
  <div class="stage">
    <canvas id="game" width="256" height="240" aria-label="Bottle Run platformer"></canvas>
  </div>
  <div class="touch" aria-hidden="true">
    <div class="pad">
      <button class="tbtn" id="tLeft" type="button">◀</button>
      <button class="tbtn" id="tRight" type="button">▶</button>
    </div>
    <div class="acts">
      <button class="tbtn" id="tRun" type="button">B</button>
      <button class="tbtn" id="tJump" type="button">A</button>
    </div>
  </div>

    canvas.width = W;
    canvas.height = H;
    ctx.imageSmoothingEnabled = false;
    if (G && G.level) G.cam = Math.max(0, Math.min(G.cam, G.gridW * TILE - W));

  // ---------------------------------------------------------------- physics
  const PHYS = {

    runMax: 148,

    airAccel: 270,
    friction: 420,

  // ---------------------------------------------------------------- sprites
  // Pixel maps: '.' transparent, letters index into the palette object.
  function sprite(rows, pal) {
    const c = document.createElement('canvas');
    c.width = rows[0].length;
    c.height = rows.length;
    const g = c.getContext('2d');
    for (let y = 0; y < rows.length; y++) {
      for (let x = 0; x < rows[y].length; x++) {
        const ch = rows[y][x];
        if (ch === '.') continue;
        g.fillStyle = pal[ch];
        g.fillRect(x, y, 1, 1);
      }
    }
    return c;
  }
  function flip(img) {
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const g = c.getContext('2d');
    g.translate(img.width, 0);
    g.scale(-1, 1);
    g.drawImage(img, 0, 0);
    return c;
  }

  const CLERK_PAL = { R: '#d82800', S: '#fcbcb0', B: '#101830', W: '#f8f8f0', H: '#6b3410', E: '#101830' };

  const SM_STAND = sprite([

  const BG_WALK2 = sprite(bigify([

    '...SSSSSS...',
    '..SSESSESS..',
    '..SSSSSSSS..',
    '...SSSSSS...',
    '..WWRRRRWW..',
    '..WWRRRRWWS.',
    '.SWRRRRRRWS.',
    '.SRRRRRRRS..',
    '...RRRRRR...',
    '...BBBBBB...',
    '...BBBBBB...',
    '....BBBB....',

  ]), CLERK_PAL);
  const BG_JUMP = sprite(bigify([
    '....RRRR....',
    '..RRRRRRRR..',
    '...SSSSSS...',
    '..SSESSESS..',
    '..SSSSSSSS..',

  const BIG = {

    standL: flip(BG_STAND), walkL: [flip(BG_WALK1), flip(BG_STAND), flip(BG_WALK2)], jumpL: flip(BG_JUMP)
  };

  const RAT_PAL = { G: '#8c8c94', D: '#5c5c66', P: '#e8a0a0', E: '#181820', T: '#c08870' };
  const RAT1 = sprite([
    '..DD............',
    '.DPPD...........',
    '.DPPDGGGGG......',
    '..DGGGGGGGGG....',
    '.GGGGGGGGGGGGG..',
    'GGEGGGGGGGGGGGGT',

  const RAT2 = sprite([
    '..DD............',

    '.DPPDGGGGG......',
    '..DGGGGGGGGG....',
    '.GGGGGGGGGGGGG..',
    'GGEGGGGGGGGGGGT.',
    'GGGGGGGGGGGGGTT.',
    '.GGGGGGGGGGG.T..',
    '...DD..DD..DD...',
    '....DD..DD..DD..'
  ], RAT_PAL);
  const RAT_SQ = sprite([

    'GGGGGGGGGGGGGGGG',
    'GEGGGGGGGGGGGGET',
    '.GGGGGGGGGGGGG..',
    '.DD.DD..DD.DD...'
  ], RAT_PAL);
  const RAT = { walk: [RAT1, RAT2], walkL: [flip(RAT1), flip(RAT2)], squash: RAT_SQ };

  const BOT_PAL = { N: '#7a4a10', n: '#a06a20', W: '#f0e8d0', E: '#181820', R: '#c22020', F: '#404048' };
  const BOT1 = sprite([
    '....nn....',
    '....NN....',
    '....NN....',
    '...NNNN...',
    '..NNNNNN..',
    '..NNNNNN..',
    '..WWWWWW..',
    '..WEWWEW..',

    '..WRRRRW..',

    '..NNNNNN..',
    '..NNNNNN..',

    '..FF..FF..'
  ], BOT_PAL);
  const BOT2 = sprite([
    '....nn....',
    '....NN....',
    '....NN....',
    '...NNNN...',
    '..NNNNNN..',
    '..NNNNNN..',
    '..WWWWWW..',
    '..WEWWEW..',
    '..WWWWWW..',
    '..WRRRRW..',
    '..WWWWWW..',
    '..NNNNNN..',
    '..NNNNNN..',
    '..NNNNNN..',
    '..N.NN.N..',
    '..FFF.FF..'
  ], BOT_PAL);
  const ROLL1 = sprite([
    '....NNNNNNNNNN..',
    '.nnNNNWWWWNNNNN.',
    'nNNNNNWEEWNNNNNN',
    '.nnNNNWWWWNNNNN.',
    '....NNNNNNNNNN..'
  ], BOT_PAL);
  const ROLL2 = sprite([
    '....NNNNNNNNNN..',
    '.nnNNNNWWWWNNNN.',
    'nNNNNNNWRRWNNNNN',
    '.nnNNNNWWWWNNNN.',
    '....NNNNNNNNNN..'
  ], BOT_PAL);
  const BOTTLE = { walk: [BOT1, BOT2], walkL: [flip(BOT1), flip(BOT2)], roll: [ROLL1, ROLL2] };

  const FORTY_PAL = { A: '#c89858', a: '#a87838', N: '#7a4a10', W: '#f0e8d0', R: '#c22020' };
  const FORTY = sprite([
    '.....NN.....',
    '.....NN.....',
    '....aAAa....',
    '...AAAAAA...',
    '..AAAAAAAA..',
    '..AaAAAAaA..',
    '..AAAAAAAA..',
    '..AAWWWWAA..',
    '..AAWRRWAA..',
    '..AAWWWWAA..',
    '..AaAAAAaA..',
    '..AAAAAAAA..',
    '..AAAAAAAA..',
    '..aAAAAAAa..'
  ], FORTY_PAL);

  const COIN_PAL = { Y: '#f8b800', y: '#fcd868', d: '#a05800' };
  const COIN_F = [
    sprite(['..YYYY..', '.YyyyyY.', 'YyydyyyY', 'YydyyydY', 'YydyyydY', 'YydyyydY', 'YyydyyyY', '.YyyyyY.', '..YYYY..'], COIN_PAL),
    sprite(['...YY...', '..YyyY..', '.YyddyY.', '.YydyyY.', '.YydyyY.', '.YydyyY.', '.YyddyY.', '..YyyY..', '...YY...'], COIN_PAL),
    sprite(['...YY...', '...YY...', '...yy...', '...yy...', '...yy...', '...yy...', '...yy...', '...YY...', '...YY...'], COIN_PAL),
    sprite(['...YY...', '..YyyY..', '.YyddyY.', '.YydyyY.', '.YydyyY.', '.YydyyY.', '.YyddyY.', '..YyyY..', '...YY...'], COIN_PAL)
  ];

  // ---------------------------------------------------------------- audio
  let actx = null;
  let muted = localStorage.getItem('liquorMuted') === '1';
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, when, slide) {
    const ac = audio();
    if (!ac || muted) return;
    const t0 = when != null ? when : ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    jump() { tone(240, 0.18, 'square', 0.05, null, 680); },
    coin() { tone(988, 0.07, 'square', 0.06); tone(1319, 0.28, 'square', 0.06, audio() ? actx.currentTime + 0.07 : null); },
    stomp() { tone(320, 0.1, 'square', 0.07, null, 90); },
    bump() { tone(110, 0.08, 'square', 0.08, null, 70); },
    break_() { tone(220, 0.12, 'sawtooth', 0.07, null, 60); tone(440, 0.08, 'square', 0.04); },
    power() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.09, 'square', 0.05, audio() ? actx.currentTime + i * 0.06 : null)); },
    shrink() { [784, 659, 523, 392].forEach((f, i) => tone(f, 0.09, 'square', 0.05, audio() ? actx.currentTime + i * 0.07 : null)); },
    kick() { tone(520, 0.08, 'square', 0.07, null, 260); },
    die() { [494, 466, 440, 349, 262, 196].forEach((f, i) => tone(f, 0.14, 'triangle', 0.08, audio() ? actx.currentTime + i * 0.11 : null)); },
    flag() { [523, 659, 784, 880, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.05, audio() ? actx.currentTime + i * 0.09 : null)); },
    tick() { tone(1200, 0.03, 'square', 0.03); },
    oneup() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0.1, 'square', 0.05, audio() ? actx.currentTime + i * 0.08 : null)); }
  };

  // Tiny two-channel chiptune loop
  const NOTE = (() => {
    const names = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    return (s) => {
      if (s === '-') return 0;
      const m = /^([A-G])(#?)(\d)$/.exec(s);
      const semi = names[m[1]] + (m[2] ? 1 : 0) + (Number(m[3]) + 1) * 12;
      return 440 * Math.pow(2, (semi - 69) / 12);
    };
  })();
  const LEAD = ('E4 - G4 - A4 - G4 - E4 - C4 - D4 - E4 - ' +
                'G4 - A4 - C5 - A4 - G4 - E4 - D4 - - - ' +
                'E4 - G4 - A4 - G4 - C5 - - - B4 - A4 - ' +
                'G4 - E4 - D4 - E4 - C4 - - - - - - -').split(' ');
  const BASS = ('C3 - - - G2 - - - A2 - - - G2 - - - ' +
                'F2 - - - C3 - - - G2 - - - G2 - - - ' +
                'C3 - - - A2 - - - F2 - - - G2 - - - ' +
                'C3 - - - G2 - - - C3 - - - G2 - - -').split(' ');
  const music = { on: false, step: 0, nextAt: 0, spb: 60 / 132 / 2 };
  function musicTick() {
    const ac = actx;
    if (!ac || muted || !music.on) return;
    while (music.nextAt < ac.currentTime + 0.12) {
      const i = music.step % LEAD.length;
      const l = LEAD[i], b = BASS[i];
      if (l !== '-') tone(NOTE(l), music.spb * 0.9, 'square', 0.022, music.nextAt);
      if (b !== '-') tone(NOTE(b), music.spb * 1.8, 'triangle', 0.05, music.nextAt);
      music.nextAt += music.spb;
      music.step++;
    }
  }
  function startMusic() {
    // Shared playlist owns the soundtrack when present.
    if (typeof BGM !== 'undefined') {
      music.on = false;
      BGM.play();
      return;
    }
    const ac = audio();
    if (!ac) return;
    music.on = true;
    if (music.nextAt < ac.currentTime) music.nextAt = ac.currentTime + 0.05;
  }
  function stopMusic() { music.on = false; }

  // ---------------------------------------------------------------- levels
  // Grid chars: . empty | # floor | X crate | B brick | ? beer case | M malt block
  // U used block | = shelf | C cooler | o coin | F flagpole | D door
  const SOLID = { '#': 1, X: 1, B: 1, '?': 1, M: 1, U: 1, '=': 1, C: 1 };

  function makeBuilder(width) {
    const g = [];
    for (let r = 0; r < ROWS; r++) g.push(new Array(width).fill('.'));
    const ents = [];
    const b = {
      width, grid: g, ents,
      put(x, y, ch) { if (x >= 0 && x < width && y >= 0 && y < ROWS) g[y][x] = ch; },
      row(x0, x1, y, ch) { for (let x = x0; x <= x1; x++) b.put(x, y, ch); },
      ground(x0, x1) { b.row(x0, x1, 13, '#'); b.row(x0, x1, 14, '#'); },
      col(x, y0, y1, ch) { for (let y = y0; y <= y1; y++) b.put(x, y, ch); },
      cooler(x, h) { for (let dy = 0; dy < h; dy++) { b.put(x, 12 - dy, 'C'); b.put(x + 1, 12 - dy, 'C'); } },
      stairsUp(x, h) { for (let i = 0; i < h; i++) b.col(x + i, 12 - i, 12, 'X'); },
      stairsDown(x, h) { for (let i = 0; i < h; i++) b.col(x + i, 12 - (h - 1 - i), 12, 'X'); },
      coins(x0, x1, y) { for (let x = x0; x <= x1; x++) b.put(x, y, 'o'); },
      rat(x, opts) { ents.push(Object.assign({ type: 'rat', x: x * TILE, y: 12 * TILE }, opts)); },
      bottle(x) { ents.push({ type: 'bottle', x: x * TILE, y: 11 * TILE }); },
      flag(x) { b.col(x, 3, 12, 'F'); },
      door(x) { b.put(x, 11, 'D'); b.put(x, 12, 'D'); }
    };
    return b;
  }

  function level1() {

  const LEVELS = [level1, level2, level3];

  const THEMES = {
    store: { floorA: '#948b7a', floorB: '#57503f', brick: '#b84c1c' },   // worn linoleum
    cellar: { floorA: '#5c5c60', floorB: '#38383e', brick: '#6e4a8c' },  // concrete
    dock: { floorA: '#5e5e66', floorB: '#3c3c44', brick: '#8c5424' }     // asphalt
  };

  // ---------------------------------------------------------------- state
  const HIGH_KEY = 'liquorRunHigh';
  const G = {
    mode: 'title', // title | play | dying | flag | walkoff | clear | gameover | complete | pause
    levelIdx: 0,
    level: null,
    grid: null,
    gridW: 0,
    cam: 0,
    time: 0,
    timeTick: 0,
    score: 0,
    high: Number(localStorage.getItem(HIGH_KEY) || 0),
    lives: 3,
    coins: 0,          // dollars collected this level (banked at the flag)
    banked: 0,         // dollars paid to the purse this run
    player: null,
    ents: [],
    spawns: [],
    items: [],
    pops: [],
    parts: [],
    floats: [],
    bumps: [],
    freeze: 0,
    clearTimer: 0,
    dieTimer: 0,
    flashMsg: null,
    anim: 0
  };
  const keys = { left: false, right: false, run: false, jump: false, jumpPressed: false };

  function newPlayer(spawn) {
    return {
      x: spawn.x, y: spawn.y,
      vx: 0, vy: 0,
      w: 10, h: 14,
      big: false,
      onGround: false,
      face: 1,
      walkAnim: 0,
      invuln: 0,
      skid: false
    };
  }

  function loadLevel(idx) {
    const def = LEVELS[idx]();
    G.level = def;
    G.grid = def.builder.grid.map(r => r.slice());
    G.gridW = def.builder.width;
    G.spawns = def.builder.ents.map(e => Object.assign({ live: false }, e));
    G.ents = [];
    G.items = [];
    G.pops = [];
    G.parts = [];
    G.floats = [];
    G.bumps = [];
    G.cam = 0;
    G.time = def.time;
    G.timeTick = 0;
    G.coins = 0;
    const keepBig = G.player && G.player.big;
    G.player = newPlayer(def.spawn);
    if (keepBig) setBig(G.player, true);
    G.mode = 'play';
    G.flashMsg = { text: def.name, t: 2 };
    findFlag();
    startMusic();
  }

  function setBig(p, big) {
    const bottom = p.y + p.h;
    p.big = big;
    p.h = big ? 26 : 14;
    p.y = bottom - p.h;
  }

  // ---------------------------------------------------------------- grid helpers
  function tileAt(tx, ty) {
    if (tx < 0 || tx >= G.gridW) return '#';
    if (ty < 0) return '.';
    if (ty >= ROWS) return '.';
    return G.grid[ty][tx];
  }
  function solidAt(tx, ty) { return SOLID[tileAt(tx, ty)] === 1; }
  function setTile(tx, ty, ch) {
    if (tx >= 0 && tx < G.gridW && ty >= 0 && ty < ROWS) G.grid[ty][tx] = ch;
  }

  function moveAndCollide(o, dt, opts) {
    // Horizontal
    o.x += o.vx * dt;
    if (o.vx > 0) {
      const tx = Math.floor((o.x + o.w) / TILE);
      const ty0 = Math.floor(o.y / TILE), ty1 = Math.floor((o.y + o.h - 1) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) {
        if (solidAt(tx, ty)) { o.x = tx * TILE - o.w - 0.01; if (opts && opts.bounce) o.vx = -o.vx; else o.vx = 0; o.hitWall = 1; break; }
      }
    } else if (o.vx < 0) {
      const tx = Math.floor(o.x / TILE);
      const ty0 = Math.floor(o.y / TILE), ty1 = Math.floor((o.y + o.h - 1) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) {
        if (solidAt(tx, ty)) { o.x = (tx + 1) * TILE + 0.01; if (opts && opts.bounce) o.vx = -o.vx; else o.vx = 0; o.hitWall = -1; break; }
      }
    }
    // Vertical
    o.y += o.vy * dt;
    o.onGround = false;
    if (o.vy > 0) {
      const ty = Math.floor((o.y + o.h) / TILE);
      const tx0 = Math.floor((o.x + 1) / TILE), tx1 = Math.floor((o.x + o.w - 1) / TILE);
      for (let tx = tx0; tx <= tx1; tx++) {
        if (solidAt(tx, ty)) { o.y = ty * TILE - o.h - 0.01; o.vy = 0; o.onGround = true; break; }
      }
    } else if (o.vy < 0) {
      const ty = Math.floor(o.y / TILE);
      const tx0 = Math.floor((o.x + 1) / TILE), tx1 = Math.floor((o.x + o.w - 1) / TILE);
      let best = -1;
      for (let tx = tx0; tx <= tx1; tx++) {
        if (solidAt(tx, ty)) {
          o.y = (ty + 1) * TILE + 0.01;
          o.vy = 0;
          // Pick the tile most overlapped by the head for the bump
          if (opts && opts.headBump && best < 0) best = tx;
        }
      }
      if (best >= 0 && opts && opts.headBump) opts.headBump(best, ty);
    }
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------------------------------------------------------------- gameplay
  function addFloat(x, y, text, color) {
    G.floats.push({ x, y, text, color: color || '#f8f8f0', t: 0.9 });
  }
  function addScore(n, x, y) {
    G.score += n;
    if (x != null) addFloat(x, y, String(n));
  }
  function collectCoin(x, y) {
    G.coins += 1;
    addScore(100, null);
    addFloat(x, y, '$1', '#ffd23f');
    sfx.coin();
  }

  function bumpBlock(tx, ty) {
    const ch = tileAt(tx, ty);
    const p = G.player;
    if (ch === '?') {
      // Beer cases never empty — each head-bonk advances the game calendar a week.
      G.bumps.push({ tx, ty, t: 0.18 });
      sfx.bump();
      if (window.Wallet && typeof Wallet.advanceWeek === 'function') Wallet.advanceWeek(1);
      addFloat(tx * TILE + 2, ty * TILE - 10, '+1 WK', '#ffd23f');
    } else if (ch === 'M') {
      setTile(tx, ty, 'U');
      G.bumps.push({ tx, ty, t: 0.18 });
      G.items.push({ type: 'forty', x: tx * TILE + 2, y: ty * TILE, vx: 0, vy: 0, w: 12, h: 14, rise: 14, dir: 1 });
      sfx.power();
    } else if (ch === 'B') {
      if (p.big) {
        setTile(tx, ty, '.');
        addScore(50, null);
        sfx.break_();
        for (let i = 0; i < 4; i++) {
          G.parts.push({
            x: tx * TILE + 8, y: ty * TILE + 8,
            vx: (i % 2 ? 70 : -70) * (0.7 + Math.random() * 0.6),
            vy: -180 - Math.random() * 100,
            t: 0.9, color: THEMES[G.level.theme].brick
          });
        }
      } else {
        G.bumps.push({ tx, ty, t: 0.18 });
        sfx.bump();
      }
    } else {
      sfx.bump();
    }
  }

  function hurtPlayer() {
    const p = G.player;
    if (p.invuln > 0) return;
    if (p.big) {
      setBig(p, false);
      p.invuln = 2;
      sfx.shrink();
    } else {
      killPlayer();
    }
  }

  function killPlayer() {
    if (G.mode !== 'play') return;
    G.mode = 'dying';
    G.dieTimer = 0;
    G.player.vy = -280;
    G.player.vx = 0;
    stopMusic();
    sfx.die();
  }

  function afterDeath() {
    G.lives -= 1;
    if (G.lives <= 0) {
      G.mode = 'gameover';
      if (G.score > G.high) { G.high = G.score; localStorage.setItem(HIGH_KEY, String(G.high)); }
    } else {
      loadLevel(G.levelIdx);
    }
  }

  function startFlag() {
    const p = G.player;
    G.mode = 'flag';
    G.timeAtFlag = G.time;
    stopMusic();
    sfx.flag();
    const flagX = G.flagTx * TILE;
    p.x = flagX - p.w - 1;
    p.vx = 0; p.vy = 0;
    // Height bonus like the flagpole: higher grab = more points
    const grabRow = Math.floor((p.y + p.h) / TILE);
    const bonus = Math.max(1, (12 - grabRow)) * 100;
    addScore(bonus, p.x, p.y - 8);
  }

  function bankLevel() {
    const timeBonus = Math.floor((G.timeAtFlag || 0) / 10);
    const pay = G.coins * 2 + 25 + timeBonus;
    G.banked += pay;
    // Payday is direct deposit — it lands on the phone, never in hand.
    Wallet.add(pay);
    return pay;
  }

  // Liquor is a cash business. The forty's sticker price rides inflation.
  const FORTY_BASE_PRICE = 8;
  function fortyPrice() { return Math.ceil(FORTY_BASE_PRICE * Wallet.priceMult()); }

  // ---------------------------------------------------------------- update
  function findFlag() {
    G.flagTx = -1;
    G.doorTx = -1;
    for (let x = 0; x < G.gridW; x++) {
      if (G.grid[5][x] === 'F') G.flagTx = x;
      if (G.grid[11][x] === 'D') G.doorTx = x;
    }
  }

  function spawnEnts() {
    const edge = G.cam + W + 24;
    for (const s of G.spawns) {
      if (s.live || s.x > edge) continue;
      s.live = true;
      if (s.type === 'rat') {
        G.ents.push({ kind: 'rat', x: s.x, y: s.y + (16 - 10), vx: -(s.fast ? 55 : 30), vy: 0, w: 14, h: 10, anim: 0, squash: 0, fast: !!s.fast });
      } else if (s.type === 'bottle') {
        G.ents.push({ kind: 'bottle', state: 'walk', x: s.x, y: s.y + (32 - 16), vx: -26, vy: 0, w: 10, h: 16, anim: 0, idleT: 0 });
      }
    }
  }

  function updatePlayer(dt) {
    const p = G.player;
    const max = keys.run ? PHYS.runMax : PHYS.walkMax;
    const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    p.skid = false;

    if (want !== 0) {
      p.face = want;
      const acc = p.onGround ? PHYS.accel : PHYS.airAccel;
      if (p.onGround && Math.sign(p.vx) === -want && Math.abs(p.vx) > 30) {
        p.vx += want * PHYS.skid * dt;
        p.skid = true;
      } else {
        p.vx += want * acc * dt;
      }
      p.vx = Math.max(-max, Math.min(max, p.vx));
    } else if (p.onGround) {
      const f = PHYS.friction * dt;
      if (Math.abs(p.vx) <= f) p.vx = 0;
      else p.vx -= Math.sign(p.vx) * f;
    }

    if (keys.jumpPressed && p.onGround) {
      p.vy = PHYS.jumpV - Math.abs(p.vx) * 0.14;
      p.onGround = false;
      sfx.jump();
    }
    keys.jumpPressed = false;

    const g = p.vy < 0 ? (keys.jump ? PHYS.gravHold : PHYS.gravRise) : PHYS.gravFall;
    p.vy = Math.min(PHYS.fallCap, p.vy + g * dt);

    moveAndCollide(p, dt, { headBump: (tx, ty) => bumpBlock(tx, ty) });

    // Forward-only camera; can't walk off the left edge of the screen
    if (p.x < G.cam + 2) { p.x = G.cam + 2; p.vx = Math.max(0, p.vx); }
    const target = p.x - Math.max(100, Math.round(W * 0.4));
    if (target > G.cam) G.cam = Math.min(target, G.gridW * TILE - W);

    if (p.invuln > 0) p.invuln -= dt;

    // Coin pickup + flag + pit
    const tx0 = Math.floor(p.x / TILE), tx1 = Math.floor((p.x + p.w) / TILE);
    const ty0 = Math.floor(p.y / TILE), ty1 = Math.floor((p.y + p.h) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (tileAt(tx, ty) === 'o') { setTile(tx, ty, '.'); collectCoin(tx * TILE + 4, ty * TILE); }
      }
    }
    if (G.flagTx >= 0 && p.x + p.w >= G.flagTx * TILE + 6) startFlag();
    if (p.y > H + 24) killPlayer();

    if (Math.abs(p.vx) > 4 && p.onGround) p.walkAnim += Math.abs(p.vx) * dt * 0.16;
  }

  function updateEnts(dt) {
    const p = G.player;
    for (const e of G.ents) {
      if (e.dead) continue;
      if (e.squash > 0) {
        e.squash -= dt;
        if (e.squash <= 0) e.dead = true;
        continue;
      }
      e.anim += dt;

      if (e.kind === 'rat') {
        e.vy = Math.min(PHYS.fallCap, e.vy + PHYS.gravFall * dt);
        moveAndCollide(e, dt, { bounce: true });
      } else if (e.kind === 'bottle') {
        if (e.state === 'walk') {
          e.vy = Math.min(PHYS.fallCap, e.vy + PHYS.gravFall * dt);
          moveAndCollide(e, dt, { bounce: true });
        } else if (e.state === 'idle') {
          e.vx = 0;
          e.vy = Math.min(PHYS.fallCap, e.vy + PHYS.gravFall * dt);
          moveAndCollide(e, dt, {});
          e.idleT += dt;
          if (e.idleT > 6) { e.state = 'walk'; e.h = 16; e.y -= 8; e.vx = -26; }
        } else if (e.state === 'roll') {
          e.vy = Math.min(PHYS.fallCap, e.vy + PHYS.gravFall * dt);
          moveAndCollide(e, dt, { bounce: true });
          if (e.hitWall) { sfx.bump(); e.hitWall = 0; }
          // Rolling bottle wipes out other enemies
          for (const o of G.ents) {
            if (o === e || o.dead || o.squash > 0) continue;
            if (overlap(e, o)) {
              o.squash = 0.001; o.vx = 0;
              addScore(200, o.x, o.y - 8);
              sfx.kick();
            }
          }
        }
      }
      if (e.y > H + 40) e.dead = true;
      if (e.noHurt > 0) e.noHurt -= dt;

      // Player contact
      if (G.mode === 'play' && overlap(p, e)) {
        const falling = p.vy > 40;
        const above = p.y + p.h - e.y < 10;
        if (e.kind === 'rat') {
          if (falling && above) {
            e.squash = 0.5; e.vx = 0;
            addScore(100, e.x, e.y - 8);
            p.vy = keys.jump ? -300 : -180;
            sfx.stomp();
          } else hurtPlayer();
        } else if (e.kind === 'bottle') {
          if (e.state === 'walk') {
            if (falling && above) {
              e.state = 'idle'; e.idleT = 0;
              e.h = 8; e.y += 8; e.vx = 0;
              addScore(100, e.x, e.y - 8);
              p.vy = keys.jump ? -300 : -180;
              sfx.stomp();
            } else hurtPlayer();
          } else if (e.state === 'idle') {
            // Kick it
            e.state = 'roll';
            e.w = 16; e.h = 8;
            e.vx = (p.x + p.w / 2 < e.x + e.w / 2 ? 1 : -1) * 175;
            e.y -= 1;
            e.noHurt = 0.3;
            addScore(50, null);
            sfx.kick();
            p.vy = falling ? -180 : p.vy;
          } else if (e.state === 'roll') {
            if (falling && above) {
              e.state = 'idle'; e.vx = 0; e.idleT = 0;
              p.vy = keys.jump ? -300 : -180;
              sfx.stomp();
            } else if (!(e.noHurt > 0)) hurtPlayer();
          }
        }
      }
    }
    G.ents = G.ents.filter(e => !e.dead);
  }

  function updateItems(dt) {
    const p = G.player;
    for (const it of G.items) {
      if (it.rise > 0) {
        const d = Math.min(it.rise, 22 * dt);
        it.y -= d; it.rise -= d;
        if (it.rise <= 0) it.vx = 42;
        continue;
      }
      it.vy = Math.min(PHYS.fallCap, it.vy + PHYS.gravFall * dt);
      moveAndCollide(it, dt, { bounce: true });
      if (it.y > H + 40) it.dead = true;
      if (it.denyT > 0) it.denyT -= dt;
      if (G.mode === 'play' && overlap(p, it)) {
        // No paper, no forty — the counter doesn't take the phone.
        const price = fortyPrice();
        if (!Wallet.spendCash(price)) {
          if (!(it.denyT > 0)) {
            addFloat(it.x, it.y - 18, `CASH ONLY — $${price}`, '#ff6a5a');
            it.denyT = 1.2;
          }
          continue;
        }
        it.dead = true;
        addFloat(it.x, it.y - 30, `-$${price} CASH`, '#8fd989');
        if (p.big) {
          addScore(1000, it.x, it.y - 8);
          G.coins += 3;
          addFloat(it.x, it.y - 18, '$3', '#ffd23f');
          sfx.oneup();
        } else {
          setBig(p, true);
          addScore(1000, it.x, it.y - 8);
          addFloat(it.x, it.y - 18, '40oz!', '#c89858');
          sfx.power();
        }
      }
    }
    G.items = G.items.filter(i => !i.dead);
  }

  function updateFx(dt) {
    for (const c of G.pops) { c.t -= dt; c.y += c.vy * dt; c.vy += 900 * dt; }
    G.pops = G.pops.filter(c => c.t > 0);
    for (const pt of G.parts) { pt.t -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 700 * dt; }
    G.parts = G.parts.filter(pt => pt.t > 0);
    for (const f of G.floats) { f.t -= dt; f.y -= 26 * dt; }
    G.floats = G.floats.filter(f => f.t > 0);
    for (const bmp of G.bumps) bmp.t -= dt;
    G.bumps = G.bumps.filter(bmp => bmp.t > 0);
    if (G.flashMsg) { G.flashMsg.t -= dt; if (G.flashMsg.t <= 0) G.flashMsg = null; }
  }

  function update(dt) {
    G.anim += dt;
    musicTick();

    if (G.mode === 'play') {
      G.timeTick += dt;
      while (G.timeTick > 1 / 2.4) {
        G.timeTick -= 1 / 2.4;
        G.time -= 1;
        if (G.time === 60) sfx.tick();
        if (G.time <= 0) { G.time = 0; killPlayer(); }
      }
      spawnEnts();
      updatePlayer(dt);
      if (G.mode === 'play') {
        updateEnts(dt);
        updateItems(dt);
      }
    } else if (G.mode === 'dying') {
      G.dieTimer += dt;
      const p = G.player;
      if (G.dieTimer > 0.35) {
        p.vy = Math.min(PHYS.fallCap, p.vy + PHYS.gravFall * dt);
        p.y += p.vy * dt;
      }
      if (G.dieTimer > 2.4) afterDeath();
    } else if (G.mode === 'flag') {
      const p = G.player;
      p.y += 110 * dt;
      const floorY = 13 * TILE - p.h;
      if (p.y >= floorY) {
        p.y = floorY;
        p.onGround = true;
        G.mode = 'walkoff';
        p.face = 1;
      }
    } else if (G.mode === 'walkoff') {
      const p = G.player;
      p.vx = 70;
      p.walkAnim += 12 * dt;
      p.x += p.vx * dt;
      // Drain remaining time into the payout ticker
      if (G.time > 0) {
        G.time = Math.max(0, G.time - Math.ceil(200 * dt));
      }
      if (p.x >= G.doorTx * TILE + 2) {
        G.mode = 'clear';
        G.clearTimer = 0;
        G.lastPay = bankLevel();
        if (G.score > G.high) { G.high = G.score; localStorage.setItem(HIGH_KEY, String(G.high)); }
      }
    } else if (G.mode === 'clear') {
      G.clearTimer += dt;
      if (G.clearTimer > 3) {
        if (G.levelIdx + 1 < LEVELS.length) {
          G.levelIdx += 1;
          loadLevel(G.levelIdx);
        } else {
          G.mode = 'complete';
          stopMusic();
        }
      }
    }
    updateFx(dt);
  }

  // ---------------------------------------------------------------- render
  function px(n) { return Math.round(n); }

  // Iterate a repeating pattern in parallax world-space across the visible screen
  function worldIter(par, spacing, fn) {
    const off = G.cam * par;
    const i0 = Math.floor(off / spacing) - 1;
    const n = Math.ceil(W / spacing) + 3;
    for (let i = i0; i < i0 + n; i++) fn(px(i * spacing - off), i);
  }
  function hash32(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n = ((n ^ (n >>> 4)) * 0x27d4eb2d) | 0;
    return (n ^ (n >>> 15)) >>> 0;
  }

  const WALL_SIGNS = [
    { t: 'OLD STYLE', fg: '#f0ead8', bg: '#0c2c50', bd: '#c8102e' },
    { t: 'COLD BEER', fg: '#6cd2ff', bg: '#0c1c30', bd: '#2a5a8a' },
    { t: 'LOTTO', fg: '#ffd23f', bg: '#1c1028', bd: '#8a2ac8' },
    { t: 'LINK OK', fg: '#7ce87c', bg: '#0c2010', bd: '#2a6a2a' },
    { t: 'MALORT', fg: '#e8c060', bg: '#241a08', bd: '#8a6a2a' }
  ];

  function drawBrickBand(y0, y1, par, base, mortar, dark) {
    ctx.fillStyle = mortar;
    ctx.fillRect(0, y0, W, y1 - y0);
    worldIter(par, 16, (sx, i) => {
      for (let y = y0, row = 0; y < y1; y += 8, row++) {
        const bx = sx + (row % 2 ? 8 : 0);
        const h = hash32(i * 131 + row * 17);
        ctx.fillStyle = h % 7 === 0 ? dark : base;
        ctx.fillRect(bx, y, 15, Math.min(7, y1 - y));
      }
    });
  }

  // A single shelf bottle with a real silhouette: body, shoulder, neck, cap, label
  function drawShelfBottle(sx, by, h, row) {
    const GLASS = ['#4a2808', '#1e4a1e', '#a8c4d0', '#301a06', '#3c5222'];
    const LIQ = ['#b06818', '#8a2020', '#caa64c', '#7a4a10'];
    const CAP = ['#181818', '#c8102e', '#caa64c', '#e8e8e8'];
    const LABEL = ['#f0ead8', '#e8d8b0', '#f8f4e8'];
    const STRIPE = ['#c8102e', '#1e3c78', '#2a6a2a', '#8a2ac8', '#e88a10'];
    const glass = GLASS[h % 5];
    const clear = h % 5 === 2;
    const cap = CAP[(h >> 5) % 4];
    const label = LABEL[(h >> 8) % 3];
    const stripe = STRIPE[(h >> 11) % 5];
    const kinds = [
      ['pint', 'cans', 'pint', 'fifth'],
      ['fifth', 'wine', 'fifth', 'wine'],
      ['forty', 'fifth', 'forty', 'wine']
    ];
    const kind = kinds[row][(h >> 2) % 4];

    if (kind === 'cans') {
      // six-pack pair
      for (let c = 0; c < 2; c++) {
        const cx2 = sx + c * 6;
        ctx.fillStyle = '#c8ccd0';
        ctx.fillRect(cx2, by - 8, 5, 2);
        ctx.fillStyle = (h >> (c * 3)) % 2 ? '#1e3c78' : '#a02020';
        ctx.fillRect(cx2, by - 6, 5, 6);
        ctx.fillStyle = '#e8e8e8';
        ctx.fillRect(cx2, by - 4, 5, 1);
      }
      return;
    }
    if (kind === 'pint') {
      ctx.fillStyle = glass;
      ctx.fillRect(sx, by - 9, 6, 9);
      ctx.fillRect(sx + 2, by - 12, 2, 3);
      if (clear) { ctx.fillStyle = LIQ[(h >> 3) % 4]; ctx.fillRect(sx + 1, by - 7, 4, 6); }
      ctx.fillStyle = cap;
      ctx.fillRect(sx + 2, by - 13, 2, 1);
      ctx.fillStyle = label;
      ctx.fillRect(sx + 1, by - 7, 4, 4);
      ctx.fillStyle = stripe;
      ctx.fillRect(sx + 1, by - 5, 4, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(sx + 1, by - 9, 1, 8);
      return;
    }
    if (kind === 'wine') {
      ctx.fillStyle = glass;
      ctx.fillRect(sx + 1, by - 13, 5, 13);
      ctx.fillRect(sx + 2, by - 15, 3, 2);
      ctx.fillRect(sx + 3, by - 20, 2, 5);
      ctx.fillStyle = stripe;
      ctx.fillRect(sx + 3, by - 22, 2, 2);
      ctx.fillStyle = label;
      ctx.fillRect(sx + 2, by - 10, 3, 5);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(sx + 2, by - 13, 1, 12);
      return;
    }
    if (kind === 'forty') {
      ctx.fillStyle = glass;
      ctx.fillRect(sx, by - 16, 8, 16);
      ctx.fillRect(sx + 1, by - 18, 6, 2);
      ctx.fillRect(sx + 2, by - 22, 4, 4);
      if (clear) { ctx.fillStyle = LIQ[(h >> 3) % 4]; ctx.fillRect(sx + 1, by - 14, 6, 13); }
      ctx.fillStyle = '#caa64c';
      ctx.fillRect(sx + 2, by - 24, 4, 2);
      ctx.fillStyle = label;
      ctx.fillRect(sx + 1, by - 13, 6, 7);
      ctx.fillStyle = stripe;
      ctx.fillRect(sx + 1, by - 9, 6, 2);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(sx + 1, by - 16, 1, 15);
      return;
    }
    // fifth
    ctx.fillStyle = glass;
    ctx.fillRect(sx, by - 13, 7, 13);
    ctx.fillRect(sx + 1, by - 15, 5, 2);
    ctx.fillRect(sx + 2, by - 19, 3, 4);
    if (clear) { ctx.fillStyle = LIQ[(h >> 3) % 4]; ctx.fillRect(sx + 1, by - 11, 5, 10); }
    ctx.fillStyle = cap;
    ctx.fillRect(sx + 2, by - 21, 3, 2);
    ctx.fillStyle = label;
    ctx.fillRect(sx + 1, by - 10, 5, 5);
    ctx.fillStyle = stripe;
    ctx.fillRect(sx + 1, by - 7, 5, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(sx + 1, by - 13, 1, 12);
  }

  function drawShelves(par, cellar) {
    const top = 96, bottom = 207;
    ctx.fillStyle = cellar ? '#1c1410' : '#33200f';
    ctx.fillRect(0, top, W, bottom - top);
    const boards = [131, 169, 205];
    boards.forEach((by, row) => {
      worldIter(par, 12, (sx, i) => {
        const h = hash32(i * 97 + row * 389 + (cellar ? 7777 : 0));
        if (h % 6 === 0) return; // sold out slot
        if (cellar && h % 4 === 0) {
          // stacked stock crate
          ctx.fillStyle = '#6e4a20';
          ctx.fillRect(sx, by - 10, 11, 10);
          ctx.fillStyle = '#42280e';
          ctx.fillRect(sx, by - 10, 11, 1);
          ctx.fillRect(sx, by - 1, 11, 1);
          ctx.fillRect(sx, by - 10, 1, 10);
          ctx.fillRect(sx + 10, by - 10, 1, 10);
          ctx.fillRect(sx + 2, by - 7, 7, 2);
          return;
        }
        drawShelfBottle(sx + ((h >> 4) % 3), by, h, row);
      });
      ctx.fillStyle = '#8a5a28';
      ctx.fillRect(0, by, W, 4);
      ctx.fillStyle = '#c89858';
      ctx.fillRect(0, by, W, 1);
      ctx.fillStyle = '#54360f';
      ctx.fillRect(0, by + 3, W, 1);
      // price tags clipped to the shelf edge
      worldIter(par, 44, (sx, i) => {
        if (hash32(i * 53 + row * 7) % 3) return;
        ctx.fillStyle = '#ffe9a0';
        ctx.fillRect(sx, by + 1, 6, 3);
        ctx.fillStyle = '#a05800';
        ctx.fillRect(sx + 1, by + 2, 4, 1);
      });
    });
    // shelf unit uprights
    worldIter(par, 128, (sx) => {
      ctx.fillStyle = cellar ? '#0e0a08' : '#231507';
      ctx.fillRect(sx, top, 4, bottom - top);
    });
  }

  function drawStreetWindows(par) {
    worldIter(par, 300, (sx, i) => {
      const wy = 36, ww = 150, wh = 54;
      if (sx < W && sx + ww > 0) {
        // glass scene: two-flats, El track, passing CTA train
        ctx.save();
        ctx.beginPath();
        ctx.rect(sx + 3, wy + 3, ww - 6, wh - 6);
        ctx.clip();
        ctx.fillStyle = '#0e1624';
        ctx.fillRect(sx + 3, wy + 3, ww - 6, wh - 6);
        const trackY = wy + wh - 16;
        for (let b = 0; b < 5; b++) {
          const bh = 16 + hash32(i * 17 + b) % 14;
          const bx = sx + 3 + b * 32 - 8;
          ctx.fillStyle = '#221a26';
          ctx.fillRect(bx, trackY - bh + 4, 26, bh);
          ctx.fillStyle = '#3a2c3e';
          ctx.fillRect(bx, trackY - bh + 4, 26, 2);
          const lit = hash32(i * 91 + b * 7);
          ctx.fillStyle = '#e8c060';
          for (let wl = 0; wl < 4; wl++) {
            if ((lit >> wl) & 1) ctx.fillRect(bx + 4 + (wl % 2) * 13, trackY - bh + 8 + ((wl / 2) | 0) * 9, 4, 5);
          }
        }
        // elevated track
        ctx.fillStyle = '#2e2e38';
        ctx.fillRect(sx, trackY, ww, 3);
        for (let post = 0; post < ww; post += 24) {
          ctx.fillRect(sx + post, trackY + 3, 3, 12);
        }
        // CTA train (shared screen position so it passes every window)
        const trainX = W + 260 - ((G.anim * 130) % 2800);
        for (let car = 0; car < 3; car++) {
          const cx2 = trainX + car * 40;
          ctx.fillStyle = '#9aa0a8';
          ctx.fillRect(cx2, trackY - 11, 36, 11);
          ctx.fillStyle = '#ffe9a0';
          for (let wn = 0; wn < 5; wn++) ctx.fillRect(cx2 + 3 + wn * 7, trackY - 9, 4, 4);
          ctx.fillStyle = '#c8102e';
          ctx.fillRect(cx2, trackY - 4, 36, 1);
          ctx.fillStyle = '#20242c';
          ctx.fillRect(cx2, trackY - 1, 36, 1);
        }
        // street level glow
        ctx.fillStyle = '#2c261c';
        ctx.fillRect(sx, wy + wh - 6, ww, 6);
        ctx.restore();
        // frame + backwards lettering (seen from inside the store)
        ctx.strokeStyle = '#6a4620';
        ctx.lineWidth = 3;
        ctx.strokeRect(sx + 1.5, wy + 1.5, ww - 3, wh - 3);
        ctx.fillStyle = 'rgba(202,166,76,0.6)';
        ctx.font = '5px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ROUQIL', sx + ww / 2, wy + 11);
      }
      // hanging sign on the brick between windows
      const sd = WALL_SIGNS[((i % WALL_SIGNS.length) + WALL_SIGNS.length) % WALL_SIGNS.length];
      const gx = sx + ww + 28, gy = 44;
      ctx.fillStyle = sd.bg;
      ctx.fillRect(gx, gy, 80, 22);
      ctx.strokeStyle = sd.bd;
      ctx.lineWidth = 2;
      ctx.strokeRect(gx + 1, gy + 1, 78, 20);
      const on = Math.floor(G.anim * 2 + i * 3) % 9 !== 8;
      ctx.fillStyle = on ? sd.fg : '#3a3a40';
      ctx.font = '7px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(sd.t, gx + 40, gy + 14);
    });
  }

  function drawStoreBg(theme) {
    const cellar = theme === 'cellar';
    const par = 0.4;
    // brick above the shelving
    if (cellar) drawBrickBand(30, 96, par, '#3a2a2c', '#221618', '#2c1e20');
    else drawBrickBand(30, 96, par, '#6b3226', '#43201a', '#54241c');

    if (cellar) {
      // painted stencil + hanging bulbs
      worldIter(par, 340, (sx, i) => {
        ctx.fillStyle = 'rgba(240,234,216,0.45)';
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(i % 2 ? 'STOCK ROOM' : 'EMPLOYEES ONLY', sx + 80, 66);
      });
    } else {
      drawStreetWindows(par);
    }

    drawShelves(par, cellar);

    // ceiling strip
    ctx.fillStyle = cellar ? '#101012' : '#141014';
    ctx.fillRect(0, 0, W, 30);
    if (cellar) {
      ctx.fillStyle = '#2e3038';
      ctx.fillRect(0, 20, W, 4);
      ctx.fillStyle = '#3c3e48';
      ctx.fillRect(0, 25, W, 3);
      worldIter(par, 90, (sx, i) => {
        ctx.fillStyle = '#22242c';
        ctx.fillRect(sx, 19, 3, 10);
        if (i % 2) {
          ctx.fillStyle = '#55524a';
          ctx.fillRect(sx + 45, 28, 1, 8);
          ctx.fillStyle = '#ffe9a0';
          ctx.fillRect(sx + 44, 36, 3, 4);
          ctx.fillStyle = 'rgba(255,233,160,0.06)';
          ctx.beginPath();
          ctx.moveTo(sx + 45, 38);
          ctx.lineTo(sx + 22, 96);
          ctx.lineTo(sx + 69, 96);
          ctx.closePath();
          ctx.fill();
        }
      });
    } else {
      // fluorescent tube fixtures
      worldIter(par, 120, (sx) => {
        ctx.fillStyle = '#08080a';
        ctx.fillRect(sx + 22, 22, 2, 5);
        ctx.fillRect(sx + 50, 22, 2, 5);
        ctx.fillStyle = '#e8f0e8';
        ctx.fillRect(sx + 14, 27, 46, 4);
        ctx.fillStyle = 'rgba(230,255,230,0.05)';
        ctx.fillRect(sx + 6, 31, 62, 64);
      });
    }
  }

  function drawChiSkyline(sx, i) {
    const hy = 152;
    // filler mid-rises
    ctx.fillStyle = '#131b2b';
    ctx.fillRect(sx, hy - 34, 26, 34);
    ctx.fillRect(sx + 34, hy - 50, 22, 50);
    ctx.fillRect(sx + 62, hy - 40, 30, 40);
    ctx.fillRect(sx + 178, hy - 44, 26, 44);
    ctx.fillRect(sx + 210, hy - 58, 22, 58);
    ctx.fillRect(sx + 320, hy - 46, 30, 46);
    ctx.fillRect(sx + 356, hy - 36, 26, 36);
    ctx.fillRect(sx + 388, hy - 54, 24, 54);
    // Sears / Willis Tower: stepped tube sections + twin antennas
    const wx = sx + 110;
    ctx.fillStyle = '#0f1626';
    ctx.fillRect(wx, hy - 66, 26, 66);
    ctx.fillRect(wx + 3, hy - 84, 20, 18);
    ctx.fillRect(wx + 7, hy - 98, 12, 14);
    ctx.fillStyle = '#252c3c';
    ctx.fillRect(wx + 9, hy - 112, 2, 14);
    ctx.fillRect(wx + 15, hy - 110, 2, 12);
    // Hancock: tapered with X hint + antennas
    const hx = sx + 252;
    ctx.fillStyle = '#111928';
    ctx.fillRect(hx, hy - 20, 24, 20);
    ctx.fillRect(hx + 2, hy - 38, 20, 18);
    ctx.fillRect(hx + 4, hy - 56, 16, 18);
    ctx.fillRect(hx + 6, hy - 72, 12, 16);
    ctx.fillStyle = '#252c3c';
    ctx.fillRect(hx + 8, hy - 84, 2, 12);
    ctx.fillRect(hx + 14, hy - 84, 2, 12);
    // blinking beacons
    if (Math.floor(G.anim * 1.4 + i) % 2) {
      ctx.fillStyle = '#ff3030';
      ctx.fillRect(wx + 9, hy - 113, 2, 2);
      ctx.fillRect(hx + 8, hy - 85, 2, 2);
    }
    // scattered lit windows
    ctx.fillStyle = 'rgba(232,192,96,0.8)';
    for (let l = 0; l < 26; l++) {
      const h = hash32(i * 511 + l * 29);
      const lx = sx + (h % 400);
      const ly = hy - 6 - (h >> 4) % 56;
      if ((h >> 9) % 3) ctx.fillRect(lx, ly, 2, 2);
    }
  }

  function drawDockBg() {
    ctx.fillStyle = '#0a1020';
    ctx.fillRect(0, 0, W, H);
    // stars
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
      const sx = hash32(i * 7 + 3) % W;
      const sy = hash32(i * 13 + 1) % 92;
      if (i % 5 !== 0 || Math.floor(G.anim * 2 + i) % 2) ctx.fillRect(sx, sy, 1, 1);
    }
    // Chicago skyline far off
    worldIter(0.12, 430, drawChiSkyline);
    // near warehouses
    worldIter(0.3, 200, (sx, i) => {
      const bh = 20 + hash32(i * 31) % 18;
      ctx.fillStyle = '#0c121c';
      ctx.fillRect(sx, 152 - bh, 96, bh);
      const hh = hash32(i * 77);
      if (hh % 3 === 0) {
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(sx + 8 + (hh % 40), 152 - bh + 6, 3, 3);
      }
    });
    // ground haze behind the dock
    ctx.fillStyle = '#0d1420';
    ctx.fillRect(0, 152, W, H - 152);
    // chain-link fence line
    worldIter(0.55, 26, (sx) => {
      ctx.fillStyle = '#252c38';
      ctx.fillRect(sx, 160, 2, 26);
    });
    ctx.fillStyle = '#2c3442';
    ctx.fillRect(0, 158, W, 2);
  }

  function drawBackground(theme) {
    if (theme === 'dock') drawDockBg();
    else drawStoreBg(theme);
    // pull the backdrop down a notch so foreground tiles and sprites pop
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, W, H);
  }

  function drawTile(ch, sx, sy, tx, ty, T) {
    switch (ch) {
      case '#': {
        // checkered lino / concrete floor
        ctx.fillStyle = T.floorA;
        ctx.fillRect(sx, sy, TILE, TILE);
        if ((tx + ty) % 2) {
          ctx.fillStyle = 'rgba(0,0,0,0.14)';
          ctx.fillRect(sx, sy, TILE, TILE);
        }
        ctx.fillStyle = T.floorB;
        ctx.fillRect(sx, sy, 1, TILE);
        ctx.fillRect(sx, sy + TILE - 1, TILE, 1);
        if (tileAt(tx, ty - 1) !== '#') {
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fillRect(sx, sy, TILE, 2);
        }
        break;
      }
      case 'X': {
        ctx.fillStyle = '#a87838';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.strokeStyle = '#6e4a1c';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 2); ctx.lineTo(sx + 14, sy + 14);
        ctx.moveTo(sx + 14, sy + 2); ctx.lineTo(sx + 2, sy + 14);
        ctx.stroke();
        break;
      }
      case 'B': {
        ctx.fillStyle = T.brick;
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(sx, sy + 7, TILE, 2);
        ctx.fillRect(sx + 7, sy, 2, 7);
        ctx.fillRect(sx + 3, sy + 9, 2, 7);
        ctx.fillRect(sx + 11, sy + 9, 2, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(sx, sy, TILE, 1);
        break;
      }
      case '?': {
        // 24-pack beer case — cardboard sleeve, bottle-cap row on top
        ctx.fillStyle = '#8a6230';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#6e4a1c';
        ctx.fillRect(sx, sy + 11, TILE, 5);
        ctx.fillStyle = '#a87838';
        ctx.fillRect(sx + 1, sy + 1, TILE - 2, 9);
        ctx.fillStyle = '#3a2810';
        ctx.fillRect(sx + 1, sy + 9, TILE - 2, 2);
        // bottle crowns peeking out
        for (let i = 0; i < 4; i++) {
          const bx = sx + 2 + i * 3.5;
          ctx.fillStyle = i % 2 ? '#2a6a28' : '#1e4a1c';
          ctx.fillRect(bx, sy + 2, 3, 5);
          ctx.fillStyle = '#c8a040';
          ctx.fillRect(bx, sy + 1, 3, 2);
        }
        ctx.strokeStyle = '#4a3010';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
        ctx.fillStyle = '#f0e0a0';
        ctx.font = '4px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('24', sx + 8, sy + 15);
        break;
      }
      case 'M': {
        const blink = Math.floor(G.anim * 4) % 4 === 3;
        ctx.fillStyle = blink ? '#fcd868' : '#f8b800';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.strokeStyle = '#a05800';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
        ctx.fillStyle = '#a05800';
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('?', sx + 8, sy + 12);
        break;
      }
      case 'U': {
        ctx.fillStyle = '#8c5a2c';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.strokeStyle = '#5c3a18';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
        break;
      }
      case '=': {
        ctx.fillStyle = '#2c8c8c';
        ctx.fillRect(sx, sy, TILE, 6);
        ctx.fillStyle = '#1a5c5c';
        ctx.fillRect(sx, sy + 4, TILE, 2);
        ctx.fillStyle = '#18404c';
        ctx.fillRect(sx + 6, sy + 6, 4, 10);
        break;
      }
      case 'C': {
        ctx.fillStyle = '#dce8f0';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#7ab0d0';
        ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(sx + 3, sy + 3, 3, TILE - 6);
        if (tileAt(tx, ty - 1) !== 'C') {
          ctx.fillStyle = '#3c5064';
          ctx.fillRect(sx, sy, TILE, 3);
        }
        break;
      }
      case 'F': {
        ctx.fillStyle = '#c8c8d0';
        ctx.fillRect(sx + 7, sy, 3, TILE);
        if (tileAt(tx, ty - 1) !== 'F') {
          ctx.fillStyle = '#38c048';
          ctx.beginPath();
          ctx.arc(sx + 8, sy - 2, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }
      case 'D': {
        if (tileAt(tx, ty - 1) !== 'D') {
          ctx.fillStyle = '#2c1810';
          ctx.fillRect(sx - 2, sy - 4, TILE + 4, TILE * 2 + 4);
          ctx.fillStyle = '#6e4a2c';
          ctx.fillRect(sx, sy, TILE, TILE * 2);
          ctx.fillStyle = '#f8b800';
          ctx.fillRect(sx + 11, sy + 16, 3, 3);
          ctx.fillStyle = '#38c048';
          ctx.fillRect(sx - 2, sy - 12, TILE + 4, 8);
          ctx.fillStyle = '#0c2c10';
          ctx.font = '5px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('EXIT', sx + 8, sy - 6);
        }
        break;
      }
    }
  }

  function drawGrid() {
    const T = THEMES[G.level.theme];
    const tx0 = Math.floor(G.cam / TILE);
    const tx1 = Math.min(G.gridW - 1, tx0 + Math.ceil(W / TILE) + 1);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const ch = G.grid[ty][tx];
        if (ch === '.') continue;
        let sy = ty * TILE;
        const bump = G.bumps.find(b2 => b2.tx === tx && b2.ty === ty);
        if (bump) sy -= Math.sin((0.18 - bump.t) / 0.18 * Math.PI) * 5;
        const sx = px(tx * TILE - G.cam);
        if (ch === 'o') {
          const f = COIN_F[Math.floor(G.anim * 8) % 4];
          ctx.drawImage(f, sx + 4, sy + 3);
        } else {
          drawTile(ch, sx, px(sy), tx, ty, T);
        }
      }
    }
  }

  function playerSprite() {
    const p = G.player;
    const set = p.big ? BIG : SMALL;
    const right = p.face >= 0;
    if (!p.onGround) return right ? set.jump : set.jumpL;
    if (Math.abs(p.vx) > 6) {
      const f = Math.floor(p.walkAnim) % 3;
      return (right ? set.walk : set.walkL)[f];
    }
    return right ? set.stand : set.standL;
  }

  function drawPlayer() {
    const p = G.player;
    if (G.mode === 'play' && p.invuln > 0 && Math.floor(G.anim * 16) % 2) return;
    const img = playerSprite();
    const dx = px(p.x - G.cam) - Math.floor((img.width - p.w) / 2);
    const dy = px(p.y) - (img.height - p.h);
    if (G.mode === 'dying') {
      ctx.save();
      ctx.translate(dx + img.width / 2, dy + img.height / 2);
      ctx.scale(1, -1);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();
    } else {
      ctx.drawImage(img, dx, dy);
    }
  }

  function drawEnts() {
    for (const e of G.ents) {
      const ex = px(e.x - G.cam);
      if (ex < -24 || ex > W + 8) continue;
      if (e.kind === 'rat') {
        if (e.squash > 0) {
          ctx.drawImage(RAT_SQ, ex - 1, px(e.y + e.h - 5));
        } else {
          const f = Math.floor(e.anim * 8) % 2;
          const img = e.vx > 0 ? RAT.walk[f] : RAT.walkL[f];
          ctx.drawImage(img, ex - 1, px(e.y));
        }
      } else if (e.kind === 'bottle') {
        if (e.state === 'walk') {
          const f = Math.floor(e.anim * 6) % 2;
          const img = e.vx > 0 ? BOTTLE.walk[f] : BOTTLE.walkL[f];
          ctx.drawImage(img, ex, px(e.y));
        } else {
          const f = e.state === 'roll' ? Math.floor(e.anim * 14) % 2 : 0;
          ctx.drawImage(BOTTLE.roll[f], ex, px(e.y + e.h - 5));
        }
      }
    }
  }

  function drawItems() {
    for (const it of G.items) {
      ctx.drawImage(FORTY, px(it.x - G.cam), px(it.y));
    }
  }

  function drawFx() {
    for (const c of G.pops) {
      const f = COIN_F[Math.floor(G.anim * 12) % 4];
      ctx.drawImage(f, px(c.x - G.cam), px(c.y));
    }
    for (const pt of G.parts) {
      ctx.fillStyle = pt.color;
      ctx.fillRect(px(pt.x - G.cam), px(pt.y), 4, 4);
    }
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    for (const f of G.floats) {
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, px(f.x - G.cam), px(f.y));
    }
  }

  function hudText(text, x, y, color, align) {
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textAlign = align || 'left';
    ctx.fillStyle = '#000';
    ctx.fillText(text, x + 1, y + 1);
    ctx.fillStyle = color || '#f8f8f0';
    ctx.fillText(text, x, y);
  }

  function drawHUD() {
    hudText('CLERK', 8, 26);
    hudText(String(G.score).padStart(6, '0'), 8, 36);
    ctx.drawImage(COIN_F[Math.floor(G.anim * 8) % 4], 94, 19);
    hudText('x' + String(G.coins).padStart(2, '0'), 104, 27, '#ffd23f');
    const nameX = Math.min(W - 96, Math.max(172, W / 2));
    hudText(G.level ? G.level.name : '', nameX, 26, '#f8f8f0', 'center');
    hudText('TIME', W - 8, 26, '#f8f8f0', 'right');
    hudText(String(Math.max(0, G.time)).padStart(3, '0'), W - 8, 36, G.time <= 60 ? '#ff5a5a' : '#f8f8f0', 'right');
  }

  function drawCenterPanel(lines) {
    const pw = 216, px0 = Math.round(W / 2 - pw / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(px0, 62, pw, 116);
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 2;
    ctx.strokeRect(px0 + 2, 64, pw - 4, 112);
    lines.forEach(([text, color, size], i) => {
      ctx.font = (size || 8) + 'px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = color || '#f8f8f0';
      ctx.fillText(text, W / 2, 88 + i * 16);
    });
  }

  function drawTitle() {
    drawBackground('store');
    // marquee
    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(0, 0, W, H);
    const wob = Math.sin(G.anim * 2) * 3;
    ctx.font = '17px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText('BOTTLE RUN', W / 2 + 2, 66 + wob + 2);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('BOTTLE RUN', W / 2, 66 + wob);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillStyle = Math.floor(G.anim * 2.5) % 5 === 4 ? '#7a3060' : '#ff5aa0';
    ctx.fillText('CHICAGO CORNER LIQUOR', W / 2, 84 + wob);

    ctx.drawImage(SM_WALK1, W / 2 - 40, 108);
    ctx.drawImage(RAT1, W / 2 - 8, 114);
    ctx.drawImage(BOT1, W / 2 + 28, 108);

    ctx.fillStyle = '#f8f8f0';
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.fillText('STOMP THE PESTS', W / 2, 146);
    ctx.fillText('GRAB THE CASH', W / 2, 158);
    ctx.fillText('CLOCK OUT AT THE EXIT', W / 2, 170);
    if (Math.floor(G.anim * 2) % 2) {
      ctx.fillStyle = '#ffd23f';
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.fillText('PRESS JUMP TO START', W / 2, 196);
    }
    ctx.fillStyle = '#8c8c94';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.fillText(TOUCH_CONTROLS
      ? 'TAP  ◀ ▶ MOVE   A JUMP   B RUN'
      : 'ARROWS/WASD MOVE  Z/SPACE JUMP  X RUN', W / 2, 216);
    ctx.fillStyle = '#5a626e';
    ctx.fillText('ASHLAND AVE • CHICAGO IL', W / 2, 228);
    hudText('TOP ' + String(G.high).padStart(6, '0'), W / 2, 40, '#ffd23f', 'center');
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    if (G.mode === 'title') { drawTitle(); return; }

    drawBackground(G.level.theme);
    drawItems();
    drawGrid();
    drawEnts();
    drawPlayer();
    drawFx();
    drawHUD();

    if (G.flashMsg) {
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      ctx.fillText(G.flashMsg.text, W / 2 + 1, 121);
      ctx.fillStyle = '#ffd23f';
      ctx.fillText(G.flashMsg.text, W / 2, 120);
    }

    if (G.mode === 'pause') {
      drawCenterPanel([
        ['PAUSED', '#ffd23f', 12],
        ['', null],
        ['PRESS P TO RESUME', '#f8f8f0']
      ]);
    } else if (G.mode === 'clear') {
      drawCenterPanel([
        ['AISLE CLEAR!', '#38c048', 10],
        ['', null],
        ['BANKED ' + Wallet.format(G.lastPay), '#ffd23f', 9],
        ['', null],
        [G.levelIdx + 1 < LEVELS.length ? 'NEXT AISLE...' : 'LAST STOP...', '#f8f8f0']
      ]);
    } else if (G.mode === 'gameover') {
      drawCenterPanel([
        ['GAME OVER', '#ff5a5a', 12],
        ['', null],
        ['BANKED ' + Wallet.format(G.banked), '#ffd23f', 8],
        ['SCORE ' + String(G.score).padStart(6, '0'), '#f8f8f0'],
        ['PRESS JUMP TO RETRY', Math.floor(G.anim * 2) % 2 ? '#ffd23f' : '#8c8c94']
      ]);
    } else if (G.mode === 'complete') {
      drawCenterPanel([
        ['SHIFT COMPLETE!', '#38c048', 10],
        ['', null],
        ['TOTAL BANKED ' + Wallet.format(G.banked), '#ffd23f', 8],
        ['SCORE ' + String(G.score).padStart(6, '0'), '#f8f8f0'],
        ['PRESS JUMP TO PLAY AGAIN', Math.floor(G.anim * 2) % 2 ? '#ffd23f' : '#8c8c94']
      ]);
    }
  }

  // ---------------------------------------------------------------- run control
  function startRun() {
    G.levelIdx = 0;
    G.score = 0;
    G.lives = 3;
    G.banked = 0;
    G.player = null;
    loadLevel(0);
  }

  function pressStart() {
    audio();
    if (G.mode === 'title' || G.mode === 'gameover' || G.mode === 'complete') startRun();
  }

  function togglePause() {
    if (G.mode === 'play') { G.mode = 'pause'; stopMusic(); }
    else if (G.mode === 'pause') { G.mode = 'play'; startMusic(); }
  }

  // ---------------------------------------------------------------- input
  const KEYMAP = {
    ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right',
    x: 'run', X: 'run', Shift: 'run',
    z: 'jump', Z: 'jump', ' ': 'jump', ArrowUp: 'jump', w: 'jump', W: 'jump'
  };
  window.addEventListener('keydown', (e) => {
    if (e.repeat) { if (KEYMAP[e.key] === 'jump' || e.key === ' ') e.preventDefault(); return; }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
    if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
    const k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    keys[k] = true;
    if (k === 'jump') {
      keys.jumpPressed = true;
      pressStart();
    }
  });
  window.addEventListener('keyup', (e) => {
    const k = KEYMAP[e.key];
    if (k) keys[k] = false;
  });

  function bindTouch(id, key) {
    const el = document.getElementById(id);
    const down = (e) => {
      e.preventDefault();
      keys[key] = true;
      if (key === 'jump') { keys.jumpPressed = true; pressStart(); }
    };
    const up = (e) => { e.preventDefault(); keys[key] = false; };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }
  bindTouch('tLeft', 'left');
  bindTouch('tRight', 'right');
  bindTouch('tRun', 'run');
  bindTouch('tJump', 'jump');
  canvas.addEventListener('pointerdown', () => pressStart());

  const muteBtn = document.getElementById('muteBtn');
  if (typeof BGM !== 'undefined') muted = BGM.isMuted();
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('liquorMuted', muted ? '1' : '0');
    if (typeof BGM !== 'undefined') BGM.setMuted(muted);
    muteBtn.textContent = muted ? 'Muted' : 'Sound';
    if (!muted && G.mode === 'play') { audio(); startMusic(); }
  }
  muteBtn.addEventListener('click', toggleMute);
  muteBtn.textContent = muted ? 'Muted' : 'Sound';
  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  // ---------------------------------------------------------------- main loop
  window.__bottleRun = G; // debug/testing hook
  window.__bottleRunLoad = (i) => { G.levelIdx = i; loadLevel(i); };
  fitCanvas();

  let last = 0, acc = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    while (acc >= STEP) {
      acc -= STEP;
      if (G.mode !== 'pause') update(STEP);
      else musicTick();
    }
    render();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
