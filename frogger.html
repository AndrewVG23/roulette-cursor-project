  function drawBanker(cx, cy, scale = 1, resting = false, opts = {}) {
    const sx = opts.sx != null ? opts.sx : 1;
    const sy = opts.sy != null ? opts.sy : 1;
    const facing = opts.facing || state.facing || 'up';
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale * sx, scale * sy);
    if (facing === 'left') ctx.scale(-1, 1);
    const hopping = !!state.hopAnim && state.phase === 'cross';
    const bob = resting || hopping ? 0 : Math.sin(performance.now() / 160) * 1.4;
    ctx.translate(0, bob);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(-10, 12, 20, 4);
    ctx.fillStyle = '#1a1f2a';
    ctx.fillRect(-7, 6, 5, 9);
    ctx.fillRect(2, 6, 5, 9);
    ctx.fillStyle = '#0d0d10';
    ctx.fillRect(-8, 13, 6, 3);
    ctx.fillRect(2, 13, 6, 3);
    ctx.fillStyle = '#1e2430';
    ctx.fillRect(-9, -4, 18, 12);
    ctx.fillStyle = '#f5f0e6';
    ctx.fillRect(-3, -4, 6, 10);
    ctx.fillStyle = '#b01030';
    ctx.fillRect(-1, -3, 2, 8);
    // Briefcase swings with facing
    const caseX = facing === 'right' ? 8 : -14;
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(caseX, facing === 'up' ? -1 : 0, 6, 8);
    ctx.fillStyle = '#efc84a';
    ctx.fillRect(caseX + 1, facing === 'up' ? 1 : 2, 4, 1);
    ctx.fillStyle = '#e6b89a';
    ctx.fillRect(-6, -14, 12, 10);
    ctx.fillStyle = '#2a2430';
    ctx.fillRect(-6, -15, 12, 4);
    ctx.fillRect(-6, -12, 3, 4);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.strokeRect(-5, -11, 4, 3);
    ctx.strokeRect(1, -11, 4, 3);
    ctx.fillStyle = '#111';
    ctx.fillRect(-3.5, -10, 1.5, 1.5);
    ctx.fillRect(2.5, -10, 1.5, 1.5);
    ctx.fillStyle = '#1e2430';
    ctx.fillRect(-12, -2, 4, 8);
    ctx.fillRect(8, -2, 4, 8);
    ctx.restore();
  }

  function drawTimer() {
    const y = H - 5;
    const pct = Math.max(0, state.time / state.maxTime);
    ctx.fillStyle = '#2a2c30';
    ctx.fillRect(4, y - 5, W - 8, 5);
    ctx.fillStyle = pct < 0.22 ? '#c0392b' : pct < 0.45 ? '#d4a017' : '#3d9b6e';
    ctx.fillRect(4, y - 5, (W - 8) * pct, 5);
    if (state.combo >= 2 && state.mode === 'play') {
      ctx.fillStyle = '#7ec8e3';
      ctx.font = '700 9px "General Sans", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`${state.combo}× COMBO`, W - 8, y - 10);
    }
  }

  function drawBrickWall(x, y, w, h, seed) {
    ctx.fillStyle = seed % 2 === 0 ? '#5a3a32' : '#4e342c';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(30,18,14,0.35)';
    ctx.lineWidth = 1;
    for (let by = y + 4; by < y + h; by += 5) {
      ctx.beginPath();
      ctx.moveTo(x, by);
      ctx.lineTo(x + w, by);
      ctx.stroke();
      const off = ((by / 5) | 0) % 2 ? 6 : 0;
      for (let bx = x + off; bx < x + w; bx += 12) {
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx, Math.min(by + 5, y + h));
        ctx.stroke();
      }
    }
  }

  function drawBoardedWindow(x, y, w, h) {
    ctx.fillStyle = '#3a3028';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(20,14,10,0.55)';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 2);
    ctx.lineTo(x + w - 2, y + h - 2);
    ctx.moveTo(x + w - 2, y + 2);
    ctx.lineTo(x + 2, y + h - 2);
    ctx.stroke();
    // Plywood seams
    ctx.strokeStyle = 'rgba(60,45,30,0.4)';
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w / 2, y + h);
    ctx.stroke();
  }

  function drawSecurityGate(x, y, w, h) {
    ctx.fillStyle = '#2a2a2e';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(120,120,130,0.45)';
    ctx.lineWidth = 1;
    for (let gx = x + 3; gx < x + w; gx += 4) {
      ctx.beginPath();
      ctx.moveTo(gx, y);
      ctx.lineTo(gx, y + h);
      ctx.stroke();
    }
    for (let gy = y + 3; gy < y + h; gy += 4) {
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x + w, gy);
      ctx.stroke();
    }
  }

  function drawStoreSign(x, y, w, h, bg, fg, text) {
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = fg;
    ctx.font = `700 ${Math.max(7, Math.min(10, h - 2))}px "General Sans", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2 + 0.5);
    ctx.textBaseline = 'alphabetic';
  }

  function drawAbandonedStore(x, y, w, h, opts) {
    const { brick = 1, signBg, signFg, name, gated = true, neon = null } = opts;
    drawBrickWall(x, y, w, h, brick);
    // Cornice
    ctx.fillStyle = '#2a221c';
    ctx.fillRect(x, y, w, 4);
    // Signband
    drawStoreSign(x + 3, y + 6, w - 6, 11, signBg, signFg, name);
    if (neon) {
      ctx.fillStyle = neon;
      ctx.fillRect(x + 4, y + 6, w - 8, 2);
    }
    // Storefront
    const winY = y + 20;
    const winH = h - 24;
    if (gated) {
      drawSecurityGate(x + 4, winY, w - 8, winH);
      // Partial boards behind gate
      ctx.fillStyle = 'rgba(50,40,30,0.5)';
      ctx.fillRect(x + 8, winY + 4, (w - 16) / 2 - 2, winH - 8);
    } else {
      drawBoardedWindow(x + 4, winY, w - 8, winH);
    }
    // Door recess
    ctx.fillStyle = '#1a1612';
    ctx.fillRect(x + w * 0.4, winY + 2, w * 0.2, winH - 2);
    // CLOSED sticker
    ctx.fillStyle = 'rgba(180,40,40,0.75)';
    ctx.fillRect(x + w * 0.42, winY + winH * 0.35, w * 0.16, 7);
    ctx.fillStyle = '#f0e6d0';
    ctx.font = '700 6px "General Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLOSED', x + w * 0.5, winY + winH * 0.35 + 5.5);
  }

  function drawJunkyGasStation(x, y, w, h) {
    // Lot asphalt under canopy
    ctx.fillStyle = '#2e2e30';
    ctx.fillRect(x, y, w, h);
    // Oil stains
    ctx.fillStyle = 'rgba(10,10,12,0.45)';
    ctx.beginPath();
    ctx.ellipse(x + w * 0.3, y + h * 0.7, 14, 5, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.65, y + h * 0.55, 10, 4, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Canopy
    ctx.fillStyle = '#6a2020';
    ctx.fillRect(x + 4, y + 2, w - 8, 14);
    ctx.fillStyle = '#8a3030';
    ctx.fillRect(x + 4, y + 2, w - 8, 4);
    // Faded brand
    ctx.fillStyle = 'rgba(240,220,160,0.7)';
    ctx.font = '700 9px "General Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('QUIK-FILL', x + w / 2, y + 12);
    // Price board busted
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x + w - 28, y + 4, 20, 10);
    ctx.fillStyle = '#c0392b';
    ctx.font = '700 7px "General Sans", sans-serif';
    ctx.fillText('$??', x + w - 18, y + 11);

    // Support poles
    ctx.fillStyle = '#4a4a4e';
    ctx.fillRect(x + 10, y + 16, 4, h - 18);
    ctx.fillRect(x + w - 14, y + 16, 4, h - 18);

    // Convenience hut (boarded)
    ctx.fillStyle = '#3a3834';
    ctx.fillRect(x + w * 0.55, y + 18, w * 0.38, h - 22);
    drawBoardedWindow(x + w * 0.55 + 4, y + 24, w * 0.38 - 8, 14);
    ctx.fillStyle = 'rgba(200,40,40,0.5)';
    ctx.font = '700 6px "General Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('NO GAS', x + w * 0.58, y + h - 6);

    // Pumps — rusty, taped
    for (let i = 0; i < 2; i++) {
      const px = x + 16 + i * 28;
      const py = y + 22;
      ctx.fillStyle = '#5a4a3a';
      ctx.fillRect(px, py, 14, 20);
      ctx.fillStyle = '#3a3028';
      ctx.fillRect(px + 2, py + 3, 10, 8);
      ctx.fillStyle = '#c9a227';
      ctx.fillRect(px + 3, py + 12, 8, 2);
      // Out of order tape
      ctx.strokeStyle = '#f0c400';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px - 1, py + 2);
      ctx.lineTo(px + 15, py + 18);
      ctx.stroke();
      // Hose on ground
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 14, py + 16);
      ctx.quadraticCurveTo(px + 22, py + 24, px + 10, py + 28);
      ctx.stroke();
    }

    // Stack of tires
    ctx.fillStyle = '#1a1a1a';
    for (let t = 0; t < 3; t++) {
      ctx.beginPath();
      ctx.ellipse(x + w * 0.48, y + h - 6 - t * 5, 8, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawTopBlock() {
    const y0 = 0;
    const h = (GRILL.BUILD_TOP_END + 1) * TILE;
    // Night sky peek
    ctx.fillStyle = '#1a1520';
    ctx.fillRect(0, y0, W, h);

    // Row of abandoned businesses + gas station
    drawAbandonedStore(0, y0 + 8, TILE * 2.2, h - 10, {
      brick: 1, signBg: '#3a1818', signFg: '#e8a060', name: 'ROYAL CHICKEN', gated: true
    });
    drawJunkyGasStation(TILE * 2.15, y0 + 4, TILE * 3.3, h - 6);
    drawAbandonedStore(TILE * 5.5, y0 + 8, TILE * 2.1, h - 10, {
      brick: 2, signBg: '#1a2a1a', signFg: '#6dce7a', name: 'CHECK CASH', neon: 'rgba(80,220,100,0.45)', gated: true
    });
    drawAbandonedStore(TILE * 7.7, y0 + 8, TILE * 2.0, h - 10, {
      brick: 3, signBg: '#2a2040', signFg: '#c9a0e8', name: 'VIDEO HUT', gated: false
    });
    drawAbandonedStore(TILE * 9.8, y0 + 8, TILE * 2.2, h - 10, {
      brick: 4, signBg: '#402818', signFg: '#f0d080', name: 'PAWN PLUS', gated: true
    });

    // Graffiti on brick between signs
    ctx.fillStyle = 'rgba(180,60,160,0.5)';
    ctx.font = '700 10px "General Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SKR', TILE * 5.15, y0 + h - 14);
    ctx.fillStyle = 'rgba(60,140,220,0.45)';
    ctx.fillText('88', TILE * 9.5, y0 + 28);
  }

  function drawBottomBlock() {
    const y0 = GRILL.BUILD_BOT_START * TILE;
    const h = (ROWS - GRILL.BUILD_BOT_START) * TILE;
    ctx.fillStyle = '#1e1a18';
    ctx.fillRect(0, y0, W, h);

    // Upper facade row of the strip (taller buildings)
    drawBrickWall(0, y0, W, Math.min(TILE * 2, h * 0.45), 5);
    // Windows on upper floors — mostly dark / busted
    for (let c = 0; c < COLS; c++) {
      const wx = c * TILE + 10;
      const wy = y0 + 8;
      if ((c * 3) % 5 === 0) {
        ctx.fillStyle = 'rgba(220,180,80,0.12)';
        ctx.fillRect(wx, wy, 12, 10);
      } else {
        drawBoardedWindow(wx, wy, 14, 12);
      }
    }

    const storeY = y0 + Math.min(TILE * 2, h * 0.42);
    const storeH = y0 + h - storeY - 2;

    drawAbandonedStore(0, storeY, TILE * 2.4, storeH, {
      brick: 6, signBg: '#401018', signFg: '#ff6a6a', name: 'DISCOUNT LIQUOR', neon: 'rgba(220,40,60,0.55)', gated: true
    });
    drawAbandonedStore(TILE * 2.5, storeY, TILE * 2.2, storeH, {
      brick: 7, signBg: '#203040', signFg: '#f0d060', name: 'WE BUY GOLD', gated: true
    });
    drawAbandonedStore(TILE * 4.8, storeY, TILE * 2.5, storeH, {
      brick: 8, signBg: '#203028', signFg: '#a0d0a8', name: 'FAMILY $', gated: false
    });
    drawAbandonedStore(TILE * 7.4, storeY, TILE * 2.3, storeH, {
      brick: 9, signBg: '#302820', signFg: '#e0c8a0', name: 'LAUNDRO-', gated: true
    });
    drawAbandonedStore(TILE * 9.8, storeY, TILE * 2.2, storeH, {
      brick: 10, signBg: '#1a2030', signFg: '#80b0e0', name: 'AUTO BODY', gated: true
    });

    // Hand-painted "OPEN 24 HRS" on liquor — flickering implication
    ctx.fillStyle = 'rgba(255,220,120,0.35)';
    ctx.font = '700 7px "General Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('OPEN 24 HRS?', TILE * 1.2, storeY + storeH - 4);

    // Dumpster alley gap
    ctx.fillStyle = '#1a1814';
    ctx.fillRect(TILE * 7.2, storeY + 4, 8, storeH - 6);
    ctx.fillStyle = '#2a4a2a';
    ctx.fillRect(TILE * 7.15, storeY + storeH - 18, 14, 12);
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(TILE * 7.2, storeY + storeH - 16, 10, 4);
  }

  function drawGhettoCurb(row, label, props) {
    const y = row * TILE;
    ctx.fillStyle = '#6a655c';
    ctx.fillRect(0, y, W, TILE);
    // Concrete slabs
    ctx.fillStyle = '#5a554c';
    for (let x = 0; x < W; x += 40) ctx.fillRect(x, y, 1, TILE);
    ctx.fillRect(0, y + TILE / 2, W, 1);
    // Speckle
    ctx.fillStyle = 'rgba(40,35,30,0.15)';
    for (let i = 0; i < 18; i++) {
      ctx.fillRect((i * 53) % W, y + 4 + (i * 7) % (TILE - 8), 2, 2);
    }
    // Cracks
    ctx.strokeStyle = 'rgba(30,28,24,0.4)';
    ctx.beginPath();
    ctx.moveTo(40, y + 6);
    ctx.lineTo(70, y + 28);
    ctx.lineTo(100, y + 16);
    ctx.moveTo(300, y + 8);
    ctx.lineTo(360, y + 30);
    ctx.stroke();

    // Street furniture
    if (props === 'goal') {
      // Hydrant
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(24, y + 14, 8, 16);
      ctx.fillRect(20, y + 18, 16, 5);
      // Shopping cart carcass
      ctx.strokeStyle = '#6a6a6a';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(150, y + 16, 22, 14);
      ctx.fillStyle = '#4a4a4a';
      ctx.fillRect(152, y + 18, 18, 8);
      // Trash bags
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.ellipse(220, y + 26, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(232, y + 28, 6, 4, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Newspaper box
      ctx.fillStyle = '#1a3a6a';
      ctx.fillRect(400, y + 12, 14, 20);
      ctx.fillStyle = '#f0e6d0';
      ctx.fillRect(402, y + 14, 10, 8);
      // Milk crate
      ctx.fillStyle = '#2a5a8a';
      ctx.fillRect(90, y + 22, 12, 10);
    } else if (props === 'start') {
      // Payphone shell
      ctx.fillStyle = '#3a3a42';
      ctx.fillRect(50, y + 6, 16, 28);
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(53, y + 12, 10, 12);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(55, y + 26, 6, 3);
      // Trash can overflowing
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(180, y + 14, 14, 18);
      ctx.fillStyle = '#2a4a2a';
      ctx.fillRect(178, y + 10, 18, 8);
      // Cardboard sign
      ctx.fillStyle = '#c4a574';
      ctx.fillRect(280, y + 18, 36, 12);
      ctx.fillStyle = '#2a2010';
      ctx.font = '700 6px "General Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('WILL WORK', 298, y + 26);
      // Orange cone
      ctx.fillStyle = '#e85d04';
      ctx.beginPath();
      ctx.moveTo(360, y + 12);
      ctx.lineTo(354, y + 32);
      ctx.lineTo(366, y + 32);
      ctx.fill();
      // Bike frame locked to pole
      ctx.fillStyle = '#6a6a6a';
      ctx.fillRect(420, y + 8, 3, 26);
      ctx.strokeStyle = '#2a5a8a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(418, y + 28, 5, 0, Math.PI * 2);
      ctx.arc(430, y + 28, 5, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Yellow curb
    ctx.fillStyle = '#b8922a';
    ctx.fillRect(0, y, W, 2);
    ctx.fillRect(0, y + TILE - 2, W, 2);
    // Curb chips
    ctx.fillStyle = '#6a655c';
    ctx.fillRect(60, y, 8, 2);
    ctx.fillRect(200, y + TILE - 2, 12, 2);

    if (label) {
      ctx.fillStyle = 'rgba(230,220,190,0.55)';
      ctx.font = '700 9px "General Sans", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(label, 8, y + 12);
    }
  }

  function drawGhettoRoad(row) {
    const y = row * TILE;
    ctx.fillStyle = row % 2 === 0 ? '#2a2a2c' : '#242426';
    ctx.fillRect(0, y, W, TILE);
    // Cracks
    ctx.strokeStyle = 'rgba(10,10,10,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30, y + 8);
    ctx.lineTo(70, y + 22);
    ctx.lineTo(110, y + 14);
    ctx.moveTo(280, y + 30);
    ctx.lineTo(340, y + 10);
    ctx.stroke();
    // Worn dashed line
    ctx.fillStyle = 'rgba(200,190,160,0.35)';
    const mid = y + TILE / 2 - 1;
    for (let x = 2; x < W; x += 30) ctx.fillRect(x, mid, 12, 2);
    // Pothole
    if (row === GRILL.ROAD_START + 1 || row === GRILL.ROAD_START + 3) {
      ctx.fillStyle = '#1a1a1c';
      ctx.beginPath();
      ctx.ellipse(120 + (row * 40) % 200, y + 22, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHooptyGoal() {
    drawGhettoCurb(GRILL.GOAL, 'PARKING  •  YOUR CAR', 'goal');
    const x = GRILL.CAR_COL * TILE;
    const y = GRILL.GOAL * TILE;
    const pulse = 0.45 + 0.55 * Math.sin(performance.now() / 260);
    // Highlight stall
    ctx.strokeStyle = `rgba(212,160,23,${0.4 + pulse * 0.45})`;
    ctx.lineWidth = 2 + pulse;
    ctx.strokeRect(x + 3, y + 4, TILE - 6, TILE - 8);
    // Your beat-up car
    ctx.save();
    ctx.translate(x + TILE / 2, y + TILE / 2 + 2);
    ctx.rotate(-0.04);
    ctx.shadowColor = '#d4a017';
    ctx.shadowBlur = 5 + pulse * 12;
    ctx.fillStyle = '#3a4a38';
    ctx.fillRect(-16, -8, 32, 16);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#5a3a20';
    ctx.fillRect(-10, -6, 8, 6);
    ctx.fillRect(2, -6, 8, 6);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-14, 6, 8, 3);
    ctx.fillRect(6, 6, 8, 3);
    // Rust patch
    ctx.fillStyle = '#8a4030';
    ctx.fillRect(8, 0, 6, 4);
    ctx.fillStyle = '#d4a017';
    ctx.font = '700 7px "General Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.75 + pulse * 0.25;
    ctx.fillText('YOURS', 0, -11);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawJankyCar(e, row, dir) {
    const y = row * TILE;
    const h = TILE - 12;
    const yy = y + 6 + Math.sin(e.bob || 0) * 0.8;
    withFacing(e.x, yy, e.w, h, dir, (lx, ly, lw, lh) => {
      ctx.save();
      ctx.translate(lw / 2, lh / 2);
      ctx.rotate(e.lean || 0);
      ctx.translate(-lw / 2, -lh / 2);

      const bodyH = e.kind === 'van' ? lh : e.kind === 'rice' ? lh * 0.75 : lh * 0.85;
      const bodyY = ly + (lh - bodyH);

      // Body
      ctx.fillStyle = e.color || '#555';
      ctx.fillRect(lx, bodyY + 4, lw, bodyH - 4);
      // Primer / rust blotches
      if (e.primer) {
        ctx.fillStyle = 'rgba(160,150,130,0.55)';
        ctx.fillRect(lx + lw * 0.2, bodyY + 6, lw * 0.18, bodyH * 0.35);
      }
      ctx.fillStyle = '#8a4030';
      ctx.fillRect(lx + lw * 0.55, bodyY + bodyH - 10, 8, 5);
      ctx.fillRect(lx + 4, bodyY + 10, 5, 4);

      // Cabin
      const cabW = e.kind === 'van' ? lw * 0.55 : lw * 0.4;
      ctx.fillStyle = e.accent || '#2a2a2a';
      ctx.fillRect(lx + lw - cabW - 2, bodyY, cabW, bodyH * 0.55);
      ctx.fillStyle = 'rgba(80,120,140,0.55)';
      ctx.fillRect(lx + lw - cabW + 2, bodyY + 3, cabW - 8, bodyH * 0.35);

      // Missing bumper gap
      if (!e.missingBumper) {
        ctx.fillStyle = '#222';
        ctx.fillRect(lx + lw - 3, bodyY + bodyH - 8, 3, 6);
      }

      // Crooked spoiler on rice
      if (e.kind === 'rice') {
        ctx.fillStyle = '#111';
        ctx.fillRect(lx + 2, bodyY - 2, lw * 0.35, 3);
      }
      // Lowrider hydraulics look
      if (e.kind === 'lowrider') {
        ctx.fillStyle = '#c9a227';
        ctx.fillRect(lx + 4, bodyY + bodyH - 6, lw - 8, 2);
      }

      // Wheels — uneven
      ctx.fillStyle = '#111';
      ctx.fillRect(lx + 5, ly + lh - 4, 9, 5);
      ctx.fillRect(lx + lw - 16, ly + lh - 3, 9, 4);

      // Headlight (some cars run one-eyed)
      ctx.fillStyle = e.bustedLight ? '#333' : '#f0e6a0';
      ctx.fillRect(lx + lw - 5, bodyY + bodyH - 14, 3, 4);

      ctx.restore();
    });
  }

  function drawEntryFacade() {
    const dest = state.entryDest;
    const y = ENTRY.FACADE * TILE;
    ctx.fillStyle = '#1e1a18';
    ctx.fillRect(0, y, W, TILE * 2);
    drawBrickWall(0, y, W, TILE * 2, 3);

    const dx = ENTRY.DOOR_COL * TILE;
    const sign = dest?.sign || 'OPEN';
    ctx.fillStyle = dest?.signBg || '#c8102e';
    ctx.fillRect(dx - TILE * 0.55, y + 6, TILE * 2.1, TILE - 10);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeRect(dx - TILE * 0.55 + 0.5, y + 6.5, TILE * 2.1 - 1, TILE - 11);
    ctx.fillStyle = dest?.signFg || '#fff7ef';
    ctx.font = '700 8px "General Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(sign, dx + TILE / 2, y + TILE * 0.55);

    const doorY = ENTRY.DOOR * TILE;
    ctx.fillStyle = '#2a2420';
    ctx.fillRect(dx + 6, doorY + 6, TILE - 12, TILE - 10);
    ctx.strokeStyle = '#efc84a';
    ctx.lineWidth = 2;
    const pulse = 0.45 + 0.55 * Math.sin(performance.now() / 260);
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    ctx.strokeRect(dx + 4, doorY + 4, TILE - 8, TILE - 8);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#efc84a';
    ctx.font = '700 7px "General Sans", sans-serif';
    ctx.fillText('ENTER', dx + TILE / 2, doorY + 12);
  }

  function drawEntryCross() {
    ctx.fillStyle = '#12100e';
    ctx.fillRect(0, (ENTRY.START + 1) * TILE, W, (ROWS - ENTRY.START - 1) * TILE);

    drawEntryFacade();
    drawSafeBand(ENTRY.SAFE, 'CROSSWALK');
    for (let r = ENTRY.ROAD_START; r <= ENTRY.ROAD_END; r++) drawGhettoRoad(r);
    drawGhettoCurb(ENTRY.START, 'CURB  •  START', 'start');

    for (const lane of state.lanes) {
      for (const e of lane.entities) {
        drawJankyCar(e, lane.row, lane.dir);
      }
    }
  }

  function drawGhettoCross() {
    drawTopBlock();
    drawHooptyGoal();
    for (let r = GRILL.ROAD_START; r <= GRILL.ROAD_END; r++) drawGhettoRoad(r);
    drawGhettoCurb(GRILL.START, 'GRILL EXIT  •  START', 'start');
    drawBottomBlock();

    // Flickery streetlight cones
    const flicker = 0.05 + Math.sin(performance.now() / 400) * 0.015;
    ctx.fillStyle = `rgba(220,180,80,${flicker})`;
    ctx.beginPath();
    ctx.moveTo(60, GRILL.START * TILE);
    ctx.lineTo(20, GRILL.GOAL * TILE);
    ctx.lineTo(100, GRILL.GOAL * TILE);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(400, GRILL.START * TILE);
    ctx.lineTo(360, GRILL.GOAL * TILE);
    ctx.lineTo(440, GRILL.GOAL * TILE);
    ctx.fill();

    // Gas-station canopy spill onto the far curb
    ctx.fillStyle = 'rgba(140,40,40,0.08)';
    ctx.fillRect(TILE * 2.15, GRILL.GOAL * TILE, TILE * 3.3, 6);

    for (const lane of state.lanes) {
      for (const e of lane.entities) {
        drawJankyCar(e, lane.row, lane.dir);
      }
    }
  }

  function drawCross() {
    ctx.clearRect(0, 0, W, H);

    const shaking = state.shake > 0;
    if (shaking) {
      const mag = state.shake * 7;
      ctx.save();
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }

    if (isEnter()) {
      drawEntryCross();
    } else if (isGrill()) {
      drawGhettoCross();
    } else {
      for (let r = 0; r < ROWS; r++) {
        if (r === ROW.GARAGE) drawGarage();
        else if (r === ROW.BANK) drawSafeBand(r, 'EAST RIVER PIER');
        else if (r >= ROW.RIVER_START && r <= ROW.RIVER_END) drawRiver(r);
        else if (r === ROW.MEDIAN) drawSafeBand(r, 'BROADWAY MEDIAN');
        else if (r >= ROW.ROAD_START && r <= ROW.ROAD_END) drawRoad(r);
        else if (r === ROW.START) drawSafeBand(r, 'CASINO EXIT  •  START');
      }

      for (const lane of state.lanes) {
        const y = lane.row * TILE;
        for (const e of lane.entities) {
          if (lane.row >= ROW.RIVER_START && lane.row <= ROW.RIVER_END) {
            drawFerry(e.x, y, e.w, e.kind, lane.dir);
          } else if (e.kind === 'taxi') drawTaxi(e.x, y, e.w, lane.dir);
          else if (e.kind === 'bus') drawBus(e.x, y, e.w, lane.dir);
          else if (e.kind === 'truck') drawTruck(e.x, y, e.w, lane.dir);
          else if (e.kind === 'bike') drawBike(e.x, y, e.w, lane.dir);
        }
      }
    }

    if (state.mode !== 'gameover' && !(state.mode === 'dead' && state.flash > 0 && Math.floor(state.flash * 20) % 2 === 0)) {
      if (!(state.mode === 'win')) {
        const pose = frogDrawPose();
        const alpha = state.invuln > 0 && Math.floor(state.invuln * 16) % 2 === 0 ? 0.4 : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        drawBanker(pose.x, pose.y, 1, false, { sx: pose.sx, sy: pose.sy, facing: state.facing });
        ctx.restore();
      }
    }

    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;

    drawFloatText();

    if (state.mode === 'play' || state.mode === 'pause' || state.mode === 'dead') drawTimer();

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(192,57,43,${state.flash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (shaking) ctx.restore();

    if (state.mode === 'pause') {
      ctx.fillStyle = 'rgba(20,22,26,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8dcc0';
      ctx.font = '700 22px Zodiak, Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', W / 2, H / 2);
    }
  }

  // Chase-cam projection — Frenet frame along the map path so curves match the reference map
  function projectWorld(wx, wy, wz, d) {
    const camX = (d.camX != null ? d.camX : d.playerX);
    const camY = d.camY || 46;
    const camBack = d.camBack || 110;
    const zCam = d.z - camBack;
    const route = d.route;

    let rx, rz;
    if (route) {
      const wps = activeRouteWaypoints(d);
      const len = wps[wps.length - 1].z;
      const zCamRoute = wrapRouteZ(zCam, len);
      const zPtRoute = wrapRouteZ(wz, len);
      const camFrame = sampleRouteFrame(wps, route, zCamRoute);
      const ptFrame = sampleRouteFrame(wps, route, zPtRoute);
      let dz = routeAheadDist(zCamRoute, zPtRoute, len);
      if (dz > len * 0.5) dz -= len;
      const dx = (ptFrame.x + wx) - (camFrame.x + camX);
      const cos = Math.cos(camFrame.heading);
      const sin = Math.sin(camFrame.heading);
      const relForward = dz * cos + dx * sin;
      const relLateral = -dz * sin + dx * cos;
      rx = relLateral * 100;
      rz = relForward;
    } else {
      rx = (wx - camX) * 100;
      rz = wz - zCam;
    }

    let ry = wy - camY;

    const ahead = wz - d.z;
    if (ahead > 0) {
      const ht = Math.min(1, ahead / 680);
      const hillEase = ht * ht * (3 - 2 * ht);
      ry += (d.hills || 0) * hillEase * 0.28;
    }

    if (rz < 12) rz = 12;
    const fov = 300;
    const scale = fov / rz;
    const x = W / 2 + rx * scale;
    const y = H * 0.46 - ry * scale;
    return { x, y, scale, relZ: rz };
  }

  function facadeProximityFade(ground, d, opts = {}) {
    const minZ = opts.minZ != null ? opts.minZ : DW.FACADE_MIN_Z;
    const fadeZ = opts.fadeZ != null ? opts.fadeZ : DW.FACADE_FADE_Z;
    const minScale = opts.minScale != null ? opts.minScale : DW.FACADE_MIN_SCALE;
    if (ground.relZ < minZ || ground.scale < minScale) return 0;
    let a = ground.relZ >= fadeZ ? 1
      : (ground.relZ - minZ) / (fadeZ - minZ);
    const playerG = projectWorld(d.playerX, 0, d.z + 14, d);
    if (ground.relZ < playerG.relZ + 20) {
      a *= Math.max(0, (ground.relZ - minZ) / Math.max(14, playerG.relZ + 20 - minZ));
    }
    return Math.max(0, Math.min(1, a));
  }

  function capFacadeScreen(y, bh, ground, topFrac) {
    const frac = topFrac != null ? topFrac
      : (ground.relZ < 150 ? 0.30 : (ground.relZ < 260 ? 0.24 : 0.18));
    const topLimit = H * frac;
    if (y >= topLimit) return { y, bh };
    const trim = topLimit - y;
    return { y: topLimit, bh: Math.max(8, bh - trim) };
  }

  function facadeRoadOverlapFade(ground, x, bw) {
    if (ground.relZ > 220) return 1;
    const roadL = W * 0.26;
    const roadR = W * 0.74;
    const bxL = Math.min(x, x + bw);
    const bxR = Math.max(x, x + bw);
    const overlap = Math.max(0, Math.min(bxR, roadR) - Math.max(bxL, roadL));
    if (overlap <= 0) return 1;
    const overlapFrac = overlap / (roadR - roadL);
    const close = Math.max(0, 1 - (ground.relZ - 90) / 110);
    return Math.max(0, 1 - overlapFrac * (1.4 + close * 1.8));
  }

  // Blend two [r,g,b] colors — used for atmospheric haze with distance
  function hazeMix(c, f, t) {
    const k = Math.max(0, Math.min(1, t));
    return `rgb(${Math.round(c[0] + (f[0] - c[0]) * k)},${Math.round(c[1] + (f[1] - c[1]) * k)},${Math.round(c[2] + (f[2] - c[2]) * k)})`;
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, ((n >> 16) & 255) + amt));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (n & 255) + amt));
    return `rgb(${r},${g},${b})`;
  }

  // Taillights + rear bumper details for the handful of modeled profiles.
  function carPaintGrad(color, x0, y0, x1, y1) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, shade(color, 22));
    g.addColorStop(0.42, color);
    g.addColorStop(1, shade(color, -32));
    return g;
  }

  function carGlassGrad(x0, y0, x1, y1) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, 'rgba(18,28,40,0.94)');
    g.addColorStop(0.3, 'rgba(48,68,88,0.78)');
    g.addColorStop(0.55, 'rgba(72,98,120,0.55)');
    g.addColorStop(0.75, 'rgba(38,52,68,0.82)');
    g.addColorStop(1, 'rgba(14,20,30,0.96)');
    return g;
  }

  function drawCarWheel(cx, cy, r, spin, crush) {
    const sq = 1 - crush * 0.35;
    const rx = r * 1.12 * sq;
    const ry = r * sq;
    ctx.fillStyle = '#0e0e12';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a3038';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx * 0.78, ry * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#505860';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx * 0.38, ry * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6a7078';
    ctx.lineWidth = Math.max(0.8, r * 0.14);
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a = spin + i * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r * 0.12, cy + Math.sin(a) * r * 0.1);
      ctx.lineTo(cx + Math.cos(a) * r * 0.34, cy + Math.sin(a) * r * 0.3);
      ctx.stroke();
    }
  }

  function drawCarChromeStrip(x, y, w, h) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, 'rgba(200,210,220,0.55)');
    g.addColorStop(0.5, 'rgba(240,245,250,0.75)');
    g.addColorStop(1, 'rgba(160,170,180,0.45)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  }

  function drawCarKindDetails(kind, w, h, rearW, rearY, midY, midW, roofH, lean, s, body, opts) {
    const roofTop = midY - roofH;
    if (kind === 'sports' && opts.rear?.id === 'countach') {
      ctx.strokeStyle = shade(body, -42);
      ctx.lineWidth = Math.max(1, 1.3 * s);
      for (let i = 0; i < 6; i++) {
        const t = i / 5;
        const lx = -rearW * 0.82 + t * rearW * 0.35;
        ctx.beginPath();
        ctx.moveTo(lx, rearY - h * 0.02);
        ctx.lineTo(lx + rearW * 0.1 + lean * 0.08, midY + h * 0.04);
        ctx.stroke();
        const rx = rearW * 0.47 + t * rearW * 0.35;
        ctx.beginPath();
        ctx.moveTo(rx, rearY - h * 0.02);
        ctx.lineTo(rx - rearW * 0.1 + lean * 0.08, midY + h * 0.04);
        ctx.stroke();
      }
      ctx.fillStyle = shade(body, -24);
      ctx.fillRect(-w * 0.07 + lean * 0.15, roofTop - h * 0.1, w * 0.14, h * 0.07);
      ctx.fillStyle = '#101014';
      ctx.fillRect(-w * 0.04 + lean * 0.15, roofTop - h * 0.08, w * 0.08, h * 0.03);
      ctx.fillStyle = shade(body, -30);
      ctx.beginPath();
      ctx.moveTo(-rearW * 0.55, rearY - h * 0.3);
      ctx.lineTo(0 + lean * 0.2, rearY - h * 0.38);
      ctx.lineTo(rearW * 0.55, rearY - h * 0.3);
      ctx.lineTo(rearW * 0.42, rearY - h * 0.24);
      ctx.lineTo(-rearW * 0.42, rearY - h * 0.24);
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'sports') {
      ctx.fillStyle = shade(body, -35);
      ctx.beginPath();
      ctx.moveTo(-rearW * 0.75, rearY - h * 0.22);
      ctx.lineTo(0 + lean * 0.3, rearY - h * 0.34);
      ctx.lineTo(rearW * 0.75, rearY - h * 0.22);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#1a1a20';
      ctx.fillRect(-rearW * 0.55, rearY + h * 0.08, rearW * 1.1, h * 0.045);
    } else if (kind === 'suv' || kind === 'van') {
      ctx.strokeStyle = 'rgba(180,190,200,0.45)';
      ctx.lineWidth = Math.max(1, 1.6 * s);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-midW * 0.8 + lean, roofTop - 2 * s);
      ctx.lineTo(-midW * 0.8 + lean, roofTop - 8 * s);
      ctx.moveTo(midW * 0.8 + lean, roofTop - 2 * s);
      ctx.lineTo(midW * 0.8 + lean, roofTop - 8 * s);
      ctx.stroke();
      if (kind === 'van') {
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-midW * 0.15 + lean, midY - h * 0.05);
        ctx.lineTo(-midW * 0.15 + lean, midY + h * 0.18);
        ctx.stroke();
      }
    } else if (kind === 'compact') {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.ellipse(lean * 0.2, midY - h * 0.08, w * 0.35, h * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (kind === 'bus') {
      ctx.fillStyle = '#0039a6';
      ctx.fillRect(-rearW * 0.92, rearY - h * 0.38, rearW * 1.84, h * 0.08);
      ctx.fillStyle = 'rgba(200,210,220,0.35)';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(-rearW * 0.82 + i * rearW * 0.38, rearY - h * 0.32, rearW * 0.28, h * 0.14);
      }
      ctx.fillStyle = '#f5f5f0';
      ctx.font = `700 ${Math.max(5, 7 * s)}px "General Sans", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('M15', lean * 0.1, rearY - h * 0.05);
    } else if (kind === 'taxi') {
      ctx.fillStyle = '#1a1a20';
      for (let i = -1; i <= 1; i++) {
        ctx.fillRect(i * w * 0.18 + lean * 0.3 - w * 0.04, midY - h * 0.02, w * 0.08, h * 0.14);
      }
      ctx.fillStyle = '#fff6d0';
      ctx.fillRect(-w * 0.08, roofTop - 3 * s, w * 0.16, 4 * s);
      ctx.fillStyle = '#1a1a20';
      ctx.fillRect(-w * 0.09, roofTop - 2 * s, w * 0.04, 2 * s);
      ctx.fillRect(w * 0.05, roofTop - 2 * s, w * 0.04, 2 * s);
    } else if (kind === 'police') {
      const blink = Math.floor(performance.now() / 120) % 2;
      ctx.fillStyle = '#f5f5f0';
      ctx.fillRect(-w * 0.14, roofTop - 4 * s, w * 0.28, 6 * s);
      ctx.fillStyle = blink ? '#e74c3c' : '#3a7cff';
      ctx.fillRect(-w * 0.12, roofTop - 3 * s, w * 0.1, 4 * s);
      ctx.fillStyle = blink ? '#3a7cff' : '#e74c3c';
      ctx.fillRect(w * 0.02, roofTop - 3 * s, w * 0.1, 4 * s);
      ctx.fillStyle = `rgba(${blink ? '231,76,60' : '58,124,255'},0.35)`;
      ctx.fillRect(-w * 0.2, roofTop - 8 * s, w * 0.4, 12 * s);
      ctx.fillStyle = 'rgba(200,210,220,0.5)';
      ctx.fillRect(-midW * 0.55 + lean, midY + h * 0.04, midW * 0.35, h * 0.04);
    }
    if (opts.trim && kind !== 'bus' && kind !== 'taxi') {
      ctx.fillStyle = opts.trim;
      ctx.fillRect(-rearW * 0.88, rearY + h * 0.12, rearW * 1.76, h * 0.035);
    }
  }

  function drawCarRear(id, p) {
    const { rearW, rearY, h, w, lean, body, midW, midY } = p;
    const red = '#e74c3c';
    const redHi = '#ff6b5a';
    switch (id) {
      case 'f150':
        ctx.fillStyle = shade(body, -10);
        ctx.fillRect(-rearW * 0.86, rearY - h * 0.2, rearW * 1.72, h * 0.18);
        ctx.strokeStyle = '#8a9098';
        ctx.lineWidth = 1;
        ctx.strokeRect(-rearW * 0.86, rearY - h * 0.2, rearW * 1.72, h * 0.18);
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.88, rearY - h * 0.16, w * 0.11, h * 0.22);
        ctx.fillRect(rearW * 0.77, rearY - h * 0.16, w * 0.11, h * 0.22);
        ctx.fillStyle = '#b8c0c8';
        ctx.fillRect(-rearW * 0.68, rearY + h * 0.07, rearW * 1.36, h * 0.05);
        break;
      case 'rav4':
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.88, rearY - h * 0.12, w * 0.13, h * 0.16);
        ctx.fillRect(rearW * 0.75, rearY - h * 0.12, w * 0.13, h * 0.16);
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(-w * 0.08, rearY - h * 0.06, w * 0.16, h * 0.07);
        break;
      case 'camry':
        ctx.fillStyle = shade(body, -8);
        ctx.fillRect(-rearW * 0.62, rearY - h * 0.2, rearW * 1.24, h * 0.1);
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.78, rearY - h * 0.08, rearW * 1.56, h * 0.06);
        ctx.fillStyle = redHi;
        ctx.fillRect(-rearW * 0.72, rearY - h * 0.07, rearW * 0.22, h * 0.04);
        ctx.fillRect(rearW * 0.5, rearY - h * 0.07, rearW * 0.22, h * 0.04);
        break;
      case 'civic':
        ctx.fillStyle = red;
        ctx.beginPath();
        ctx.moveTo(-rearW * 0.82, rearY - h * 0.04);
        ctx.lineTo(-rearW * 0.62, rearY - h * 0.12);
        ctx.lineTo(-rearW * 0.48, rearY - h * 0.04);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(rearW * 0.82, rearY - h * 0.04);
        ctx.lineTo(rearW * 0.62, rearY - h * 0.12);
        ctx.lineTo(rearW * 0.48, rearY - h * 0.04);
        ctx.closePath();
        ctx.fill();
        break;
      case 'model_y':
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.84, rearY - h * 0.07, rearW * 1.68, h * 0.055);
        ctx.fillStyle = redHi;
        ctx.fillRect(-rearW * 0.8, rearY - h * 0.065, rearW * 1.6, h * 0.025);
        break;
      case 'taxi':
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.75, rearY - h * 0.07, rearW * 1.5, h * 0.06);
        break;
      case 'lambo':
        ctx.fillStyle = shade(body, -25);
        ctx.fillRect(-rearW * 0.8, rearY - h * 0.24, rearW * 1.6, h * 0.05);
        ctx.fillStyle = red;
        ctx.beginPath();
        ctx.moveTo(-rearW * 0.72, rearY - h * 0.1);
        ctx.lineTo(-rearW * 0.48, rearY - h * 0.16);
        ctx.lineTo(-rearW * 0.38, rearY - h * 0.06);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(rearW * 0.72, rearY - h * 0.1);
        ctx.lineTo(rearW * 0.48, rearY - h * 0.16);
        ctx.lineTo(rearW * 0.38, rearY - h * 0.06);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#1a1a20';
        ctx.fillRect(-w * 0.12, rearY + h * 0.04, w * 0.24, h * 0.06);
        break;
      case 'countach':
        ctx.fillStyle = shade(body, -16);
        ctx.fillRect(-rearW * 0.58, rearY - h * 0.3, rearW * 1.16, h * 0.09);
        ctx.strokeStyle = 'rgba(0,0,0,0.38)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 8; i++) {
          const lx = -rearW * 0.52 + i * rearW * 0.14;
          ctx.beginPath();
          ctx.moveTo(lx, rearY - h * 0.29);
          ctx.lineTo(lx, rearY - h * 0.21);
          ctx.stroke();
        }
        ctx.fillStyle = '#121216';
        ctx.fillRect(-rearW * 0.9, rearY - h * 0.13, rearW * 1.8, h * 0.15);
        ctx.strokeStyle = '#303038';
        for (let i = 0; i < 10; i++) {
          const lx = -rearW * 0.82 + i * rearW * 0.16;
          ctx.beginPath();
          ctx.moveTo(lx, rearY - h * 0.12);
          ctx.lineTo(lx, rearY + h * 0.01);
          ctx.stroke();
        }
        ctx.fillStyle = '#101014';
        ctx.fillRect(-rearW * 0.98, rearY - h * 0.2, w * 0.1, h * 0.13);
        ctx.fillRect(rearW * 0.88, rearY - h * 0.2, w * 0.1, h * 0.13);
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.88, rearY - h * 0.09, w * 0.17, h * 0.11);
        ctx.fillRect(rearW * 0.71, rearY - h * 0.09, w * 0.17, h * 0.11);
        ctx.fillStyle = redHi;
        ctx.fillRect(-rearW * 0.86, rearY - h * 0.08, w * 0.13, h * 0.04);
        ctx.fillRect(rearW * 0.73, rearY - h * 0.08, w * 0.13, h * 0.04);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(-w * 0.11, rearY + h * 0.015, w * 0.22, h * 0.055);
        ctx.fillStyle = '#1a1814';
        ctx.font = `700 ${Math.max(4, w * 0.08)}px "General Sans", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('COUNT', lean * 0.05, rearY + h * 0.055);
        break;
      case 'porsche911':
        ctx.fillStyle = shade(body, -22);
        ctx.fillRect(-rearW * 0.85, rearY - h * 0.26, rearW * 1.7, h * 0.05);
        ctx.fillStyle = red;
        ctx.beginPath();
        ctx.arc(-rearW * 0.55, rearY - h * 0.1, w * 0.07, 0, Math.PI * 2);
        ctx.arc(rearW * 0.55, rearY - h * 0.1, w * 0.07, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'ferrari':
        ctx.fillStyle = red;
        ctx.beginPath();
        ctx.arc(-rearW * 0.38, rearY - h * 0.1, w * 0.065, 0, Math.PI * 2);
        ctx.arc(rearW * 0.38, rearY - h * 0.1, w * 0.065, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1a20';
        ctx.fillRect(-w * 0.08, rearY + h * 0.06, w * 0.16, h * 0.05);
        break;
      case 'corvette':
        ctx.fillStyle = shade(body, -20);
        ctx.fillRect(-rearW * 0.7, rearY - h * 0.22, rearW * 1.4, h * 0.05);
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.55, rearY - h * 0.12, w * 0.1, h * 0.08);
        ctx.fillRect(-rearW * 0.2, rearY - h * 0.12, w * 0.1, h * 0.08);
        ctx.fillRect(rearW * 0.1, rearY - h * 0.12, w * 0.1, h * 0.08);
        ctx.fillRect(rearW * 0.45, rearY - h * 0.12, w * 0.1, h * 0.08);
        break;
      case 'mustang':
        ctx.fillStyle = shade(body, -22);
        ctx.fillRect(-rearW * 0.78, rearY - h * 0.24, rearW * 1.56, h * 0.05);
        ctx.fillStyle = red;
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(-rearW * 0.82, rearY - h * (0.14 - i * 0.035), w * 0.14, h * 0.025);
          ctx.fillRect(rearW * 0.68, rearY - h * (0.14 - i * 0.035), w * 0.14, h * 0.025);
        }
        break;
      default:
        ctx.fillStyle = red;
        ctx.fillRect(-rearW * 0.85, rearY - h * 0.05, w * 0.14, h * 0.1);
        ctx.fillRect(rearW * 0.7, rearY - h * 0.05, w * 0.14, h * 0.1);
    }
  }

  // Player car — copper X5 sprite with chase-cam lean / suspension.
  function drawPlayerCar(x, y, scale, opts = {}) {
    const yaw = opts.yaw || 0;
    const pitch = opts.pitch || 0;
    const roll = opts.roll || 0;
    const s = Math.max(0.12, scale);
    const drawW = PLAYER_CAR_BASE_W * s;
    const drawH = drawW * (PLAYER_CAR_SRC.h / PLAYER_CAR_SRC.w);
    const ready = PLAYER_CAR_IMG.complete && PLAYER_CAR_IMG.naturalWidth > 0;

    if (!ready) {
      drawLowPolyCar(x, y, scale, 'suv', {
        player: true,
        yaw, pitch, roll,
        wheelSpin: opts.wheelSpin || 0,
        color: '#8a4a32',
        trim: '#3a2018'
      });
      return;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(roll + yaw * 0.38);
    ctx.transform(1, pitch * 0.12, 0, 1, 0, 0);

    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(0, 3 * s, drawW * 0.44, drawH * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      PLAYER_CAR_IMG,
      PLAYER_CAR_SRC.x, PLAYER_CAR_SRC.y, PLAYER_CAR_SRC.w, PLAYER_CAR_SRC.h,
      -drawW / 2, -drawH + 2 * s, drawW, drawH
    );
    ctx.restore();
  }

  // Perspective scales — keep highway size, but allow growth when the cam pulls in.
  // Old player cap of 1.4 froze the copper X5 even as camBack shrank.
  function playerCarScale(p) {
    return Math.min(2.45, Math.max(0.12, p.scale * 0.58));
  }
  function policeCarScale(p) {
    return Math.min(2.6, Math.max(0.12, p.scale * 0.58));
  }

  // Police Interceptor sprite — chaser + traffic cops (low-poly fallback if not loaded / smashed).
  function drawPoliceCar(x, y, scale, opts = {}) {
    const yaw = opts.yaw || 0;
    const pitch = opts.pitch || 0;
    const roll = opts.roll || 0;
    if (opts.smashed) {
      drawLowPolyCar(x, y, scale, 'police', opts);
      return;
    }
    const s = Math.max(0.12, scale);
    const bodyScale = opts.bodyScale || 1;
    const drawW = POLICE_CAR_BASE_W * s * bodyScale;
    const drawH = drawW * (POLICE_CAR_SRC.h / POLICE_CAR_SRC.w);
    const ready = POLICE_CAR_IMG.complete && POLICE_CAR_IMG.naturalWidth > 0;

    if (!ready) {
      drawLowPolyCar(x, y, scale, 'police', opts);
      return;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(roll + yaw * 0.38);
    ctx.transform(1, pitch * 0.12, 0, 1, 0, 0);

    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(0, 3 * s, drawW * 0.44, drawH * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      POLICE_CAR_IMG,
      POLICE_CAR_SRC.x, POLICE_CAR_SRC.y, POLICE_CAR_SRC.w, POLICE_CAR_SRC.h,
      -drawW / 2, -drawH + 2 * s, drawW, drawH
    );
    ctx.restore();
  }

  // Rear / 3rd-person car render — smooth gradients, glass, wheels, kind-specific trim.
  function drawLowPolyCar(x, y, scale, kind, opts = {}) {
    const player = !!opts.player;
    const yaw = opts.yaw || 0;
    const pitch = opts.pitch || 0;
    const roll = opts.roll || 0;
    const smashed = !!opts.smashed;
    const crush = Math.max(0, Math.min(1, opts.crush || (smashed ? 0.6 : 0)));
    const rear = opts.rear;
    const bodyScale = opts.bodyScale || 1;
    const roofMul = opts.roof || rear?.roof || 1;
    const wMul = rear?.wMul || 1;
    const hMul = rear?.hMul || 1;
    const wheelSpin = opts.wheelSpin || 0;
    const s = Math.max(0.12, scale) * bodyScale;
    const kindW = kind === 'bus' ? 78 : kind === 'van' || kind === 'suv' ? 68
      : kind === 'pickup' ? 64 : kind === 'compact' || kind === 'sports' ? 52 : 58;
    const kindH = kind === 'bus' ? 48 : kind === 'suv' || kind === 'van' ? 40
      : kind === 'sports' ? 28 : kind === 'compact' ? 30 : 34;
    const w = kindW * s * wMul * (1 - crush * 0.35);
    const h = kindH * s * hMul * (1 - crush * 0.45);
    const baseColor = opts.color
      || (player ? '#1a2430' : kind === 'taxi' ? '#d4a017' : kind === 'bus' ? '#e8e6e0' : '#4a5560');
    const body = smashed ? shade(baseColor, -40 - crush * 30) : baseColor;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(roll + yaw * (smashed ? 1 : 0.38));
    const squashX = 1 + crush * 0.35;
    const squashY = 1 - crush * 0.4;
    ctx.transform(squashX, pitch * 0.12 + crush * 0.15, crush * 0.2, squashY, 0, crush * 6 * s);

    // Soft ground shadow
    ctx.fillStyle = `rgba(0,0,0,${0.28 + crush * 0.22})`;
    ctx.beginPath();
    ctx.ellipse(crush * 8 * s, 3 * s, w * (0.56 + crush * 0.18), h * 0.14, crush * 0.35, 0, Math.PI * 2);
    ctx.fill();

    const lean = yaw * 12 * s;
    const rearY = -h * 0.05;
    const midY = -h * (0.5 + roofMul * 0.05);
    const noseY = -h * (kind === 'pickup' ? 0.85 : kind === 'sports' ? 1.12 : 1.05);
    const rearW = w * (0.5 - crush * 0.08);
    const midW = w * (0.38 - crush * 0.06);
    const noseW = w * (0.22 + (kind === 'sports' ? -0.06 : kind === 'compact' ? -0.02 : 0));
    const roofH = h * 0.35 * roofMul * (1 - crush * 0.5);
    const roofTop = midY - roofH;

    // Wheels — rear pair visible from chase cam
    const wheelR = h * (kind === 'bus' ? 0.16 : kind === 'sports' ? 0.13 : 0.15) * (1 - crush * 0.2);
    drawCarWheel(-rearW * 0.72, rearY + h * 0.16, wheelR, wheelSpin, crush);
    drawCarWheel(rearW * 0.72, rearY + h * 0.16, wheelR, wheelSpin + 0.4, crush);
    if (kind === 'bus') {
      drawCarWheel(-rearW * 0.72, rearY + h * 0.28, wheelR * 0.92, wheelSpin + 0.2, crush);
      drawCarWheel(rearW * 0.72, rearY + h * 0.28, wheelR * 0.92, wheelSpin + 0.6, crush);
    }

    // Lower body / rocker panels
    ctx.fillStyle = carPaintGrad(body, -rearW, rearY, rearW, rearY + h * 0.22);
    ctx.beginPath();
    ctx.moveTo(-rearW, rearY + h * 0.2);
    ctx.quadraticCurveTo(-midW * 0.5 + lean * 0.3, rearY + h * 0.24, -midW + lean, midY + h * 0.15);
    ctx.lineTo(midW + lean, midY + h * 0.15);
    ctx.quadraticCurveTo(midW * 0.5 + lean * 0.3, rearY + h * 0.24, rearW, rearY + h * 0.2);
    ctx.closePath();
    ctx.fill();

    // Main rear body — rounded shoulders
    ctx.fillStyle = carPaintGrad(body, 0, rearY - h * 0.2, 0, rearY + h * 0.2);
    ctx.beginPath();
    ctx.moveTo(-rearW, rearY + h * 0.18);
    ctx.quadraticCurveTo(-rearW * 0.98, rearY + h * 0.02, -rearW * 0.92, rearY - h * 0.15);
    ctx.quadraticCurveTo(-rearW * 0.55, rearY - h * 0.22, 0, rearY - h * 0.18);
    ctx.quadraticCurveTo(rearW * 0.55, rearY - h * 0.22, rearW * 0.92, rearY - h * 0.15);
    ctx.quadraticCurveTo(rearW * 0.98, rearY + h * 0.02, rearW, rearY + h * 0.18);
    ctx.closePath();
    ctx.fill();

    // Cabin / roof — smooth taper toward nose
    ctx.fillStyle = carPaintGrad(shade(body, 8), -rearW * 0.7, roofTop, rearW * 0.7, midY);
    ctx.beginPath();
    ctx.moveTo(-rearW * 0.72, rearY - h * 0.12);
    ctx.quadraticCurveTo(-midW * 0.88 + lean, midY - roofH * 0.4, -midW * 0.85 + lean, midY - roofH);
    ctx.lineTo(midW * 0.85 + lean, midY - roofH);
    ctx.quadraticCurveTo(midW * 0.88 + lean, midY - roofH * 0.4, rearW * 0.72, rearY - h * 0.12);
    ctx.closePath();
    ctx.fill();

    // Side facets — depth shading
    ctx.fillStyle = shade(body, -26);
    ctx.beginPath();
    ctx.moveTo(-rearW * 0.88, rearY - h * 0.1);
    ctx.lineTo(-midW + lean, midY);
    ctx.lineTo(-midW * 0.72 + lean, midY - roofH * 0.88);
    ctx.lineTo(-rearW * 0.68, rearY - h * 0.36);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = shade(body, -14);
    ctx.beginPath();
    ctx.moveTo(rearW * 0.88, rearY - h * 0.1);
    ctx.lineTo(midW + lean, midY);
    ctx.lineTo(midW * 0.72 + lean, midY - roofH * 0.88);
    ctx.lineTo(rearW * 0.68, rearY - h * 0.36);
    ctx.closePath();
    ctx.fill();

    // Paint highlight streak
    if (!smashed && crush < 0.2) {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.beginPath();
      ctx.moveTo(-rearW * 0.35, rearY - h * 0.08);
      ctx.quadraticCurveTo(-midW * 0.2 + lean, midY - roofH * 0.5, midW * 0.15 + lean, midY - roofH * 0.85);
      ctx.lineTo(midW * 0.05 + lean, midY - roofH * 0.75);
      ctx.quadraticCurveTo(-midW * 0.3 + lean, midY - roofH * 0.35, -rearW * 0.45, rearY - h * 0.02);
      ctx.closePath();
      ctx.fill();
    }

    // Rear glass + cabin glass
    const glassTop = rearY - h * (kind === 'sports' ? 0.38 : 0.42) * (1 - crush * 0.25);
    ctx.fillStyle = smashed ? 'rgba(40,50,60,0.85)' : carGlassGrad(-rearW * 0.52, glassTop, rearW * 0.52, rearY - h * 0.12);
    ctx.beginPath();
    ctx.moveTo(-rearW * 0.52, rearY - h * 0.14);
    ctx.quadraticCurveTo(-rearW * 0.42, glassTop, 0, glassTop - h * 0.02);
    ctx.quadraticCurveTo(rearW * 0.42, glassTop, rearW * 0.52, rearY - h * 0.14);
    ctx.closePath();
    ctx.fill();
    if (!smashed) {
      ctx.fillStyle = 'rgba(180,210,240,0.18)';
      ctx.beginPath();
      ctx.moveTo(-rearW * 0.28, glassTop + h * 0.04);
      ctx.lineTo(-rearW * 0.08, glassTop + h * 0.12);
      ctx.lineTo(rearW * 0.05, glassTop + h * 0.06);
      ctx.closePath();
      ctx.fill();
      // Pillars
      ctx.fillStyle = shade(body, -18);
      ctx.fillRect(-rearW * 0.54, glassTop, w * 0.05, rearY - h * 0.12 - glassTop);
      ctx.fillRect(rearW * 0.49, glassTop, w * 0.05, rearY - h * 0.12 - glassTop);
    }

    // Hood / nose taper
    ctx.fillStyle = carPaintGrad(shade(body, 4), -midW, midY, midW, noseY);
    if (kind === 'pickup') {
      ctx.fillRect(-midW * 0.55 + lean, midY - h * 0.08, midW * 1.1, h * 0.35);
      ctx.fillStyle = carPaintGrad(shade(body, -8), -midW * 0.5 + lean, midY, midW, midY + h * 0.22);
      ctx.fillRect(-midW * 0.5 + lean, midY, midW, h * 0.22);
      drawCarChromeStrip(-midW * 0.48 + lean, midY + h * 0.19, midW * 0.96, h * 0.025);
    } else {
      ctx.beginPath();
      ctx.moveTo(-midW * 0.72 + lean, midY);
      ctx.quadraticCurveTo(-noseW * 0.5 + lean * 0.5, noseY + h * 0.08, -noseW + lean * 0.5, noseY);
      ctx.quadraticCurveTo(0 + lean * 0.3, noseY - h * 0.04, noseW + lean * 0.5, noseY);
      ctx.quadraticCurveTo(noseW * 0.5 + lean * 0.5, noseY + h * 0.08, midW * 0.72 + lean, midY);
      ctx.closePath();
      ctx.fill();
    }

    // Front clip / grille hint (visible from rear-three-quarter)
    ctx.fillStyle = '#0d0d10';
    ctx.beginPath();
    ctx.moveTo(-noseW * 0.85 + lean * 0.4, noseY + h * 0.02);
    ctx.quadraticCurveTo(0 + lean * 0.25, noseY + h * 0.08, noseW * 0.85 + lean * 0.4, noseY + h * 0.02);
    ctx.lineTo(noseW * 0.6 + lean * 0.4, noseY + h * 0.14);
    ctx.lineTo(-noseW * 0.6 + lean * 0.4, noseY + h * 0.14);
    ctx.closePath();
    ctx.fill();
    if (!smashed) {
      ctx.fillStyle = 'rgba(240,245,255,0.75)';
      ctx.fillRect(-noseW * 0.55 + lean * 0.4, noseY + h * 0.05, noseW * 0.22, h * 0.05);
      ctx.fillRect(noseW * 0.33 + lean * 0.4, noseY + h * 0.05, noseW * 0.22, h * 0.05);
    }

    // Rear bumper + exhaust
    ctx.fillStyle = '#1a1a20';
    ctx.fillRect(-rearW * 0.78, rearY + h * 0.06, w * 0.18, h * 0.2);
    if (crush < 0.55) {
      ctx.fillRect(rearW * 0.58, rearY + h * 0.06, w * 0.18, h * 0.2);
    }
    drawCarChromeStrip(-rearW * 0.82, rearY + h * 0.04, rearW * 1.64, h * 0.03);
    if (kind !== 'bus' && crush < 0.5) {
      ctx.fillStyle = '#2a2a30';
      ctx.fillRect(-rearW * 0.22, rearY + h * 0.14, w * 0.08, h * 0.04);
      ctx.fillRect(rearW * 0.14, rearY + h * 0.14, w * 0.08, h * 0.04);
    }

    // Taillights + model-specific rear
    if (rear?.id) {
      drawCarRear(rear.id, { rearW, rearY, h, w, lean, body, midW, midY, s });
    } else {
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-rearW * 0.85, rearY - h * 0.05, w * 0.14, h * 0.1);
      ctx.fillRect(rearW * 0.7, rearY - h * 0.05, w * 0.14, h * 0.1);
      ctx.fillStyle = 'rgba(255,100,90,0.45)';
      ctx.fillRect(-rearW * 0.84, rearY - h * 0.045, w * 0.12, h * 0.04);
      ctx.fillRect(rearW * 0.71, rearY - h * 0.045, w * 0.12, h * 0.04);
    }

    drawCarKindDetails(kind, w, h, rearW, rearY, midY, midW, roofH, lean, s, body, opts);

    if (player) {
      ctx.fillStyle = 'rgba(90,140,170,0.35)';
      ctx.fillRect(-midW * 0.45 + lean, midY - h * 0.02, midW * 0.9, h * 0.06);
    }

    if (smashed || crush > 0.1) {
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 1.5 + crush;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, -h * 0.35);
      ctx.lineTo(w * 0.1, h * 0.08);
      ctx.lineTo(-w * 0.05, -h * 0.15);
      ctx.moveTo(w * 0.22, -h * 0.55);
      ctx.lineTo(-w * 0.12, 0);
      ctx.lineTo(w * 0.08, -h * 0.25);
      ctx.stroke();
      ctx.fillStyle = 'rgba(30,30,35,0.55)';
      ctx.beginPath();
      ctx.moveTo(-w * 0.15, -h * 0.2);
      ctx.lineTo(0, -h * 0.05);
      ctx.lineTo(-w * 0.08, h * 0.1);
      ctx.closePath();
      ctx.fill();
      if (crush > 0.3 && crush < 0.95) {
        ctx.fillStyle = `rgba(255,120,40,${0.15 * (1 - crush)})`;
        ctx.fillRect(-rearW * 0.6, rearY - h * 0.2, rearW * 1.2, h * 0.25);
      }
    }

    ctx.restore();
  }

  function drawLakeStrip(z0, z1, d, fogT) {
    if (!routeEnvAt(d, z0).onLakefront && !routeEnvAt(d, z1).onLakefront) return;
    const wR = projectWorld(DW.WALK, 0, z0, d);
    const vR = projectWorld(DW.WALK, 0, z1, d);
    const pR = projectWorld(DW.ROAD, 0, z0, d);
    const qR = projectWorld(DW.ROAD, 0, z1, d);
    if (wR.relZ < 8) return;
    const LAKE = [26, 62, 98];
    const FOG = [126, 120, 108];
    const t = Math.pow(Math.max(0, Math.min(1, wR.relZ / 920)), 1.15) * 0.88;
    ctx.fillStyle = hazeMix(LAKE, FOG, t * fogT);
    ctx.beginPath();
    ctx.moveTo(wR.x, wR.y);
    ctx.lineTo(W + 50, wR.y + 2);
    ctx.lineTo(W + 50, vR.y + 2);
    ctx.lineTo(vR.x, vR.y);
    ctx.lineTo(qR.x, qR.y);
    ctx.lineTo(pR.x, pR.y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = `rgba(160,210,255,${0.07 * (1 - t)})`;
    const waveY = wR.y - 4 * wR.scale - Math.sin(z0 * 0.08) * 2 * wR.scale;
    ctx.fillRect(wR.x, waveY, Math.max(20, (W - wR.x) * 0.4), 2 * wR.scale);
  }

  function drawLandmark(lm, d) {
    const side = lm.side != null ? lm.side : (lm.e > 1.5 ? 1 : -1);
    const lakeKinds = ['pier', 'beach', 'oakbeach'];
    const inset = lakeKinds.includes(lm.kind) ? 0.38 : (lm.kind === 'hancock' ? 0.22 : 0.12);
    const xWorld = side * (DW.BUILD + inset);
    const ground = projectWorld(xWorld, 0, lm.z, d);
    if (ground.relZ > 2400) return;
    const nearFade = facadeProximityFade(ground, d, { minZ: 82, fadeZ: 320, minScale: 0.04 });
    if (nearFade <= 0) return;
    const fade = Math.max(0, Math.min(1, (2400 - ground.relZ) / 620)) * nearFade;
    const near = Math.max(0, 1 - ground.relZ / 480);
    ctx.save();
    ctx.globalAlpha = fade;
    const topClip = H * (ground.relZ < 160 ? 0.29 : 0.24);
    ctx.beginPath();
    ctx.rect(-40, topClip, W + 80, H - topClip + 40);
    ctx.clip();
    const s = ground.scale;
    const gx = ground.x;
    const gy = ground.y;

    function lmTop(h) {
      return projectWorld(xWorld, h, lm.z, d);
    }
    function lmWinGrid(cx, y0, bw, bh, cols, rows, lit) {
      const padX = bw * 0.12;
      const padY = bh * 0.08;
      const cellW = (bw - padX * 2) / cols;
      const cellH = (bh - padY * 2) / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const wx = cx - bw * 0.5 + padX + c * cellW + cellW * 0.18;
          const wy = y0 + padY + r * cellH + cellH * 0.2;
          const ww = cellW * 0.55;
          const wh = cellH * 0.52;
          const on = lit && ((r * 7 + c * 3 + lm.z) % 5 !== 0);
          ctx.fillStyle = on ? 'rgba(255,228,160,0.55)' : 'rgba(40,50,65,0.85)';
          ctx.fillRect(wx, wy, ww, wh);
        }
      }
    }
    function lmGlow(cx, y0, bw, bh, color) {
      if (near < 0.08) return;
      ctx.save();
      ctx.globalAlpha = near * 0.22 * fade;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(cx, y0 + bh * 0.45, bw * 0.72, bh * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    function lmBase(bw) {
      ctx.fillStyle = '#2a2826';
      ctx.fillRect(gx - bw * 0.58, gy - 5 * s, bw * 1.16, 6 * s);
      ctx.fillStyle = 'rgba(255,210,120,0.12)';
      ctx.fillRect(gx - bw * 0.52, gy - 4 * s, bw * 1.04, 2 * s);
    }
    function lmRim(cx, y0, bw, bh) {
