<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Return to Your Car</title>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=zodiak@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wallet.css">
  <script src="wallet.js"></script>
  <script src="orientation.js"></script>
  <script src="music.js"></script>
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
      --color-bg: #0d1512; --color-surface: #13211b; --color-surface-2: #173027;
      --color-border: #2c473c; --color-text: #f5edd8; --color-text-muted: #bdb39b;
      --color-text-faint: #897f6d; --color-primary: #d0a23a;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,.28); --shadow-md: 0 12px 30px rgba(0,0,0,.34);
      --font-display: 'Zodiak', Georgia, serif;
      --font-body: 'General Sans', 'Inter', sans-serif;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--color-text);
      background:
        radial-gradient(ellipse 90% 50% at 50% -10%, rgba(208,162,58,.12), transparent 45%),
        radial-gradient(circle at 80% 20%, rgba(90,140,180,.06), transparent 30%),
        linear-gradient(180deg, #0d1512, #07100d 60%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .app {
      max-width: none;
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 0;
    }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus {
      left: var(--space-4); top: var(--space-4);
      background: var(--color-surface); padding: var(--space-3);
      z-index: 20; border-radius: var(--radius-md);
    }
    .panel {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .panel-inner {
      position: relative;
      padding: 0;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      padding: 8px 10px;
      background: linear-gradient(180deg, rgba(8,12,10,.72), transparent);
      border: none;
      pointer-events: none;
    }
    .topbar .stats { pointer-events: auto; }
    .brand { display: none; }
    .stats {
      display: none;
      gap: var(--space-2);
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .stat {
      min-width: 64px;
      padding: 6px 10px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(20,53,40,.78), rgba(12,26,21,.92));
      border: 1px solid rgba(238,194,97,.18);
      text-align: center;
    }
    .stat .label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--color-text-faint);
    }
    .stat .value {
      display: block;
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1.2;
    }
    .canvas-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      border-radius: 0;
      overflow: hidden;
      background: #1a1c20;
      border: none;
      box-shadow: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: fill;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: rgba(7,16,13,.72);
      backdrop-filter: blur(4px);
      z-index: 2;
      transition: opacity var(--transition);
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      width: min(100%, 340px);
      text-align: center;
      padding: var(--space-6) var(--space-5);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(23,48,39,.96), rgba(12,26,21,.98));
      border: 1px solid rgba(238,194,97,.28);
      box-shadow: var(--shadow-md), 0 0 40px rgba(208,162,58,.08);
    }
    .overlay-card h2 {
      margin: 0 0 var(--space-2);
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: #f7ead0;
    }
    .overlay-card p {
      margin: 0 0 var(--space-5);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      line-height: 1.45;
    }
    .controls {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      display: grid;
      gap: var(--space-2);
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
      padding-left: 56px;
      background: linear-gradient(0deg, rgba(8,12,10,.82), rgba(8,12,10,.35) 70%, transparent);
      border: none;
      border-radius: 0;
      box-shadow: none;
      pointer-events: none;
    }
    .controls .btn { pointer-events: auto; }
    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      align-items: center;
      justify-content: center;
    }
    .controls .btn {
      min-height: 52px;
      min-width: 72px;
      padding: var(--space-2) var(--space-4);
      border-radius: 3px;
      font-size: var(--text-sm);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #f7ead0;
      background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.03)), linear-gradient(180deg, #1f5d39, #143528);
      border: 1px solid rgba(255,238,198,.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.18), 0 2px 5px rgba(0,0,0,.24);
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .controls .btn.primary {
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03)), linear-gradient(180deg, #d44a45, #8f2420);
      color: #fff6e3;
      border-color: rgba(255,210,200,.28);
    }
    .controls .btn.subtle {
      background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.03)), linear-gradient(180deg, #1f5d39, #143528);
    }
    .controls .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(239,187,73,.42);
    }
    .controls .btn:active { transform: translateY(0); }
    .controls .btn.is-shared {
      border-color: rgba(143,217,164,.45);
      color: #eafff0;
    }
    .controls .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    /* Phone lives OUTSIDE the <button> — buttons flatten preserve-3d in WebKit/Blink. */
    .phone-ctl {
      position: absolute;
      left: max(10px, env(safe-area-inset-left, 0px));
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
      z-index: 6;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
    }
    .phone-ctl > *:not(.phone-actions) { grid-area: 1 / 1; }
    .phone-actions {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      flex-direction: column-reverse;
      align-items: stretch;
      gap: 6px;
      width: max(100%, 76px);
      pointer-events: none;
    }
    .phone-action {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      padding: 7px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255, 210, 200, 0.35);
      font-family: var(--font-ui);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff6e3;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      pointer-events: none;
      /* Stay out of the stack until popped up so Share doesn't leave a gap */
      position: absolute;
      left: 0;
      right: 0;
      transition:
        opacity 280ms ease,
        transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 160ms ease,
        filter 160ms ease;
    }
    .phone-action.is-up {
      position: relative;
      left: auto;
      right: auto;
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .phone-action[hidden] {
      display: none !important;
    }
    .phone-action.is-up:disabled {
      opacity: 0.4;
      cursor: default;
      filter: grayscale(0.2);
    }
    .phone-action--replay {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03)),
        linear-gradient(180deg, #e24a43, #9a1f1c);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 6px 16px rgba(120, 20, 16, 0.45);
    }
    .phone-action--share {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03)),
        linear-gradient(180deg, #2a6b45, #163528);
      border-color: rgba(255, 238, 198, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 5px 14px rgba(0, 0, 0, 0.4);
    }
    .phone-action--share.is-shared {
      border-color: rgba(143, 217, 164, 0.5);
      color: #eafff0;
    }
    .phone-action:not(:disabled):active {
      transform: translateY(1px) scale(0.98);
    }
    .help-btn {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 0;
      border-radius: 50%;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      color: #f7ead0;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03)), linear-gradient(180deg, #1f5d39, #143528);
      border: 1px solid rgba(255,238,198,.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 10px rgba(0,0,0,.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .help-btn[aria-expanded="true"] {
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03)), linear-gradient(180deg, #d44a45, #8f2420);
      border-color: rgba(255,210,200,.35);
    }
    .phone-scene {
      --phone-w: 15px;
      --phone-h: calc(var(--phone-w) * 1024 / 540);
      --phone-depth: 4px;
      /* iPhone-like continuous corner — ~21.5% of width */
      --phone-r: calc(var(--phone-w) * 0.215);
      --phone-screen-inset: 3.2%;
      --phone-screen-r: calc(var(--phone-r) * 0.82);
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      perspective: 220px;
      -webkit-perspective: 220px;
      pointer-events: none;
      z-index: 2; /* above the hit-target button so the icon stays visible */
    }
    .phone-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .phone-face {
      position: absolute;
      inset: 0;
      border-radius: var(--phone-r);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .phone-face--front {
      background:
        linear-gradient(155deg, #f7c6db 0%, #e9a8c4 38%, #d98db0 72%, #c97a9e 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 232, 242, 0.55),
        inset 0 0 0 2.5px rgba(180, 100, 130, 0.28),
        0 1px 2px rgba(0, 0, 0, 0.35);
      display: grid;
      place-items: center;
      transform: translateZ(calc(var(--phone-depth) / 2));
    }
    .phone-face--front-screen {
      position: absolute;
      inset: var(--phone-screen-inset);
      border-radius: var(--phone-screen-r);
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(40, 36, 48, 0.55), transparent 55%),
        #050506;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.07),
        0 0 0 0.5px rgba(40, 20, 30, 0.55);
      overflow: hidden;
    }
    /* Dynamic Island */
    .phone-face--front-screen::before {
      content: '';
      position: absolute;
      top: 3.6%;
      left: 50%;
      transform: translateX(-50%);
      width: 36%;
      height: 3.4%;
      min-height: 3px;
      border-radius: 999px;
      background: #000;
      box-shadow:
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.06),
        0 0 0 0.5px rgba(0, 0, 0, 0.8);
    }
    /* Home indicator */
    .phone-face--front-screen::after {
      content: '';
      position: absolute;
      bottom: 2.4%;
      left: 50%;
      transform: translateX(-50%);
      width: 32%;
      height: 1.15%;
      min-height: 1.5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }
    .phone-rhyme {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.06em;
      padding: 20% 8% 14%;
      pointer-events: none;
    }
    .panel-inner.drive-phase .phone-rhyme {
      display: flex;
    }
    .phone-rhyme-word {
      font-family: var(--font-display);
      font-size: calc(var(--phone-w) * 0.132);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: #f3e2b8;
      text-shadow: 0 0 10px rgba(240, 200, 120, 0.35);
      white-space: nowrap;
    }
    .phone-face--back {
      transform: rotateY(180deg) translateZ(calc(var(--phone-depth) / 2));
      background: #e8b4cc;
      box-shadow:
        inset 0 0 0 1px rgba(255, 232, 242, 0.35),
        0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .phone-face--back img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      border-radius: inherit;
    }
    /* Frame rails — thickness when the phone turns edge-on */
    .phone-edge {
      position: absolute;
      background:
        linear-gradient(90deg,
          rgba(255, 236, 244, 0.65) 0%,
          #efb6d0 14%,
          #dfa0bc 42%,
          #c984a6 70%,
          #a86286 100%);
      box-shadow: inset 0 0 0 0.5px rgba(255, 230, 240, 0.4);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .phone-edge--left,
    .phone-edge--right {
      top: var(--phone-r);
      left: 50%;
      width: var(--phone-depth);
      height: calc(100% - var(--phone-r) * 2);
      margin-left: calc(var(--phone-depth) / -2);
      border-radius: calc(var(--phone-depth) * 0.28);
    }
    .phone-edge--left {
      transform: rotateY(-90deg) translateZ(calc(var(--phone-w) / 2));
    }
    .phone-edge--right {
      transform: rotateY(90deg) translateZ(calc(var(--phone-w) / 2));
      background:
        linear-gradient(90deg,
          #a86286 0%,
          #c984a6 30%,
          #dfa0bc 58%,
          #efb6d0 86%,
          rgba(255, 236, 244, 0.6) 100%);
    }
    .phone-edge--top,
    .phone-edge--bottom {
      left: var(--phone-r);
      top: 50%;
      width: calc(100% - var(--phone-r) * 2);
      height: var(--phone-depth);
      margin-top: calc(var(--phone-depth) / -2);
      border-radius: calc(var(--phone-depth) * 0.28);
      background:
        linear-gradient(180deg,
          rgba(255, 236, 244, 0.55) 0%,
          #e8a8c4 35%,
          #c984a6 100%);
    }
    .phone-edge--top {
      transform: rotateX(90deg) translateZ(calc(var(--phone-h) / 2));
    }
    .phone-edge--bottom {
      transform: rotateX(-90deg) translateZ(calc(var(--phone-h) / 2));
    }
    /* Side buttons */
    .phone-edge--left::before,
    .phone-edge--left::after {
      content: '';
      position: absolute;
      left: 18%;
      right: 18%;
      border-radius: 1px;
      background: rgba(90, 40, 60, 0.5);
      box-shadow: inset 0 0 0 0.5px rgba(255, 220, 235, 0.15);
    }
    .phone-edge--left::before {
      top: 18%;
      height: 5.5%;
    }
    .phone-edge--left::after {
      top: 28%;
      height: 11%;
    }
    .phone-edge--right::before {
      content: '';
      position: absolute;
      left: 18%;
      right: 18%;
      top: 26%;
      height: 12%;
      border-radius: 1px;
      background: rgba(90, 40, 60, 0.45);
      box-shadow: inset 0 0 0 0.5px rgba(255, 220, 235, 0.12);
    }
    .panel-inner.drive-phase .phone-ctl {
      left: max(12px, env(safe-area-inset-left, 0px));
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      width: 84px;
      height: calc(78px * 1024 / 540);
    }
    /* Now-playing chip — sits just off the phone when the drive starts */
    .now-playing {
      position: absolute;
      left: calc(max(12px, env(safe-area-inset-left, 0px)) + 92px);
      bottom: max(34px, calc(env(safe-area-inset-bottom, 0px) + 28px));
      z-index: 6;
      display: none;
      align-items: baseline;
      gap: 7px;
      max-width: min(46vw, 200px);
      padding: 7px 11px 7px 10px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(18, 22, 28, 0.92), rgba(8, 10, 14, 0.94));
      border: 1px solid rgba(238, 194, 97, 0.28);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateX(-6px);
      pointer-events: none;
      transition: opacity 380ms ease, transform 380ms ease;
    }
    .panel-inner.drive-phase .now-playing {
      display: inline-flex;
    }
    .now-playing.show {
      opacity: 1;
      transform: translateX(0);
    }
    .now-playing-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(189, 179, 155, 0.85);
      flex-shrink: 0;
    }
    .now-playing-title {
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      color: #f0d078;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-inner.drive-phase .help-btn,
    .panel-inner.drive-phase .help-btn:hover,
    .panel-inner.drive-phase .help-btn:active,
    .panel-inner.drive-phase .help-btn[aria-expanded="true"] {
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }
    .panel-inner.drive-phase .phone-scene {
      --phone-w: 78px;
      --phone-depth: 12px;
      --phone-screen-inset: 2.8%;
      width: var(--phone-w);
      height: var(--phone-h);
      perspective: 420px;
      -webkit-perspective: 420px;
    }
    .panel-inner.drive-phase .phone-face {
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.55),
        0 2px 0 rgba(255, 220, 235, 0.12);
    }
    .panel-inner.drive-phase .phone-3d {
      transform-origin: center center;
      /* Yaw spin is JS-driven so front/back can use different speeds */
      will-change: transform;
    }
    .panel-inner.drive-phase .phone-ctl:has(.help-btn[aria-expanded="true"]) .phone-face {
      box-shadow:
        0 7px 16px rgba(0, 0, 0, 0.58),
        0 0 12px rgba(232, 154, 187, 0.35);
    }
    .help-panel {
      position: absolute;
      left: max(10px, env(safe-area-inset-left, 0px));
      bottom: calc(58px + env(safe-area-inset-bottom, 0px));
      z-index: 6;
      width: min(280px, calc(100vw - 20px));
      padding: 12px 14px 14px;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(18,28,24,.96), rgba(10,16,14,.98));
      border: 1px solid rgba(238,194,97,.28);

  function skylineZoneForEnv(env) {
    if (env.onLakefront) {
      if (env.n >= 1450) return 'northside_lsd';
      if (env.n >= 1080) return 'goldcoast_lsd';
      if (env.n >= 960) return 'oak_st_lsd';
      if (env.n >= 860) return 'hancock_view';
      if (env.n >= 760) return 'streeterville_lsd';
      return 'river_north_lsd';
    }
    if (env.magMile) return 'mag_mile';
    if (env.goldCoast) return 'gold_coast';
    if (env.clarkGrid) {
      if (env.n >= 1380) return 'lincoln_park';
      if (env.n >= 950) return 'lakeview_clark';
      return 'old_town_clark';
    }
    if (Math.abs(env.heading) > 0.85) return 'cross_street';
    return 'default';
  }

  function drawSkylineBuilding(b, horizonY, sway, scrollN) {
    const par = b.parallax != null ? b.parallax : (b.distant ? 0.25 : 0.55);
    const nudge = scrollN * par * 0.004;
    const bx = b.x * W + sway * par - nudge;
    const bw = b.w * W;
    const bh = b.h * (H * 0.42);
    const by = horizonY - bh;
    const alpha = b.fade != null ? b.fade : 1;

    ctx.save();
    ctx.globalAlpha = alpha;

    if (b.taper) {
      const tiers = Array.isArray(b.taper) ? b.taper : [1, 0.82, 0.64];
      let yOff = 0;
      const tierH = bh / tiers.length;
      ctx.fillStyle = b.color;
      for (let i = 0; i < tiers.length; i++) {
        const tw = bw * tiers[i];
        ctx.fillRect(bx + (bw - tw) * 0.5, by + yOff, tw, tierH + 1);
        yOff += tierH;
      }
    } else if (b.twin) {
      const gap = (b.gap || 0.01) * W;
      const tw = (bw - gap) * 0.5;
      ctx.fillStyle = b.color;
      ctx.fillRect(bx, by, tw, bh);
      ctx.fillRect(bx + tw + gap, by, tw, bh);
      if (b.xbrace) {
        ctx.fillStyle = 'rgba(90,100,110,0.45)';
        for (let i = 0; i < 7; i++) {
          const ly = by + bh * 0.12 + i * bh * 0.11;
          ctx.fillRect(bx, ly, tw, Math.max(1.5, bh * 0.008));
          ctx.fillRect(bx + tw + gap, ly, tw, Math.max(1.5, bh * 0.008));
        }
      }
      if (b.antenna) {
        ctx.fillStyle = '#889098';
        ctx.fillRect(bx + tw * 0.42, by - bh * 0.04, Math.max(2, bw * 0.04), bh * 0.04);
        ctx.fillRect(bx + tw + gap + tw * 0.42, by - bh * 0.03, Math.max(2, bw * 0.04), bh * 0.03);
      }
    } else {
      ctx.fillStyle = b.color;
      ctx.fillRect(bx, by, bw, bh);
      if (b.gothic) {
        ctx.fillStyle = shade(b.color, 20);
        ctx.beginPath();
        ctx.moveTo(bx, by + bh * 0.2);
        ctx.lineTo(bx + bw * 0.5, by - bh * 0.06);
        ctx.lineTo(bx + bw, by + bh * 0.18);
        ctx.closePath();
        ctx.fill();
        for (let s = 0; s < 3; s++) {
          const sx = bx + bw * (0.2 + s * 0.3);
          ctx.fillRect(sx, by - bh * 0.02, bw * 0.06, bh * 0.08);
        }
      }
      if (b.clock) {
        ctx.fillStyle = '#2a3038';
        ctx.beginPath();
        ctx.arc(bx + bw * 0.22, by + bh * 0.24, bw * 0.09, 0, Math.PI * 2);
        ctx.arc(bx + bw * 0.78, by + bh * 0.24, bw * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
      if (b.hotel) {
        ctx.fillStyle = 'rgba(200,170,90,0.35)';
        ctx.fillRect(bx + bw * 0.1, by + bh * 0.35, bw * 0.8, bh * 0.08);
      }
      if (b.goldCap) {
        ctx.fillStyle = 'rgba(212,160,23,0.55)';
        ctx.fillRect(bx + bw * 0.15, by - bh * 0.02, bw * 0.7, bh * 0.04);
        ctx.fillStyle = 'rgba(255,220,120,0.35)';
        ctx.beginPath();
        ctx.arc(bx + bw * 0.5, by - bh * 0.01, bw * 0.12, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (b.lit) {
      ctx.fillStyle = `rgba(210,180,110,${0.2 + b.lit * 0.35})`;
      const cols = b.twin ? 2 : Math.max(2, Math.floor(bw / 14));
      const rows = Math.max(2, Math.floor(bh / 18));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if ((r * 3 + c + Math.floor(bx)) % 4 === 0) continue;
          ctx.fillRect(bx + 4 + c * ((bw - 8) / cols), by + 6 + r * (bh / rows), 3, 4);
        }
      }
    }

    ctx.restore();
  }

  function drawLocationSkyline(d) {
    const env = routeEnvAt(d, d.z);
    const zone = env.skylineZone || skylineZoneForEnv(env);
    const profile = SKYLINE_PROFILES[zone] || SKYLINE_PROFILES.default;
    const horizonY = H * 0.42 - (d.hills || 0) * 0.08;
    const skySway = -d.curve * 48 - (d.camX || 0) * 4.5;
    const scrollN = env.n - 620;

    if (profile.lakeOpen) {
      const lakeGrad = ctx.createLinearGradient(W * 0.52, horizonY - 100, W + 20, horizonY + 20);
      lakeGrad.addColorStop(0, 'rgba(126,120,108,0)');
      lakeGrad.addColorStop(0.35, 'rgba(55,90,125,0.14)');
      lakeGrad.addColorStop(1, 'rgba(35,70,105,0.28)');
      ctx.fillStyle = lakeGrad;
      ctx.fillRect(W * 0.42, horizonY - 110, W * 0.6, 140);
    }

    if (profile.canyon) {
      ctx.fillStyle = 'rgba(18,20,26,0.18)';
      ctx.fillRect(0, horizonY - 20, W, H * 0.08);
    }

    const sorted = [...profile.buildings].sort((a, b) => (a.distant ? 0 : 1) - (b.distant ? 0 : 1));
    for (const b of sorted) drawSkylineBuilding(b, horizonY, skySway, scrollN);
  }

  function signalPhase(sig, time) {
    const p = (time + (sig.offset || 0)) % SIGNAL_CYCLE;
    if (p < SIGNAL_GREEN) return 'green';
    if (p < SIGNAL_GREEN + SIGNAL_YELLOW) return 'yellow';
    return 'red';
  }

  function geoToGameXY(map, n, e) {
    return { x: e * map.xPerBlock, n, e };
  }

  function geoSegmentLength(map, a, b) {
    const dn = (b.n - a.n) * map.zPerNorth;
    const de = (b.e - a.e) * map.zPerEastBlock;
    return Math.hypot(dn, de);
  }

  function assignPathZ(map, geoPoints) {
    const raw = geoPoints.map(wp => ({ ...wp, ...geoToGameXY(map, wp.n, wp.e) }));
    raw[0].z = 0;
    for (let i = 1; i < raw.length; i++) {
      raw[i].z = raw[i - 1].z + geoSegmentLength(map, raw[i - 1], raw[i]);
    }
    return raw;
  }

  function activeRouteWaypoints(d) {
    if (!d || !d.route) return [];
    return d.route.waypoints;
  }

  function compileNightDriveRoute(map) {
    const waypoints = assignPathZ(map, map.loop);
    const length = waypoints[waypoints.length - 1].z;

    const samples = [];
    const step = 14;
    for (let z = 0; z <= length; z += step) {
      samples.push({ z, ...sampleRouteFrame(waypoints, map, z) });
    }
    const last = samples[samples.length - 1];
    if (!last || last.z < length) {
      samples.push({ z: length, ...sampleRouteFrame(waypoints, map, length) });
    }

    let minX = Infinity, maxX = -Infinity;
    for (const s of samples) {
      minX = Math.min(minX, s.x);
      maxX = Math.max(maxX, s.x);
    }

    const exits = (map.exits || []).map(def => ({
      ...def,
      z: nearestRouteZ(waypoints, def.n, def.e),
      mapLabel: def.mapLabel || def.name
    }));

    const intersections = compileIntersections(waypoints, map);
    const legs = compileLegs(waypoints, intersections);
    const signals = intersections.map((ix, i) => {
      const manual = (map.signals || []).find(s =>
        Math.abs(s.n - ix.n) < 30 && Math.abs(s.e - ix.e) < 0.35
      );
      return {
        n: ix.n,
        e: ix.e,
        z: ix.z,
        offset: manual ? manual.offset : (i * 1.65) % SIGNAL_CYCLE,
        label: manual ? manual.label : ix.label,
        intersection: ix
      };
    });

    return { ...map, waypoints, samples, length, minX, maxX, exits, signals, intersections, legs };
  }

  function compileIntersections(waypoints, map) {
    const list = [];
    for (let i = 1; i < waypoints.length - 1; i++) {
      const prev = waypoints[i - 1], cur = waypoints[i], next = waypoints[i + 1];
      const dn1 = cur.n - prev.n, de1 = cur.e - prev.e;
      const dn2 = next.n - cur.n, de2 = next.e - cur.e;
      const seg1Ns = Math.abs(de1) < 0.08 && Math.abs(dn1) > 0.08;
      const seg1Ew = Math.abs(dn1) < 0.08 && Math.abs(de1) > 0.08;
      const seg2Ns = Math.abs(de2) < 0.08 && Math.abs(dn2) > 0.08;
      const seg2Ew = Math.abs(dn2) < 0.08 && Math.abs(de2) > 0.08;
      if (!((seg1Ns && seg2Ew) || (seg1Ew && seg2Ns))) continue;
      const cross = seg2Ew ? 'ew' : 'ns';
      const frameBefore = sampleRouteFrame(waypoints, map, Math.max(0, cur.z - 28));
      const frameAfter = sampleRouteFrame(waypoints, map, Math.min(waypoints[waypoints.length - 1].z, cur.z + 28));
      let dh = frameAfter.heading - frameBefore.heading;
      while (dh > Math.PI) dh -= Math.PI * 2;
      while (dh < -Math.PI) dh += Math.PI * 2;
      const turnDir = dh > 0.12 ? 'left' : dh < -0.12 ? 'right' : 'straight';
      list.push({
        z: cur.z,
        n: cur.n,
        e: cur.e,
        cross,
        crossSpan: cross === 'ew' ? 2.85 : 2.0,
        crossE: cur.e,
        crossN: cur.n,
        label: cur.label,
        heading: frameBefore.heading,
        turnDir
      });
    }
    return list;
  }

  function compileLegs(waypoints, intersections) {
    return intersections.map((ix, i) => ({
      z0: i === 0 ? 0 : intersections[i - 1].z,
      z1: ix.z,
      turn: ix.turnDir,
      ix,
      done: false
    }));
  }

  function currentDriveLeg(d) {
    if (!d.legs || d.legIndex >= d.legs.length) return null;
    return d.legs[d.legIndex];
  }

  function interpRouteGeo(wps, z, linear) {
    const len = wps[wps.length - 1].z;
    z = wrapRouteZ(z, len);
    if (z <= wps[0].z) return { n: wps[0].n, e: wps[0].e };
    if (z >= wps[wps.length - 1].z) return { n: wps[wps.length - 1].n, e: wps[wps.length - 1].e };
    for (let i = 0; i < wps.length - 1; i++) {
      const a = wps[i], b = wps[i + 1];
      if (z >= a.z && z <= b.z) {
        const t = (z - a.z) / (b.z - a.z || 1);
        const k = linear ? t : t * t * (3 - 2 * t);
        return { n: a.n + (b.n - a.n) * k, e: a.e + (b.e - a.e) * k };
      }
    }
    return { n: wps[0].n, e: wps[0].e };
  }

  function interpRouteX(wps, z) {
    if (z <= wps[0].z) return wps[0].x;
    if (z >= wps[wps.length - 1].z) return wps[wps.length - 1].x;
    for (let i = 0; i < wps.length - 1; i++) {
      const a = wps[i], b = wps[i + 1];
      if (z >= a.z && z <= b.z) {
        const t = (z - a.z) / (b.z - a.z || 1);
        return a.x + (b.x - a.x) * t;
      }
    }
    return 0;
  }

  function sampleRouteFrame(wps, map, z) {
    const len = wps[wps.length - 1].z;
    z = wrapRouteZ(z, len);
    const eps = 14;
    const z0 = Math.max(0, z - eps);
    const z1 = Math.min(len, z + eps);
    const g = interpRouteGeo(wps, z, true);
    const g0 = interpRouteGeo(wps, z0, true);
    const g1 = interpRouteGeo(wps, z1, true);
    const x = g.e * map.xPerBlock;
    const x0 = g0.e * map.xPerBlock;
    const x1 = g1.e * map.xPerBlock;
    const dz = z1 - z0 || 1;
    const dx = x1 - x0;
    const heading = Math.atan2(dx, dz);
    const curve = dx / dz;
    return { x, n: g.n, e: g.e, heading, curve };
  }

  function nearestRouteZ(wps, n, e) {
    let bestZ = 0;
    let bestD = Infinity;
    for (let i = 0; i < wps.length - 1; i++) {
      const a = wps[i], b = wps[i + 1];
      const steps = Math.max(2, Math.ceil((b.z - a.z) / 60));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const zn = a.n + (b.n - a.n) * t;
        const ze = a.e + (b.e - a.e) * t;
        const zz = a.z + (b.z - a.z) * t;
        const d = (zn - n) * (zn - n) + (ze - e) * (ze - e) * 4;
        if (d < bestD) { bestD = d; bestZ = zz; }
      }
    }
    return bestZ;
  }

  function routeLength(route, d) {
    const wps = d ? activeRouteWaypoints(d) : route.waypoints;
    return wps[wps.length - 1].z;
  }

  function wrapRouteZ(z, len) {
    if (!len || len <= 0) return z;
    return ((z % len) + len) % len;
  }

  function routeAheadDist(fromRouteZ, toRouteZ, len) {
    return ((toRouteZ - fromRouteZ) % len + len) % len;
  }

  function routeMilesAhead(d, targetRouteZ) {
    const len = d.route.length;
    const from = wrapRouteZ(d.z, len);
    return routeAheadDist(from, targetRouteZ, len) / ROUTE_Z_PER_MILE;
  }

  // Signed forward distance from player to a route-fixed Z (negative = behind on loop)
  function routeSignedDist(playerAbsZ, targetRouteZ, len) {
    const p = wrapRouteZ(playerAbsZ, len);
    const forward = routeAheadDist(p, targetRouteZ, len);
    return forward > len * 0.5 ? forward - len : forward;
  }

  function routeInWindow(targetRouteZ, playerAbsZ, behind, ahead, len) {
    const d = routeSignedDist(playerAbsZ, targetRouteZ, len);
    return d >= -behind && d <= ahead;
  }

  function sampleRouteAt(route, z, d) {
    if (!route) return { x: 0, curve: 0, heading: 0, label: null };
    const wps = d ? activeRouteWaypoints(d) : route.waypoints;
    const len = route.length;
    z = wrapRouteZ(z, len);

    const frame = sampleRouteFrame(wps, route, z);
    let label = null;
    for (const wp of wps) {
      if (Math.abs(wp.z - z) < 220 && wp.label) label = wp.label;
    }
    return { ...frame, label };
  }

  function routeEnvAt(d, z) {
    const route = d.route;
    if (!route) return { onLakefront: false, goldCoast: false, magMile: false, e: 0, n: 700, lakeSide: 1, citySide: -1 };
    const wps = activeRouteWaypoints(d);
    const len = route.length;
    const zMod = ((z % len) + len) % len;
    const frame = sampleRouteFrame(wps, route, zMod);
    const lakeE = route.lakeEastOf ?? 2.55;
    const onLakefront = frame.e > lakeE - 0.5;
    const goldCoast = frame.e > -0.3 && frame.e < 1.2 && frame.n >= 1080 && frame.n <= 1280;
    const magMile = frame.e > -0.2 && frame.e < 0.6 && frame.n >= 780 && frame.n <= 1180;
    const clarkGrid = frame.e < -1.1;
    const env = { ...frame, onLakefront, goldCoast, magMile, clarkGrid, lakeSide: 1, citySide: -1 };
    env.skylineZone = skylineZoneForEnv(env);
    return env;
  }

  function seedChicagoLandmarks(d) {
    const route = d.route;
    if (!route || d.landmarksSeeded) return;
    d.landmarks = [];
    const wps = activeRouteWaypoints(d);
    for (const lm of route.landmarks || []) {
      d.landmarks.push({
        z: nearestRouteZ(wps, lm.n, lm.e),
        n: lm.n,
        e: lm.e,
        label: lm.label,
        kind: lm.kind || 'generic',
        side: lm.side != null ? lm.side : (lm.e > 1.5 ? 1 : -1)
      });
    }
    d.landmarksSeeded = true;
  }

  function maintainEnvAroundPlayer(d) {
    const len = d.route.length;
    if (!d.routeEnvSeeded) {
      while ((d.nextBuildZ || 0) < len) {
        const from = d.nextBuildZ || 0;
        seedCityBlocks(d, from, Math.min(len, from + 900));
        if ((d.nextBuildZ || 0) >= len) d.routeEnvSeeded = true;
      }
    }
    // Full loop pre-seeded: keep all facades — drawBuilding culls by distance at render time
  }

  function seedFullRouteEnvironment(d, route) {
    seedChicagoLandmarks(d);
    seedCityBlocks(d, 0, route.length + 56);
    d.routeEnvSeeded = true;
    seedMapExits(d, route);
  }

  function seedMapExits(d, route) {
    d.exits = [];
    for (const def of route.exits || []) {
      d.exits.push({
        z: def.z,
        side: def.side,
        id: def.id,
        name: def.name,
        mapLabel: def.mapLabel,
        href: def.href,
        blurb: def.blurb,
        taken: false,
        startZ: def.z - 90,
        endZ: def.z + 70,
        n: def.n,
        e: def.e
      });
    }
    d.exits.sort((a, b) => a.z - b.z);
    d.nextExitZ = route.length;
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // Player ride — pixel copper/patina BMW X5 (transparent cutout)
  const PLAYER_CAR_IMG = new Image();

  function buildPhoneRhymeFamilies(pairs) {
    const parent = new Map();
    const find = (x) => {
      let p = parent.get(x);
      if (p == null) {
        parent.set(x, x);
        return x;
      }
      while (parent.get(p) !== p) {
        parent.set(p, parent.get(parent.get(p)));
        p = parent.get(p);
      }
      return p;
    };
    const unite = (a, b) => {
      const ra = find(a);
      const rb = find(b);
      if (ra !== rb) parent.set(rb, ra);
    };
    for (const [a, b] of pairs) unite(a, b);
    const groups = new Map();
    for (const word of parent.keys()) {
      const root = find(word);
      if (!groups.has(root)) groups.set(root, []);
      groups.get(root).push(word);
    }
    return Array.from(groups.values()).filter((f) => f.length >= 2);
  }

  const PHONE_RHYME_FAMILIES = buildPhoneRhymeFamilies(PHONE_RHYMES);
  const PHONE_RHYME_FAMILIES_4 = PHONE_RHYME_FAMILIES.filter((f) => f.length >= 4);
  const PHONE_RHYME_SCHEMES = ['AABB', 'ABAB', 'ABCB', 'AAAA'];
  let phoneRhymeFront = true;
  let phoneRhymeRaf = 0;
  let phoneRhymeLastKey = '';
  // Base spin = one turn / 14s. Slow while the screen is still readable face-on;
  // otherwise a bit quicker than the old 1.5× back rate.
  const PHONE_SPIN_BASE_DPS = 360 / 14;
  const PHONE_SPIN_SLOW_DPS = PHONE_SPIN_BASE_DPS * 0.5;
  const PHONE_SPIN_FAST_DPS = PHONE_SPIN_BASE_DPS * 1.85;
  // cos(yaw) threshold ≈ ±70° from dead-on — linger slow past the perfect front
  const PHONE_SPIN_FACE_ON = 0.342;
  let phoneYawDeg = 0;
  let phoneSpinRate = PHONE_SPIN_FAST_DPS;
  let phoneSpinLastTs = 0;
  let phoneSpinPaused = false;
  const phoneCtlEl = document.querySelector('.phone-ctl');
  const phoneFineHover = window.matchMedia('(hover: hover) and (pointer: fine)');
  const phoneReduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (phoneCtlEl) {
    phoneCtlEl.addEventListener('mouseenter', () => {
      if (phoneFineHover.matches) phoneSpinPaused = true;
    });
    phoneCtlEl.addEventListener('mouseleave', () => {
      phoneSpinPaused = false;
    });
  }

  function pickFrom(arr, n) {
    const copy = arr.slice();
    for (let i = 0; i < n; i++) {
      const j = i + Math.floor(Math.random() * (copy.length - i));
      const tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy.slice(0, n);
  }

  function pickFamilies(n, minSize = 2, exclude = null) {
    const pool = PHONE_RHYME_FAMILIES.filter((f) => f.length >= minSize && (!exclude || !exclude.has(f)));
    return pickFrom(pool, Math.min(n, pool.length));
  }

  function setPhoneRhymeWords(words) {
    for (let i = 0; i < phoneRhymeEls.length; i++) {
      phoneRhymeEls[i].textContent = words[i] || '';
    }
  }

  function pickPhoneRhyme() {
    if (phoneRhymeEls.length < 4 || PHONE_RHYME_FAMILIES.length < 2) return;
    for (let attempt = 0; attempt < 8; attempt++) {
      let scheme = PHONE_RHYME_SCHEMES[Math.floor(Math.random() * PHONE_RHYME_SCHEMES.length)];
      if (scheme === 'AAAA' && !PHONE_RHYME_FAMILIES_4.length) scheme = 'AABB';

      let words = null;
      if (scheme === 'AAAA') {
        const [fam] = pickFrom(PHONE_RHYME_FAMILIES_4, 1);
        if (!fam) continue;
        words = pickFrom(fam, 4);
      } else if (scheme === 'AABB' || scheme === 'ABAB') {
        const [fa, fb] = pickFamilies(2, 2);
        if (!fa || !fb) continue;
        const [a1, a2] = pickFrom(fa, 2);
        const [b1, b2] = pickFrom(fb, 2);
        words = scheme === 'AABB' ? [a1, a2, b1, b2] : [a1, b1, a2, b2];
      } else {
        // ABCB — only the 2nd/4th lines rhyme
        const [fb] = pickFamilies(1, 2);
        if (!fb) continue;
        const used = new Set([fb]);
        const [fa] = pickFamilies(1, 2, used);
        if (!fa) continue;
        used.add(fa);
        const [fc] = pickFamilies(1, 2, used);
        if (!fc) continue;
        const [b1, b2] = pickFrom(fb, 2);
        const [a] = pickFrom(fa, 1);
        const [c] = pickFrom(fc, 1);
        words = [a, b1, c, b2];
      }

      const key = `${scheme}:${words.join('|')}`;
      if (key === phoneRhymeLastKey) continue;
      phoneRhymeLastKey = key;
      setPhoneRhymeWords(words);
      return;
    }
  }

  function phoneYawRad() {
    return (phoneYawDeg * Math.PI) / 180;
  }

  function applyPhoneYaw() {
    if (!phone3dEl) return;
    phone3dEl.style.transform = `rotateY(${phoneYawDeg}deg)`;
  }

  function syncPhoneRhyme() {
    if (state.phase !== 'drive' || !phone3dEl) {
      phoneRhymeFront = true;
      return;
    }
    // Front faces the camera when cos(yaw) > 0; swap while the back is out.
    const front = Math.cos(phoneYawRad()) > 0.08;
    if (!front && phoneRhymeFront) pickPhoneRhyme();
    phoneRhymeFront = front;
  }

  function tickPhoneSpin(ts) {
    if (!phone3dEl || state.phase !== 'drive') return;
    if (!phoneSpinLastTs) phoneSpinLastTs = ts;
    let dt = (ts - phoneSpinLastTs) / 1000;
    phoneSpinLastTs = ts;
    dt = Math.min(0.05, Math.max(0, dt));

    if (!phoneReduceMotion.matches && !phoneSpinPaused) {
      const faceOn = Math.cos(phoneYawRad()) > PHONE_SPIN_FACE_ON;
      const target = faceOn ? PHONE_SPIN_SLOW_DPS : PHONE_SPIN_FAST_DPS;
      // Drop into slow quickly; ease back up more slowly so the front lingers
      const ease = target < phoneSpinRate ? 5 : 1.6;
      phoneSpinRate += (target - phoneSpinRate) * Math.min(1, dt * ease);
      phoneYawDeg = (phoneYawDeg + phoneSpinRate * dt) % 360;
      if (phoneYawDeg < 0) phoneYawDeg += 360;
      applyPhoneYaw();
    }
    syncPhoneRhyme();
  }

  function startPhoneRhymeLoop() {
    if (phoneRhymeRaf) return;
    if (phoneRhymeEls.length && !phoneRhymeEls[0].textContent) pickPhoneRhyme();
    phoneSpinLastTs = 0;
    applyPhoneYaw();
    const tick = (ts) => {
      tickPhoneSpin(ts);
      phoneRhymeRaf = requestAnimationFrame(tick);
    };
    phoneRhymeRaf = requestAnimationFrame(tick);
  }

  function stopPhoneRhymeLoop() {
    if (phoneRhymeRaf) cancelAnimationFrame(phoneRhymeRaf);
    phoneRhymeRaf = 0;
    phoneRhymeFront = true;
    phoneSpinLastTs = 0;
    phoneSpinPaused = false;
    phoneSpinRate = PHONE_SPIN_FAST_DPS;
    if (phone3dEl) phone3dEl.style.transform = '';
  }

  function flashNowPlaying(title) {
    if (!nowPlayingEl || !nowPlayingTitle) return;
    if (state.phase !== 'drive') return;
    const name = title || (typeof BGM !== 'undefined' ? BGM.currentTitle() : '');
    if (!name) return;
    nowPlayingTitle.textContent = name;
    nowPlayingEl.classList.add('show');
    clearTimeout(nowPlayingTimer);
    nowPlayingTimer = setTimeout(() => {
      nowPlayingEl.classList.remove('show');
    }, 4200);
  }

  const params = new URLSearchParams(location.search);

  const ENTER_PARAM = params.get('enter');
  const ENTER_ID = ENTER_IDS.includes(ENTER_PARAM) ? ENTER_PARAM : null;
  const RESUME_DRIVE = params.get('resumeDrive') === '1';
  const RESUME_CROSS = params.get('resumeCross') === '1';
  const SCENARIO = ENTER_ID ? 'enter' : (params.get('from') === 'grill' ? 'grill' : 'midtown');

  // Your car sits in one bay; other bays are pillars / strangers' cars.
  // Bays, doors and the parked car all hang off board centre so they stay
  // reachable however wide the window makes the street.
  let CAR_COL = 5;
  let PARK_SLOTS = [1, 3, 5, 7, 9];

  function relayoutColumns() {
    const mid = Math.floor(centerCol());
    // Pillars between bays once there's room for them; shoulder to shoulder
    // on a narrow phone board.
    const step = COLS >= 11 ? 2 : 1;

  }

  relayoutColumns(); // at COLS 12 this reproduces [1,3,5,7,9] / col 5 exactly

  const JANKY_KINDS = ['beater', 'hooptie', 'van', 'lowrider', 'junker', 'rice'];

  const state = {
    scenario: SCENARIO,
    phase: 'cross', // cross | drive
    mode: 'title', // title | play | pause | dead | win | gameover | drive | arrived
    score: 0, // session tally for crossing high scores only
    high: Number(localStorage.getItem(SCENARIO === 'grill' ? 'grillLeaveHigh' : 'returnToCarHigh') || 0),
    level: 1,
    lives: 3,

    lanes: [],

    flash: 0,

    particles: [],
    floatText: [],

    destination: DESTINATIONS[0],

  const REPLAY_SECONDS = 5;

  function isGrill() { return state.scenario === 'grill'; }
  function isEnter() { return state.scenario === 'enter'; }
  function startRow() {
    if (isEnter()) return ENTRY.START;
    if (isGrill()) return GRILL.START;

  }
  function goalRow() {
    if (isEnter()) return ENTRY.DOOR;
    if (isGrill()) return GRILL.GOAL;

  }
  function highKey() { return isGrill() ? 'grillLeaveHigh' : 'returnToCarHigh'; }

  let audioCtx = null;
  function ensureAudio() {
    if (state.muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type = 'square', vol = 0.04) {
    const ac = ensureAudio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g);
    g.connect(ac.destination);
    const t = ac.currentTime;
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t);
    o.stop(t + dur);
  }

  function pickDestination(level) {
    return DESTINATIONS[(level - 1) % DESTINATIONS.length];
  }

  function nextRoadExit(d) {
    if (!d || !d.exits) return null;
    return d.exits.find(e => !e.taken && e.z > d.z - 20) || null;
  }

  function mapGeoToCanvas(n, e, route) {
    const { innerX, innerY, titleH } = MAP_LAYOUT;
    const { mx, my, mapW, mapH } = getMapRect();
    const innerW = mapW - innerX * 2;
    const innerH = mapH - titleH - 8;
    const b = route.geoBounds;
    const nSpan = b.nMax - b.nMin;
    const eSpan = b.eMax - b.eMin;
    return {
      x: mx + innerX + ((e - b.eMin) / eSpan) * innerW,
      y: my + innerY + innerH - ((n - b.nMin) / nSpan) * innerH
    };
  }

  function ensureMapNav(route) {
    if (mapNavBuilt || !mapNav) return;
    mapNavBuilt = true;
    for (const ex of route.exits || []) {
      const meta = MAP_DEST_ICONS[ex.id];
      if (!meta) continue;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'map-dest';
      btn.dataset.exitId = ex.id;
      btn.setAttribute('aria-label', `Navigate to ${meta.label}`);
      btn.style.setProperty('--dest-color', meta.color);
      btn.innerHTML = `<span class="map-dest-icon">${meta.svg}</span><span class="map-dest-label">${meta.shortLabel || meta.label}</span>`;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToMapDestination(ex.id);
      });
      btn.addEventListener('pointerdown', (e) => e.stopPropagation());
      mapNav.appendChild(btn);
    }
  }

  function syncMapNav(d) {
    if (!mapNav || !d || !d.route) return;
    if (!isPhoneOpen()) {
      hideMapNav();
      return;
    }
    ensureMapNav(d.route);
    mapNav.hidden = false;
    const { mx, my, mapW, mapH } = getMapRect();
    const gap = 6;
    mapNav.style.left = `${((mx + mapW + gap) / W) * 100}%`;
    mapNav.style.top = 'auto';
    mapNav.style.bottom = `${((H - my - mapH) / H) * 100}%`;
    mapNav.style.height = 'auto';
    const taken = new Set((d.exits || []).filter(e => e.taken).map(e => e.id));
    for (const btn of mapNav.querySelectorAll('.map-dest')) {
      const ex = (d.route.exits || []).find(e => e.id === btn.dataset.exitId);
      if (!ex) {
        btn.hidden = true;
        continue;
      }
      btn.hidden = taken.has(ex.id);
      btn.disabled = taken.has(ex.id);
      btn.classList.toggle('active', d.navTarget === ex.id);
    }
  }

  function hideMapNav() {
    if (mapNav) mapNav.hidden = true;
  }

  function getNavExit(d, exitId) {
    if (!d || !exitId) return null;
    const live = (d.exits || []).find(e => e.id === exitId && !e.taken);
    if (live) return live;
    const def = (d.route?.exits || []).find(e => e.id === exitId);
    if (!def) return null;
    return {
      ...def,
      taken: false,
      startZ: def.z - 90,
      endZ: def.z + 70
    };
  }

  function clearNavTrip(d) {
    if (!d) return;
    d.navTarget = null;
    d.navEtaSec = 0;
    d.navTripT = 0;
  }

  function beginNavTrip(d, exitId) {
    const ex = getNavExit(d, exitId);
    if (!ex || !d.route) return false;
    const pathLen = d.route.length;
    const ahead = Math.max(1, routeAheadDist(wrapRouteZ(d.z, pathLen), ex.z, pathLen));
    const naturalSec = ahead / (60 * DW.MPH_Z);
    d.navTarget = exitId;
    d.navTripT = 0;
    d.navEtaSec = Math.min(NAV_ETA_MAX_SEC, Math.max(NAV_ETA_MIN_SEC, naturalSec));
    return true;
  }

  function goToMapDestination(exitId) {
    if (state.phase !== 'drive' || state.mode !== 'drive' || !state.drive) return;
    const d = state.drive;
    const ex = getNavExit(d, exitId);
    if (!ex || ex.taken) return;
    if (d.navTarget === exitId) {
      clearNavTrip(d);
      beep(220, 0.05);
      updateHUD();
      return;
    }
    if (!beginNavTrip(d, exitId)) return;
    beep(523, 0.06);
    beep(784, 0.1);
    updateHUD();
  }

  function arriveAtDestination(exit) {
    if (!exit || exit.taken || state.mode !== 'drive' || !state.drive) return;
    const d = state.drive;
    clearNavTrip(d);
    if (exit.id === 'hospital') takeHospitalExit(exit);
    else if (exit.id === 'gas') takeGasExit(exit);
    else if (exit.id === 'coins') takeCoinsExit(exit);
    else if (exit.id === 'bank') takeBankExit(exit);
    else takeExit(exit);
  }

  function makeJankyCar(dir, level) {
    const kind = JANKY_KINDS[Math.floor(Math.random() * JANKY_KINDS.length)];
    const lenMap = { beater: 1.15, hooptie: 1.05, van: 1.7, lowrider: 1.25, junker: 1.35, rice: 0.95 };
    const colors = ['#6b4a2a', '#4a5540', '#5a2e3a', '#3a3a42', '#7a5a20', '#2e4a3a', '#5a4030', '#4a3048', '#707060'];
    const w = (lenMap[kind] || 1.1) * TILE * (0.85 + Math.random() * 0.45);
    const speed = (2.2 + Math.random() * 2.4 + level * 0.28) * (Math.random() < 0.12 ? 1.45 : 1);
    return {
      x: dir > 0 ? -w - 10 - Math.random() * 40 : W + 10 + Math.random() * 40,
      w,
      kind,
      color: colors[Math.floor(Math.random() * colors.length)],
      accent: Math.random() < 0.4 ? '#c45c26' : '#2a2a2a',
      lean: (Math.random() - 0.5) * 0.12,
      missingBumper: Math.random() < 0.35,
      primer: Math.random() < 0.45,
      bustedLight: Math.random() < 0.3,
      speed,
      bob: Math.random() * Math.PI * 2
    };
  }

  function buildEntryLanes(level) {
    const dirs = [-1, 1, -1];
    const lanes = [];
    for (let i = 0; i < 3; i++) {
      const row = ENTRY.ROAD_START + i;
      const dir = dirs[i];
      lanes.push({
        row,
        dir,
        ghetto: true,
        entities: [],
        spawnTimer: 0.55 + Math.random() * 0.8,
        baseSpeed: 1
      });
      if (Math.random() < 0.45) {
        const car = makeJankyCar(dir, level);
        car.x = Math.random() * W;
        car.speed *= 0.82;
        lanes[i].entities.push(car);
      }
    }
    return lanes;
  }

  function buildGhettoLanes(level) {
    const dirs = [-1, 1, -1, 1];
    const lanes = [];
    for (let i = 0; i < 4; i++) {
      const row = GRILL.ROAD_START + i;
      const dir = dirs[i];
      lanes.push({
        row,
        dir,
        ghetto: true,
        entities: [],
        spawnTimer: 0.45 + Math.random() * 1.1,
        baseSpeed: 1 // unused; per-car speed
      });
      // One scare car already in the lane so it isn't empty at start
      if (Math.random() < 0.55) {
        const car = makeJankyCar(dir, level);
        car.x = Math.random() * W;
        lanes[i].entities.push(car);
      }
    }
    return lanes;
  }

  function buildLanes(level) {
    if (isEnter()) return buildEntryLanes(level);
    if (isGrill()) return buildGhettoLanes(level);
    // Gentler early levels — challenge ramps in, doesn't jump you
    const speed = 0.82 + (level - 1) * 0.15;
    const gapEase = Math.max(0, 28 - (level - 1) * 6);
    const lanes = [];
    const riverSpecs = [
      { row: 2, dir: 1, speed: 1.05 * speed, gap: 230 + gapEase, len: 2.5, kind: 'ferry' },
      { row: 3, dir: -1, speed: 1.25 * speed, gap: 210 + gapEase, len: 1.9, kind: 'barge' },
      { row: 4, dir: 1, speed: 0.9 * speed, gap: 250 + gapEase, len: 2.9, kind: 'ferry' },
      { row: 5, dir: -1, speed: 1.35 * speed, gap: 195 + gapEase, len: 1.7, kind: 'kayak' },
      { row: 6, dir: 1, speed: 1.1 * speed, gap: 220 + gapEase, len: 2.3, kind: 'barge' }
    ];
    const roadSpecs = [
      { row: 8, dir: -1, speed: 1.45 * speed, gap: 185 + gapEase, len: 1.1, kind: 'taxi' },
      { row: 9, dir: 1, speed: 1.1 * speed, gap: 215 + gapEase, len: 1.8, kind: 'bus' },
      { row: 10, dir: -1, speed: 1.75 * speed, gap: 170 + gapEase, len: 0.9, kind: 'bike' },
      { row: 11, dir: 1, speed: 1.25 * speed, gap: 200 + gapEase, len: 1.2, kind: 'taxi' },
      { row: 12, dir: -1, speed: 1.0 * speed, gap: 235 + gapEase, len: 2.0, kind: 'truck' }
    ];
    for (const spec of [...riverSpecs, ...roadSpecs]) {
      const entities = [];
      const lenPx = spec.len * TILE;
      const count = Math.ceil((W + spec.gap) / spec.gap) + 1;
      for (let i = 0; i < count; i++) {
        entities.push({
          x: i * spec.gap + (spec.dir > 0 ? -lenPx : W),
          w: lenPx,
          kind: spec.kind
        });
      }
      lanes.push({ ...spec, entities, lenPx });
    }
    return lanes;
  }

  function resetFrog() {
    state.frog = { col: centerCol(), row: startRow(), onFerry: null };
    state.time = state.maxTime;
    state.hopCooldown = 0;
    state.hopQueued = null;
    state.hopAnim = null;
    state.facing = 'up';
    state.combo = 0;
    state.comboTimer = 0;
    state.nearMissCd = 0;
    state.invuln = 0.85;
    state.reachedRows = new Set([startRow()]);
  }

  function startCrossingLevel(level) {
    state.phase = 'cross';
    state.level = level;
    state.destination = isGrill()
      ? DESTINATIONS.find(d => d.id === 'grill') || DESTINATIONS[1]
      : pickDestination(level);
    state.maxTime = isGrill()
      ? Math.max(24, 40 - (level - 1) * 2)
      : Math.max(36, 55 - (level - 1) * 2);
    state.lanes = buildLanes(level);
    resetFrog();
    setPhaseUI();
    updateHUD();
  }

  function startEntryCross(dest) {
    if (!dest) return;
    state.scenario = 'enter';
    state.phase = 'cross';
    state.entryDest = dest;
    state.level = 1;
    state.lives = 3;
    state.maxTime = 20;
    state.time = state.maxTime;
    state.lanes = buildEntryLanes(1);
    resetFrog();
    state.mode = 'play';
    setPhaseUI();
    updateHUD();
    overlay.hidden = true;
    syncPauseBtn(false, 'Pause');
    beep(440, 0.06);
    beep(554, 0.08);
  }

  function startGame() {
    state.score = 0;
    Wallet.updateDisplay();
    state.lives = 3;
    state.combo = 0;
    state.floatText = [];
    state.mode = 'play';
    startCrossingLevel(1);
    overlay.hidden = true;
    syncPauseBtn(false, 'Pause');
    beep(440, 0.08);
    beep(660, 0.1);
  }

  function clearDriveOverlays() {
    state.floatText = [];
    state.particles = state.particles.filter(p => p.type !== 'text');
  }

  function spawnFloat(text, x, y, color, opts = {}) {
    const life = opts.life ?? 0.85;
    state.floatText.push({
      text, x, y,
      life,
      maxLife: opts.maxLife ?? life,
      color: color || '#efc84a',
      size: opts.size,
      vy: opts.vy
    });
  }

  function tickFloatText(dt) {
    for (const ft of state.floatText) {
      ft.life -= dt;
      ft.y += (ft.vy ?? -36) * dt;
    }
    state.floatText = state.floatText.filter(ft => ft.life > 0);
  }

  function drawFloatText() {
    for (const ft of state.floatText) {
      const maxLife = ft.maxLife || 0.85;
      const a = Math.min(1, ft.life / maxLife);
      const size = ft.size || 11;
      ctx.globalAlpha = a;
      ctx.font = `700 ${size}px "General Sans", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, size * 0.18);
      ctx.strokeStyle = 'rgba(10,10,14,0.85)';
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function hopSfx(row) {
    const base = 320 + (startRow() - row) * 22;
    beep(base, 0.045, 'triangle', 0.035);
    beep(base * 1.5, 0.04, 'square', 0.018);
  }

  // Shared drive world scale — physics + render stay in the same units
  const DW = {
    ROAD: 1.0,       // asphalt half-width (lane X)
    CURB: 1.14,      // concrete curb outer
    WALK: 1.62,      // sidewalk outer
    BUILD: 1.78,     // building face on lot line
    LANE: 0.42,      // lane center offsets
    MPH_Z: DRIVE_MPH_Z,       // world-Z units per mph per second
    CAR_LEN: 28,     // collision length in Z
    CAR_HALF_W: 0.2,
    FACADE_MIN_Z: 98,   // skip facades closer than this (they fill the windshield)
    FACADE_FADE_Z: 290, // full opacity beyond this distance
    FACADE_MIN_SCALE: 0.055
  };

  const BILLBOARD_ADS = [
    { lines: ['Sell your gold', 'for a great price.'], accent: 0 },
    {
      lines: ['Cheap Credit Card Debt', 'is not a problem', 'for a citizen like you.'],
      accent: 0
    }
  ];
  const BILLBOARD_TEX_W = 960;
  const BILLBOARD_TEX_H = 540;
  const billboardTexCache = new Map();

  function getBillboardTexture(ad) {
    const lines = ad.lines || ['Sell your gold', 'for a great price.'];
    const accent = ad.accent || 0;
    const key = `${accent}|${lines.join('\n')}`;
    let tex = billboardTexCache.get(key);
    if (tex) return tex;
    const c = document.createElement('canvas');
    c.width = BILLBOARD_TEX_W;
    c.height = BILLBOARD_TEX_H;
    const g = c.getContext('2d');
    g.fillStyle = '#101b16';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#0d1512';
    g.fillRect(18, 18, c.width - 36, c.height - 36);
    g.strokeStyle = 'rgba(208,162,58,0.28)';
    g.lineWidth = 4;
    g.strokeRect(28, 28, c.width - 56, c.height - 56);
    const n = lines.length;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      const y = c.height * (0.2 + t * 0.6);
      const head = i === accent;
      g.fillStyle = head ? '#d0a23a' : '#bdb39b';
      const size = head
        ? (n > 2 ? 58 : 72)
        : (n > 2 ? 40 : 48);
      g.font = head
        ? `700 ${size}px "Zodiak", Georgia, serif`
        : `600 ${size}px "General Sans", system-ui, sans-serif`;
      g.fillText(lines[i], c.width * 0.5, y, c.width - 80);
    }
    // Peeling corner baked into the face
    g.fillStyle = '#1c2a22';
    g.beginPath();
    g.moveTo(c.width - 18, c.height - 18);
    g.lineTo(c.width - 18 - 70, c.height - 18);
    g.lineTo(c.width - 18, c.height - 18 - 70);
    g.closePath();
    g.fill();
    billboardTexCache.set(key, c);
    return c;
  }

  /** Approximate perspective draw of a texture onto a projected quad (tl,tr,br,bl). */
  function drawTexturedQuad(tex, tl, tr, br, bl, slices = 18) {
    const iw = tex.width;
    const ih = tex.height;
    for (let i = 0; i < slices; i++) {
      const u0 = i / slices;
      const u1 = (i + 1) / slices;
      const x0 = tl.x + (tr.x - tl.x) * u0;
      const x1 = tl.x + (tr.x - tl.x) * u1;
      const topY0 = tl.y + (tr.y - tl.y) * u0;
      const topY1 = tl.y + (tr.y - tl.y) * u1;
      const botY0 = bl.y + (br.y - bl.y) * u0;
      const botY1 = bl.y + (br.y - bl.y) * u1;
      const yTop = (topY0 + topY1) * 0.5;
      const yBot = (botY0 + botY1) * 0.5;
      const dw = x1 - x0;
      const dh = yBot - yTop;
      if (Math.abs(dw) < 0.4 || Math.abs(dh) < 0.4) continue;
      const sx = Math.floor(u0 * iw);
      const sw = Math.max(1, Math.ceil((u1 - u0) * iw) + 1);
      ctx.drawImage(tex, sx, 0, sw, ih, x0, yTop, dw, dh);
    }
  }

  function seedRoadExits(d, fromZ, toZ) {
    // Place GRILL / CASINO exits along the road — steer onto the ramp to take one
    let z = Math.max(fromZ, d.nextExitZ || 4200);
    while (z < toZ) {
      const def = ROAD_EXITS[d.exitIndex % ROAD_EXITS.length];
      d.exitIndex += 1;
      // Prefer right-side exits; occasional left
      const side = Math.random() > 0.22 ? 1 : -1;
      d.exits.push({
        z,
        side,
        id: def.id,
        name: def.name,
        href: def.href,
        blurb: def.blurb,
        taken: false,
        // Ramp window in world-Z
        startZ: z - 90,
        endZ: z + 70
      });
      // ~8–14s apart at cruise
      z += 4800 + Math.random() * 3200;
    }
    d.nextExitZ = z;
  }

  function routeSeparation(routeZ_a, routeZ_b, len) {
    const sep = routeAheadDist(routeZ_a, routeZ_b, len);
    return Math.min(sep, len - sep);
  }

  function nearestLandmarkSep(d, routeZ, side) {
    const len = d.route ? d.route.length : 0;
    if (!len) return Infinity;
    let best = Infinity;
    for (const lm of d.landmarks || []) {
      const ls = lm.side != null ? lm.side : (lm.e > 1.5 ? 1 : -1);
      if (ls !== side) continue;
      best = Math.min(best, routeSeparation(routeZ, lm.z, len));
    }
    return best;
  }

  function landmarkClearance(d, routeZ, side, kind) {
    const len = d.route ? d.route.length : 0;
    for (const lm of d.landmarks || []) {
      const ls = lm.side != null ? lm.side : (lm.e > 1.5 ? 1 : -1);
      if (ls !== side) continue;
      const lake = ['pier', 'beach', 'oakbeach'].includes(lm.kind);
      const pad = lake ? 160 : (kind === 'building' ? 88 : 130);
      if (routeSeparation(routeZ, lm.z, len) < pad) return true;
    }
    return false;
  }

  function seedCityBlocks(d, fromZ, toZ) {
    // Chicago blocks — inland facades on LSD, lake side gets shoreline props
    const facades = ['#4a3f38', '#3d4248', '#5a5048', '#2f353c', '#5c4a3a', '#3a4038', '#6a5a4a'];
    const goldFacades = ['#524840', '#4a4540', '#3e3a36', '#5a5048', '#464038'];
    const zoneHeights = {
      hancock_view: [200, 320], mag_mile: [190, 300], streeterville_lsd: [140, 240],
      goldcoast_lsd: [120, 200], gold_coast: [130, 210], northside_lsd: [70, 120],
      lincoln_park: [55, 95], lakeview_clark: [65, 110], old_town_clark: [75, 125],
      oak_st_lsd: [150, 230], river_north_lsd: [90, 160], cross_street: [60, 100]
    };
    const lot = 56;
    const len = d.route.length;
    const endZ = Math.min(toZ, len);
    for (let routeZ = Math.ceil(fromZ / lot) * lot; routeZ < endZ; routeZ += lot) {
      const env = routeEnvAt(d, routeZ);
      const zi = (routeZ / lot) | 0;
      const depth = 0.7 + (Math.abs(Math.sin(routeZ * 0.02)) * 0.45);
      const sides = env.onLakefront ? [env.citySide] : [-1, 1];
      const zh = zoneHeights[env.skylineZone] || (env.onLakefront ? [90, 150] : env.clarkGrid ? [115, 165] : [105, 175]);
      for (const side of sides) {
        if (landmarkClearance(d, routeZ, side, 'building')) continue;
        const fancy = env.goldCoast || env.magMile || env.skylineZone === 'hancock_view';
        const hBase = zh[0];
        const hRange = zh[1] - zh[0];
        let h = hBase + (Math.abs(Math.cos(routeZ * 0.011 + side)) * hRange);
        const lmNear = nearestLandmarkSep(d, routeZ, side);
        if (lmNear < 200) h = Math.min(h, 70 + lmNear * 0.45);
        d.buildings.push({
          z: routeZ + (side < 0 ? 0 : lot * 0.35),
          side,
          h,
          w: depth + (fancy ? 0.3 : 0),
          color: (fancy ? goldFacades : facades)[Math.abs(zi + side) % (fancy ? goldFacades.length : facades.length)],
          windows: fancy ? 3 + (zi % 2) : 2 + (Math.abs(zi) % 3),
          lean: Math.sin(routeZ * 0.01) * (fancy ? 0.014 : 0.025),
          boarded: !fancy && zi % 5 === 0,
          graffiti: !fancy && zi % 3 !== 0,
          fancy: !!fancy
        });
      }
      if (env.onLakefront) {
        if (zi % 2 === 0) d.props.push({ z: routeZ + 8, side: env.lakeSide, kind: 'lake_wall' });
        if (zi % 3 === 0) d.props.push({ z: routeZ + 20, side: env.lakeSide, kind: 'tree' });
        if (zi % 5 === 0) d.props.push({ z: routeZ + 34, side: env.lakeSide, kind: 'bench' });
        if (zi % 8 === 0) d.props.push({ z: routeZ + 42, side: env.lakeSide, kind: 'boat' });
        d.props.push({ z: routeZ + 12, side: env.citySide, kind: 'light' });
        if (zi % 4 === 0) d.props.push({ z: routeZ + 26, side: env.citySide, kind: 'hydrant' });
      } else {
        if (zi % 2 === 0) {
          d.props.push({ z: routeZ + 10, side: -1, kind: 'light' });
          d.props.push({ z: routeZ + 10, side: 1, kind: 'light' });
        }
        if (env.magMile && zi % 3 === 0) d.props.push({ z: routeZ + 22, side: -1, kind: 'newsstand' });
        if (env.goldCoast && zi % 4 === 0) d.props.push({ z: routeZ + 30, side: 1, kind: 'tree' });
        if (zi % 3 === 0) d.props.push({ z: routeZ + 28, side: Math.sin(routeZ) > 0 ? -1 : 1, kind: 'dumpster' });
        if (zi % 4 === 0) d.props.push({ z: routeZ + 40, side: Math.cos(routeZ) > 0 ? 1 : -1, kind: 'hydrant' });
        if (zi % 5 === 0) d.props.push({ z: routeZ + 16, side: -1, kind: 'bus_shelter' });
        // Occasional debt-economy billboards — rarer, inland only
        if (zi % 37 === 19) {
          const bbSide = Math.sin(routeZ * 0.07) > 0 ? 1 : -1;
          if (!landmarkClearance(d, routeZ + 24, bbSide, 'building')) {
            const ad = BILLBOARD_ADS[((zi / 37) | 0) % BILLBOARD_ADS.length];
            d.props.push({
              z: routeZ + 24,
              side: bbSide,
              kind: 'billboard',
              lines: ad.lines,
              accent: ad.accent
            });
          }
        }
      }
    }
    d.nextBuildZ = Math.min(toZ, len);
    d.nextPropZ = toZ;
  }

  async function createDriveMp4Encoder(sourceCanvas) {
    if (!canShareReplayVideo() || !sourceCanvas) return null;
    if ((sourceCanvas.width || 0) < 2 || (sourceCanvas.height || 0) < 2) return null;

    const { Output, Mp4OutputFormat, BufferTarget, CanvasSource } = await import('mediabunny');
    const output = new Output({
      format: new Mp4OutputFormat({ fastStart: 'in-memory' }),
      target: new BufferTarget()
    });
    const videoSource = new CanvasSource(sourceCanvas, {
      codec: 'avc',
      bitrate: 4_500_000
    });
    output.addVideoTrack(videoSource, { frameRate: 30 });
    await output.start();

    const frameDuration = 1 / 30;
    let framesAdded = 0;
    let running = true;
    let encoding = false;
    let pumpError = null;
    let idleWaiters = [];
    let lastCaptureAt = 0;
    const captureIntervalMs = 1000 / 30;

    const notifyIdle = () => {
      const waiters = idleWaiters;
      idleWaiters = [];
      waiters.forEach((resolve) => resolve());
    };

    return {
      tick() {
        if (!running || encoding || pumpError) return;
        const now = performance.now();
        if (now - lastCaptureAt < captureIntervalMs) return;
        lastCaptureAt = now;
        encoding = true;
        const timestamp = framesAdded * frameDuration;
        videoSource.add(timestamp, frameDuration).then(() => {
          framesAdded += 1;
          encoding = false;
          notifyIdle();
        }).catch((err) => {
          encoding = false;
          if (running) pumpError = err;
          notifyIdle();
        });
      },
      async stop() {
        running = false;
        if (encoding) {
          await new Promise((resolve) => { idleWaiters.push(resolve); });
        }
        if (pumpError) throw pumpError;
        if (framesAdded < 2) throw new Error('Recording was too short');
        await output.finalize();
        const buffer = output.target.buffer;
        if (!buffer || buffer.byteLength < 32) throw new Error('MP4 encoding failed');
        return new Blob([buffer], { type: 'video/mp4' });
      },
      abort() {
        running = false;
        try { output.cancel?.(); } catch { /* ignore */ }
        notifyIdle();
      }
    };
  }

  function getShareableClip() {
    if (state.replay.clip && state.replay.clip.length > 1) return state.replay.clip;
    if (state.replay.buffer && state.replay.buffer.length > 1) return state.replay.buffer;
    return null;
  }

  async function shareOrDownloadReplayVideo(file) {
    const title = 'Night drive replay';
    const text = `Last ${REPLAY_SECONDS} seconds · ${Wallet.format(Wallet.read())}`;
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title, text });
        return 'shared';
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return 'aborted';
    }

    const url = URL.createObjectURL(file);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = file.name;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return 'downloaded';
  }

  async function exportReplayVideo(clip) {
    if (!clip || clip.length < 2) throw new Error('Nothing to share yet');
    if (!canShareReplayVideo()) throw new Error('MP4 recording is not supported in this browser');

    const encoder = await createDriveMp4Encoder(canvas);
    if (!encoder) throw new Error('MP4 recording is not supported in this browser');

    return new Promise((resolve, reject) => {
      let settled = false;
      const wasWatching = state.replay.playing && !state.replay.exporting;

      const finish = (err, blob) => {
        if (settled) return;
        settled = true;
        state.replay.mp4Encoder = null;
        state.replay.exporting = false;
        state.replay.exportWaiter = null;
        state.replay.exportReject = null;
        if (state.replay.playing) {
          if (state.replay.savedLive) restoreLiveCheckpoint(state.replay.savedLive);
          state.replay.playing = false;
          state.replay.clip = null;
          state.replay.savedLive = null;
          state.replay.frameIdx = 0;
          state.replay.elapsed = 0;
          state.mode = state._resumeMode || 'drive';
        }
        updateReplayButton();
        updateShareReplayButton();
        if (err) reject(err);
        else resolve(blob);
      };

      state.replay.exportReject = (err) => {
        encoder.abort();
        finish(err || new Error('Export cancelled'));
      };

      if (!wasWatching) state.replay.savedLive = captureLiveCheckpoint();
      state.replay.clip = clip.map(f => structuredClone(f));
      state.replay.frameIdx = 0;
      state.replay.elapsed = 0;
      state.replay.playing = true;
      state.replay.exporting = true;
      state.replay.mp4Encoder = encoder;
      state._resumeMode = state.mode === 'pause' ? 'drive' : state.mode;
      state.mode = 'replay';
      applyReplayFrame(state.replay.clip[0]);

      state.replay.exportWaiter = () => {
        encoder.stop().then((blob) => finish(null, blob)).catch((err) => finish(err));
      };

      updateReplayButton();
      updateShareReplayButton();
    });
  }

  async function shareDriveReplay(buttonEl) {
    if (state.phase !== 'drive' || !state.drive || state.replay.sharing || state.replay.exporting) return;
    const clipSource = getShareableClip();
    if (!clipSource) {
      beep(220, 0.08, 'triangle', 0.025);
      return;
    }
    if (!canShareReplayVideo()) {
      window.alert('MP4 replay sharing is not supported in this browser.');
      return;
    }

    state.replay.sharing = true;
    updateShareReplayButton();

    let shareResult = null;
    try {
      const clip = clipSource.map(f => structuredClone(f));
      const blob = await exportReplayVideo(clip);
      if (!(blob.type || '').includes('mp4')) {
        throw new Error('Share requires an MP4 recording');
      }
      const file = new File(
        [blob],
        'night-drive-replay.mp4',
        { type: 'video/mp4' }
      );
      shareResult = await shareOrDownloadReplayVideo(file);
    } catch (err) {
      if (err?.message !== 'Export cancelled') {
        console.error(err);
        window.alert(err?.message || 'Could not create a replay video.');
      }
    } finally {
      state.replay.sharing = false;
      updateShareReplayButton();
      if (buttonEl && shareResult && shareResult !== 'aborted') {
        buttonEl.classList.add('is-shared');
        buttonEl.textContent = shareResult === 'downloaded' ? 'Saved' : 'Shared';
        setTimeout(() => {
          buttonEl.classList.remove('is-shared');
          updateShareReplayButton();
        }, 1600);
      }
    }
  }

  function endInstantReplay() {
    if (state.replay.exporting) return;
    if (!state.replay.playing) return;
    if (state.replay.savedLive) restoreLiveCheckpoint(state.replay.savedLive);
    state.replay.playing = false;
    state.replay.clip = null;
    state.replay.savedLive = null;
    state.replay.frameIdx = 0;
    state.replay.elapsed = 0;
    state.mode = state._resumeMode || 'drive';
    beep(520, 0.06, 'square', 0.025);
    updateReplayButton();
    updateShareReplayButton();
  }

  function startInstantReplay() {
    if (state.phase !== 'drive' || !state.drive) return;
    if (state.replay.sharing || state.replay.exporting) return;
    if (state.replay.playing) {
      // Replay label stays "Replay" — second tap restarts the clip instead of acting like Skip
      state.replay.frameIdx = 0;
      state.replay.elapsed = 0;
      if (state.replay.clip?.length) applyReplayFrame(state.replay.clip[0]);
      beep(660, 0.05, 'square', 0.03);
      return;
    }
    if (state.replay.buffer.length < 2) {
      beep(220, 0.08, 'triangle', 0.025);
      return;
    }
    state.replay.savedLive = captureLiveCheckpoint();
    state.replay.clip = state.replay.buffer.map(f => structuredClone(f));
    state.replay.frameIdx = 0;
    state.replay.elapsed = 0;
    state.replay.playing = true;
    state._resumeMode = state.mode === 'pause' ? 'drive' : state.mode;
    state.mode = 'replay';
    applyReplayFrame(state.replay.clip[0]);
    beep(660, 0.05, 'square', 0.03);
    beep(880, 0.08, 'square', 0.025);
    updateReplayButton();
    updateShareReplayButton();
  }

  function updateInstantReplay(dt) {
    const rp = state.replay;
    if (!rp.playing || !rp.clip || !rp.clip.length) return;
    rp.elapsed += dt;
    const clip = rp.clip;
    const targetT = clip[0].t + rp.elapsed;
    while (rp.frameIdx < clip.length - 1 && clip[rp.frameIdx + 1].t <= targetT) {
      rp.frameIdx++;
    }
    applyReplayFrame(clip[rp.frameIdx]);
    updateHUD();
    if (targetT >= clip[clip.length - 1].t) {
      if (rp.exporting) rp.exportWaiter?.();
      else endInstantReplay();
    }
  }

  function recordReplayFrame() {
    if (state.phase !== 'drive' || state.mode !== 'drive' || !state.drive) return;
    const d = state.drive;
    state.replay.buffer.push(captureReplayMoment());
    const cutoff = d.replayClock - REPLAY_SECONDS;
    while (state.replay.buffer.length > 1 && state.replay.buffer[0].t < cutoff) {
      state.replay.buffer.shift();
    }
    updateReplayButton();
    updateShareReplayButton();
  }

  function showOverlay(title, text, btnLabel) {

  function crossHospitalWho() {
    if (isEnter()) return state.entryDest?.name || 'The door';

    return 'Your car';

  function sendToHospital(reason) {
    const who = crossHospitalWho();
    try {
      sessionStorage.setItem('hospital-admit', JSON.stringify({
        from: 'cross',
        who,
        scenario: state.scenario,
        level: state.level,
        score: state.score,

        returnTo: `${location.pathname}${location.search}`,

      }));

    if (state.score > state.high) {
      state.high = state.score;
      localStorage.setItem(highKey(), String(state.high));
    }
    state.mode = 'gameover';
    showOverlay(
      'Heading to the ER',

  function loseLife(reason) {
    if (state.mode !== 'play' && state.mode !== 'drive') return;
    if (state.phase === 'cross' && state.invuln > 0) return;
    if (state.phase === 'drive' && state.drive && state.drive.invuln > 0) return;

    state.lives -= 1;
    state.flash = 0.35;
    state.shake = 0.28;
    state.combo = 0;
    state.comboTimer = 0;
    state.hopAnim = null;
    state.hopQueued = null;
    if (state.phase === 'cross') {
      spawnSplash(state.frog.col * TILE + TILE / 2, state.frog.row * TILE + TILE / 2);
    } else if (state.drive) {
      // crash FX already spawned by triggerDriveCrash
      state.drive.crashFlash = 0.55;
      state.drive.invuln = 1.6;
    }
    beep(90, 0.12, 'sawtooth', 0.06);
    beep(60, 0.22, 'square', 0.05);
    updateHUD();

    if (state.lives <= 0) {
      if (state.phase === 'cross') {
        sendToHospital(reason);
        return;
      }
      state.mode = 'gameover';
      if (state.score > state.high) {
        state.high = state.score;
        localStorage.setItem(highKey(), String(state.high));
      }
      showOverlay(
        state.phase === 'drive' ? 'Wrecked' : isEnter()
          ? 'Never made it inside'
          : (isGrill() ? 'Never left the block' : 'Never made it to the car'),
        `${reason} Purse ${Wallet.format(Wallet.read())}. Best run ${Wallet.format(state.high)}.`,
        'Try Again'
      );
      syncPauseBtn(true);
      return;
    }

    if (state.phase === 'cross') {
      state.mode = 'dead';
      setTimeout(() => {
        if (state.mode === 'dead') {
          resetFrog();
          state.mode = 'play';
        }
      }, 700);
    } else if (state.phase === 'drive' && state.drive && state.lives > 0) {
      // Survived the wreck — limp on with patched HP
      state.drive.hp = Math.max(35, Math.floor(state.drive.maxHp * 0.45));
      state.drive.invuln = 2.2;
      state.drive.speed = Math.min(state.drive.speed, 22);
      updateHUD();
    }
  }

    if (!d) return;
    clearNavTrip(d);

  // After leaving a roadside stop, spawn past its exit window so resume doesn't re-enter.
  function clearResumeExitTrap(d, resumeExitId) {
    if (!d || !resumeExitId || !d.route) return;
    const pathLen = d.route.length;
    const def = (d.route.exits || []).find(e => e.id === resumeExitId);
    const live = (d.exits || []).find(e => e.id === resumeExitId);
    if (live) live.taken = false;
    clearNavTrip(d);
    d.approachingExit = null;
    d.skipExitId = resumeExitId;
    d.playerX = 0;
    d.velX = 0;
    d.steer = 0;
    if (!def) return;
    const signed = routeSignedDist(d.z, def.z, pathLen);
    if (signed > -100 && signed < 140) {
      const past = wrapRouteZ(def.z + 110, pathLen);
      d.z += routeAheadDist(wrapRouteZ(d.z, pathLen), past, pathLen);
    }
  }
