<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bullion Desk</title>
  <link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,700&f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wallet.css">
  <script src="wallet.js"></script>
  <script src="music.js"></script>
  <style>
    :root {
      --brass: #c9a24a;
      --brass-hot: #f0d078;
      --cream: #f3ead4;
      --muted: #9a8f7a;
      --velvet: #6e1018;
      --velvet-deep: #3a080e;
      --font-display: 'Zodiak', Georgia, serif;
      --font-ui: 'Satoshi', 'General Sans', system-ui, sans-serif;
      --desk-tilt: 28deg;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      height: 100dvh;
      color: var(--cream);
      font-family: var(--font-ui);
      background:
        radial-gradient(ellipse 70% 45% at 50% 18%, rgba(90, 40, 28, 0.35), transparent 55%),
        radial-gradient(ellipse 90% 60% at 50% 100%, rgba(0, 0, 0, 0.55), transparent 50%),
        linear-gradient(180deg, #15100e 0%, #0a0807 55%, #050403 100%);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .shop {
      position: relative;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    .ticker {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 8;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
    }
    .ticker b {
      display: block;
      margin-top: 3px;
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      letter-spacing: 0.02em;
      color: var(--brass-hot);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .leave {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      /* sit under purse / calendar on the right; leave stays top-left under spot */
      z-index: 8;
      margin-top: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 4px;
      border: 1px solid rgba(201, 162, 74, 0.35);
      background: rgba(12, 10, 8, 0.55);
      color: var(--cream);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .leave:hover {
      border-color: rgba(240, 208, 120, 0.55);
      background: rgba(201, 162, 74, 0.16);
    }

    /* Full-viewport stage with perspective */
    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1100px;
      perspective-origin: 50% 42%;
      padding:
        max(72px, calc(env(safe-area-inset-top) + 64px))
        max(16px, calc(var(--purse-hud-clearance-right, 148px) * 0.35))
        max(28px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .tray {
      position: relative;
      width: min(980px, 96vw);
      aspect-ratio: 2.2 / 1;
      max-height: min(58vh, 420px);
      transform: rotateX(var(--desk-tilt));
      transform-style: preserve-3d;
      border-radius: 14px;
      background: linear-gradient(180deg, #3a2a1c, #1a120c);
      border: 1px solid rgba(201, 162, 74, 0.42);
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.65),
        0 2px 0 rgba(255, 230, 180, 0.12),
        inset 0 1px 0 rgba(255, 230, 180, 0.18);
      overflow: visible;
    }

    .tray-rail {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 12px;
      border-radius: 14px 14px 0 0;
      background: linear-gradient(180deg, #e0c078, #c9a24a 45%, #8a6a28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: translateZ(2px);
    }

    .velvet {
      position: absolute;
      inset: 12px 10px 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-evenly;
      gap: clamp(6px, 1.5vw, 20px);
      padding: 6% 4% 8%;
      transform-style: preserve-3d;
      overflow: visible;
      background:
        radial-gradient(ellipse 85% 70% at 50% 45%, #8c1a26 0%, transparent 60%),
        radial-gradient(ellipse 35% 40% at 20% 70%, rgba(0, 0, 0, 0.3), transparent 55%),
        radial-gradient(ellipse 35% 40% at 80% 65%, rgba(0, 0, 0, 0.28), transparent 55%),
        linear-gradient(165deg, #7a1420 0%, var(--velvet) 45%, var(--velvet-deep) 100%);
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 180, 190, 0.08);
    }

    .velvet::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0.4;
      background:
        repeating-linear-gradient(92deg, transparent 0 3px, rgba(255, 180, 190, 0.045) 3px 4px),
        repeating-linear-gradient(0deg, transparent 0 5px, rgba(0, 0, 0, 0.06) 5px 6px);
      pointer-events: none;
    }

    .velvet::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        125deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.03) 14%,
        transparent 34%,
        transparent 70%,
        rgba(180, 210, 230, 0.07) 100%
      );
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .piece {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex: 1 1 0;
      min-width: 0;
      max-width: 280px;
      transform-style: preserve-3d;
      -webkit-tap-highlight-color: transparent;
    }
    .piece.is-unaffordable { opacity: 0.7; }

    .coin-stage {
      position: relative;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      /* Sit above the velvet so a Y-flip never swings through the table */
      transform: translateZ(36px) rotateX(calc(var(--desk-tilt) * -0.72));
    }

    /* Flat, camera-facing hit plate — 3D coin faces/edges miss clicks mid-spin */
    .coin-hit {
      position: absolute;
      inset: 0;
      z-index: 2;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transform: translateZ(28px);
      -webkit-tap-highlight-color: transparent;
    }
    .coin-hit:focus-visible {
      outline: 2px solid var(--brass-hot);
      outline-offset: 4px;
    }

    .coin-stage::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 58%;
      width: 88%;
      height: 42%;
      transform: translateX(-50%) translateZ(-28px);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.5), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .coin {
      --coin-d: 120px;
      --coin-depth: 10px;
      --edge-n: 36;
      --edge-seg: calc(3.14159 * var(--coin-d) / var(--edge-n) + 0.8px);
      position: relative;
      width: var(--coin-d);
      height: var(--coin-d);
      border-radius: 50%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      pointer-events: none;
      transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
      /* Soft ground shadow without filter() — filter flattens preserve-3d */
      box-shadow: 0 16px 18px rgba(0, 0, 0, 0.45);
    }

    .coin.size-tenth {
      --coin-d: clamp(56px, 10vw, 88px);
      --coin-depth: 7px;
    }
    .coin.size-quarter {
      --coin-d: clamp(78px, 13vw, 118px);
      --coin-depth: 9px;
    }
    .coin.size-ounce {
      --coin-d: clamp(104px, 17vw, 156px);
      --coin-depth: 11px;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        0 0 0 1px rgba(90, 60, 20, 0.45),
        inset 0 1px 0 rgba(255, 240, 180, 0.28);
      background: #8a6a28;
    }
    .coin-face img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .coin-face.front {
      transform: translateZ(calc(var(--coin-depth) / 2));
    }
    .coin-face.back {
      transform: rotateY(180deg) translateZ(calc(var(--coin-depth) / 2));
    }
    .coin-face::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.24), transparent 42%, transparent 58%, rgba(0,0,0,0.2));
      pointer-events: none;
    }

    /*
      Rim = cylinder around Z (same axis as the faces).
      Width = thickness → becomes Z after rotateY(90); height = arc segment.
    */
    .coin-edge {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--coin-depth);
      height: var(--edge-seg);
      margin-top: calc(var(--edge-seg) / -2);
      margin-left: calc(var(--coin-depth) / -2);
      background:
        linear-gradient(
          90deg,
          #f0d078 0%,
          #c9a24a 22%,
          #8a6a28 48%,
          #5a4218 72%,
          #d4b56a 100%
        );
      transform:
        rotateZ(var(--a))
        translateX(calc(var(--coin-d) / 2 - 0.5px))
        rotateY(90deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Labels sit upright toward the viewer so they stay readable on the tilted desk */
    .tag {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-top: 10px;
      text-align: center;
      transform: translateZ(36px) rotateX(calc(var(--desk-tilt) * -0.85));
      transform-style: preserve-3d;
    }
    .tag .denom {
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 0.75rem + 0.4vw, 1.1rem);
      font-weight: 700;
      color: #f6e8c8;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      white-space: nowrap;
    }
    .tag .weight {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 214, 160, 0.82);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
    .ask {
      appearance: none;
      margin-top: 6px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 12px 7px;
      border-radius: 4px;
      border: 1px solid rgba(201, 162, 74, 0.45);
      background: rgba(12, 10, 8, 0.72);
      color: var(--brass-hot);
      font-family: var(--font-display);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
    .ask:hover:not(:disabled) {
      border-color: rgba(240, 208, 120, 0.7);
      background: rgba(201, 162, 74, 0.18);
    }
    .ask:active:not(:disabled) {
      transform: translateY(1px);
    }
    .ask .ask-label {
      font-family: var(--font-ui);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 214, 160, 0.78);
      text-shadow: none;
    }
    .ask .ask-amt {
      font-weight: 700;
      font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.35rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .piece.is-unaffordable .ask {
      color: #a89880;
      border-color: rgba(168, 152, 128, 0.35);
      cursor: not-allowed;
    }
    .piece.is-unaffordable .ask .ask-label { color: rgba(168, 152, 128, 0.75); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      z-index: 20;
      padding: 10px 18px;
      border-radius: 6px;
      background: rgba(12, 10, 8, 0.92);
      border: 1px solid rgba(201, 162, 74, 0.45);
      color: var(--brass-hot);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.bad { color: #f28a8a; border-color: rgba(242, 138, 138, 0.45); }

    @media (max-width: 720px) {
      :root { --desk-tilt: 26deg; }
      .tray {
        width: min(98vw, 640px);
        aspect-ratio: 2.05 / 1;
        max-height: 46vh;
      }
      .velvet {
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: space-evenly;
        gap: 4px;
        padding: 7% 3% 9%;
      }
      .tag { margin-top: 6px; }
      .tag .denom { font-size: clamp(0.72rem, 2.6vw, 0.95rem); }
      .ask .ask-amt { font-size: clamp(0.9rem, 3.2vw, 1.15rem); }
      .coin.size-tenth { --coin-d: clamp(52px, 14vw, 72px); }
      .coin.size-quarter { --coin-d: clamp(68px, 18vw, 96px); }
      .coin.size-ounce { --coin-d: clamp(86px, 22vw, 120px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .coin { transition-duration: 1ms; }
    }
  </style>
</head>
<body>
  <div class="shop">
    <div class="ticker" aria-live="polite">
      Live spot
      <b id="spotVal">$2,000/oz</b>
    </div>
    <a class="leave" href="frogger.html?resumeDrive=1">Leave</a>

    <div class="stage">
      <div class="tray" aria-label="Bullion tray">
        <div class="tray-rail" aria-hidden="true"></div>
        <div class="velvet" id="cases"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
(() => {
  const toastEl = document.getElementById('toast');
  const casesEl = document.getElementById('cases');
  let toastTimer = null;

  // Smaller coins carry a steeper premium over spot.
  const SIZES = [
    { oz: 0.1, className: 'size-tenth', label: '1/10 oz', fee: 0.15 },
    { oz: 0.25, className: 'size-quarter', label: '1/4 oz', fee: 0.10 },
    { oz: 1, className: 'size-ounce', label: '1 oz', fee: 0.07 }
  ];
  const SIZE_BY_OZ = Object.fromEntries(SIZES.map((s) => [s.oz, s]));

  // Per-kind sizes: Buffalo is 1 oz only; Gold Eagle comes in all three.
  const KINDS = [
    {
      name: 'Krugerrand',
      ozList: [0.1, 0.25, 1],
      front: 'assets/krugerrand-reverse.png',
      back: 'assets/krugerrand-obverse.png'
    },
    {
      name: 'American Eagle',
      ozList: [0.1, 0.25, 1],
      front: 'assets/eagle-reverse.png',
      back: 'assets/eagle-obverse.png'
    },
    {
      name: 'American Buffalo',
      ozList: [1],
      front: 'assets/buffalo-reverse.png',
      back: 'assets/buffalo-obverse.png'
    },
    {
      name: 'Maple Leaf',
      ozList: [0.1, 0.25, 1],
      front: 'assets/maple-reverse.png',
      back: 'assets/maple-obverse.png'
    }
  ];

  const CATALOG = KINDS.flatMap((kind) =>
    kind.ozList.map((oz) => {
      const size = SIZE_BY_OZ[oz];
      return {
        name: kind.name,
        fee: size.fee,
        front: kind.front,
        back: kind.back,
        oz: size.oz,
        sizeClass: size.className,
        sizeLabel: size.label
      };
    })
  );

  function money(n) {
    return Wallet.format(n);
  }

  function toast(msg, bad) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('bad', !!bad);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function shuffle(list) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function pickStock(count) {
    return shuffle(CATALOG).slice(0, count);
  }

  function caseFee(card) {
    return card.dataset.fee != null ? Number(card.dataset.fee) : undefined;
  }

  function caseLabel(card) {
    const name = card.dataset.name || 'Coin';
    const oz = Number(card.dataset.oz);
    const size = oz === 1 ? '1 oz' : oz === 0.25 ? '1/4 oz' : '1/10 oz';
    return `${size} ${name}`;
  }

  function buildEdges(count) {
    const parts = [];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * 360;
      parts.push(`<span class="coin-edge" style="--a:${a}deg" aria-hidden="true"></span>`);
    }
    return parts.join('');
  }

  function buildPiece(item) {
    const card = document.createElement('article');
    card.className = 'piece';
    card.dataset.oz = String(item.oz);
    card.dataset.fee = String(item.fee);
    card.dataset.name = item.name;

    const yaw = ((Math.random() * 16) - 8).toFixed(1);
    const showBackFirst = Math.random() < 0.5;
    let flipY = showBackFirst ? 180 : 0;
    let hoverZ = 0;
    let liftZ = 0;
    let settleTimer = 0;
    const EDGE_N = 36;

    card.innerHTML = [
      '<div class="coin-stage">',
      `<div class="coin ${item.sizeClass}" aria-hidden="true">`,
      buildEdges(EDGE_N),
      `<span class="coin-face front"><img src="${item.front}" alt="" draggable="false"></span>`,
      `<span class="coin-face back"><img src="${item.back}" alt="" draggable="false"></span>`,
      '</div>',
      `<button type="button" class="coin-hit" aria-label="Flip ${item.sizeLabel} ${item.name}"></button>`,
      '</div>',
      '<div class="tag">',
      `<span class="denom">${item.name}</span>`,
      `<span class="weight">${item.sizeLabel}</span>`,
      `<button type="button" class="ask" aria-label="Ask price — buy ${item.sizeLabel} ${item.name} with cash">`,
      '<span class="ask-label">Ask</span>',
      '<span class="ask-amt" data-price>——</span>',
      '</button>',
      '</div>'
    ].join('');

    const coin = card.querySelector('.coin');
    const hit = card.querySelector('.coin-hit');
    const askBtn = card.querySelector('.ask');
    function applySpin(animate) {
      if (!animate) coin.style.transition = 'none';
      coin.style.transform = `rotateZ(${yaw}deg) rotateY(${flipY}deg) translateZ(${hoverZ + liftZ}px)`;
      if (!animate) {
        void coin.offsetWidth;
        coin.style.transition = '';
      }
    }
    applySpin(false);

    const flip = () => {
      flipY += 180;
      // Lift by ~radius so the spinning disk clears the velvet mid-flip
      liftZ = Math.ceil(coin.offsetWidth * 0.55) + 8;
      applySpin(true);
      window.clearTimeout(settleTimer);
      const settleMs = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 20 : 720;
      settleTimer = window.setTimeout(() => {
        liftZ = 0;
        applySpin(true);
      }, settleMs);
    };
    hit.addEventListener('click', flip);
    card.addEventListener('mouseenter', () => {
      if (!card.classList.contains('is-unaffordable')) {
        hoverZ = 8;
        applySpin(true);
      }
    });
    card.addEventListener('mouseleave', () => {
      hoverZ = 0;
      applySpin(true);
    });
    askBtn.addEventListener('click', () => buyCase(card));

    return card;
  }

  function stockCases() {
    casesEl.replaceChildren(...pickStock(3).map(buildPiece));
  }

  function refresh() {
    const spot = Math.round(Wallet.goldSpot());
    document.getElementById('spotVal').textContent = `${money(spot)}/oz`;
    casesEl.querySelectorAll('.piece').forEach((card) => {
      const oz = Number(card.dataset.oz);
      const cashAsk = Wallet.goldBuyCost(oz, caseFee(card));
      const askBtn = card.querySelector('.ask');
      card.querySelectorAll('[data-price]').forEach((el) => {
        el.textContent = money(cashAsk);
      });
      const broke = Wallet.cash() < cashAsk;
      card.classList.toggle('is-unaffordable', broke);
      if (askBtn) askBtn.disabled = broke;
    });
  }

  function buyCase(card) {
    if (!card || card.classList.contains('is-unaffordable')) {
      toast('Not enough cash', true);
      return;
    }
    const oz = Number(card.dataset.oz);
    const result = Wallet.buyGold(oz, 'cash', { fee: caseFee(card) });
    if (!result.ok) {
      toast(result.reason || 'Couldn’t buy', true);
      return;
    }
    toast(`${caseLabel(card)} — ${money(result.cost)} cash`);
    refresh();
  }

  stockCases();
  Wallet.subscribe(refresh);
  refresh();
})();
  </script>
</body>
</html>
