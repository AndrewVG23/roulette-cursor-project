<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lake Shore Coin — Bullion Desk</title>
  <link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,700&f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wallet.css">
  <script src="wallet.js"></script>
  <style>
    :root {
      --ink: #0c0a08;
      --brass: #c9a24a;
      --brass-hot: #f0d078;
      --cream: #f3ead4;
      --muted: #9a8f7a;
      --velvet: #6e1018;
      --velvet-deep: #3a080e;
      --font-display: 'Zodiak', Georgia, serif;
      --font-ui: 'Satoshi', 'General Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--cream);
      font-family: var(--font-ui);
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(90, 55, 28, 0.35), transparent 55%),
        linear-gradient(180deg, #1a1410 0%, #0c0a08 40%, #080706 100%);
      -webkit-user-select: none;
      user-select: none;
    }

    .shop {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      padding-right: max(16px, calc(var(--purse-hud-clearance-right, 148px) + 4px));
    }

    .mast {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px 20px;
      margin-bottom: 16px;
      max-width: 1040px;
      width: 100%;
      margin-inline: auto;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2rem, 4vw + 1rem, 3.4rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--cream);
      text-shadow: 0 2px 24px rgba(201, 162, 74, 0.22);
    }
    .ticker {
      text-align: right;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ticker b {
      display: block;
      margin-top: 4px;
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      color: var(--brass-hot);
      font-variant-numeric: tabular-nums;
    }

    /* One brass-framed tray — coins share the velvet */
    .desk {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      min-height: 0;
    }

    .tray {
      position: relative;
      width: 100%;
      border-radius: 10px;
      background:
        linear-gradient(180deg, #3a2a1c 0%, #1c140e 100%);
      border: 1px solid rgba(201, 162, 74, 0.4);
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 230, 180, 0.14);
      overflow: hidden;
    }

    .tray-rail {
      height: 16px;
      background:
        linear-gradient(180deg, #e0c078, #c9a24a 40%, #8a6a28 70%, #5a4218);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4);
    }

    .velvet {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-evenly;
      gap: clamp(8px, 2vw, 28px);
      min-height: min(52vh, 420px);
      padding: clamp(28px, 5vw, 48px) clamp(16px, 4vw, 40px) clamp(22px, 3vw, 32px);
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, #8a1824 0%, transparent 62%),
        radial-gradient(ellipse 40% 50% at 18% 70%, rgba(0, 0, 0, 0.28), transparent 55%),
        radial-gradient(ellipse 40% 50% at 82% 65%, rgba(0, 0, 0, 0.25), transparent 55%),
        linear-gradient(165deg, #7a1420 0%, var(--velvet) 42%, var(--velvet-deep) 100%);
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.45);
    }

    /* Velvet nap */
    .velvet::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background:
        repeating-linear-gradient(
          92deg,
          transparent 0 3px,
          rgba(255, 180, 190, 0.04) 3px 4px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0 5px,
          rgba(0, 0, 0, 0.05) 5px 6px
        );
      pointer-events: none;
    }

    /* Soft glass glare over the whole tray */
    .velvet::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(125deg,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.03) 16%,
          transparent 36%,
          transparent 68%,
          rgba(180, 210, 230, 0.06) 100%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .piece {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      flex: 1 1 0;
      min-width: 0;
      max-width: 280px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .piece.is-unaffordable {
      cursor: default;
      opacity: 0.72;
    }

    .coin-stage {
      position: relative;
      display: grid;
      place-items: center;
      height: min(220px, 36vw);
      perspective: 900px;
      filter: drop-shadow(0 14px 10px rgba(0, 0, 0, 0.55));
    }

    /* Soft dent in the velvet under each coin */
    .coin-stage::after {
      content: '';
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 14%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.5), transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .coin {
      position: relative;
      z-index: 1;
      border-radius: 50%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      cursor: pointer;
      box-shadow:
        0 0 0 1.5px rgba(90, 60, 20, 0.55),
        0 8px 18px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 240, 180, 0.28);
      transition: transform 180ms ease;
    }

    /* Weight shown by physical size — relative diameters */
    .coin.size-tenth {
      width: clamp(72px, 16vw, 108px);
      height: clamp(72px, 16vw, 108px);
    }
    .coin.size-quarter {
      width: clamp(108px, 22vw, 148px);
      height: clamp(108px, 22vw, 148px);
    }
    .coin.size-ounce {
      width: clamp(148px, 30vw, 200px);
      height: clamp(148px, 30vw, 200px);
    }

    .coin-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .coin-face.front { transform: rotateY(0deg); }
    .coin-face.back { transform: rotateY(180deg); }
    .coin.is-flipped .coin-face.front { transform: rotateY(180deg); }
    .coin.is-flipped .coin-face.back { transform: rotateY(360deg); }
    .coin::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 42%, transparent 58%, rgba(0,0,0,0.18));
      pointer-events: none;
      z-index: 2;
    }

    .tag {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-align: center;
      padding: 0 4px;
    }
    .tag .denom {
      font-family: var(--font-display);
      font-size: clamp(0.95rem, 0.85rem + 0.4vw, 1.2rem);
      font-weight: 700;
      color: #f6e8c8;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
    }
    .tag .weight {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 214, 160, 0.78);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
    }
    .ask {
      margin-top: 4px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.15rem, 1rem + 0.55vw, 1.45rem);
      color: var(--brass-hot);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.65), 0 2px 10px rgba(0, 0, 0, 0.35);
    }
    .piece.is-unaffordable .ask {
      color: #a89880;
    }

    .foot {
      max-width: 1040px;
      width: 100%;
      margin: 18px auto 0;
      display: flex;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 4px;
      border: 1px solid rgba(201, 162, 74, 0.35);
      background: rgba(255, 255, 255, 0.04);
      color: var(--cream);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { border-color: rgba(240, 208, 120, 0.55); background: rgba(201, 162, 74, 0.12); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      z-index: 20;
      padding: 10px 18px;
      border-radius: 6px;
      background: rgba(12, 10, 8, 0.92);
      border: 1px solid rgba(201, 162, 74, 0.45);
      color: var(--brass-hot);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.bad { color: #f28a8a; border-color: rgba(242, 138, 138, 0.45); }

    @media (max-width: 720px) {
      .velvet {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        min-height: 0;
        padding: 32px 20px 28px;
      }
      .coin-stage { height: auto; }
      .ticker { text-align: left; }
      .mast { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shop">
    <header class="mast">
      <div class="brand">
        <h1>Lake Shore Coin</h1>
      </div>
      <div class="ticker" aria-live="polite">
        Live spot
        <b id="spotVal">$2,000/oz</b>
      </div>
    </header>

    <section class="desk" aria-label="Bullion tray">
      <div class="tray">
        <div class="tray-rail" aria-hidden="true"></div>
        <div class="velvet" id="cases"></div>
      </div>
    </section>

    <footer class="foot">
      <a class="btn" href="frogger.html?resumeDrive=1">Leave</a>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
(() => {
  const toastEl = document.getElementById('toast');
  const casesEl = document.getElementById('cases');
  let toastTimer = null;

  const SIZES = [
    { oz: 0.1, className: 'size-tenth', label: '1/10 oz' },
    { oz: 0.25, className: 'size-quarter', label: '1/4 oz' },
    { oz: 1, className: 'size-ounce', label: '1 oz' }
  ];
  const KINDS = [
    {
      name: 'Krugerrand',
      fee: 0.05,
      front: 'assets/krugerrand-reverse.png',
      back: 'assets/krugerrand-obverse.png'
    },
    {
      name: 'American Buffalo',
      fee: 0.10,
      front: 'assets/buffalo-reverse.png',
      back: 'assets/buffalo-obverse.png'
    },
    {
      name: 'Maple Leaf',
      fee: 0.10,
      front: 'assets/maple-reverse.png',
      back: 'assets/maple-obverse.png'
    }
  ];

  const CATALOG = KINDS.flatMap((kind) =>
    SIZES.map((size) => ({
      name: kind.name,
      fee: kind.fee,
      front: kind.front,
      back: kind.back,
      oz: size.oz,
      sizeClass: size.className,
      sizeLabel: size.label
    }))
  );

  function money(n) {
    return Wallet.format(n);
  }

  function toast(msg, bad) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('bad', !!bad);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function shuffle(list) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function pickStock(count) {
    return shuffle(CATALOG).slice(0, count);
  }

  function caseFee(card) {
    return card.dataset.fee != null ? Number(card.dataset.fee) : undefined;
  }

  function caseLabel(card) {
    const name = card.dataset.name || 'Coin';
    const oz = Number(card.dataset.oz);
    const size = oz === 1 ? '1 oz' : oz === 0.25 ? '1/4 oz' : '1/10 oz';
    return `${size} ${name}`;
  }

  function buildPiece(item) {
    const card = document.createElement('article');
    card.className = 'piece';
    card.dataset.oz = String(item.oz);
    card.dataset.fee = String(item.fee);
    card.dataset.name = item.name;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Buy ${item.sizeLabel} ${item.name} with cash`);

    const tilt = ((Math.random() * 10) - 5).toFixed(1);
    card.innerHTML = [
      '<div class="coin-stage">',
      `<div class="coin ${item.sizeClass}" style="transform: rotate(${tilt}deg)" role="button" tabindex="0" aria-label="Flip ${item.sizeLabel} ${item.name}">`,
      `<img class="coin-face front" src="${item.front}" alt="" draggable="false" />`,
      `<img class="coin-face back" src="${item.back}" alt="" draggable="false" />`,
      '</div>',
      '</div>',
      '<div class="tag">',
      `<span class="denom">${item.name}</span>`,
      `<span class="weight">${item.sizeLabel}</span>`,
      '<div class="ask" data-price>——</div>',
      '</div>'
    ].join('');

    const coin = card.querySelector('.coin');
    const baseTilt = `rotate(${tilt}deg)`;
    const flip = () => coin.classList.toggle('is-flipped');
    coin.addEventListener('click', (ev) => {
      ev.stopPropagation();
      flip();
    });
    coin.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        ev.stopPropagation();
        flip();
      }
    });
    card.addEventListener('mouseenter', () => {
      if (!card.classList.contains('is-unaffordable')) {
        coin.style.transform = `${baseTilt} scale(1.04)`;
      }
    });
    card.addEventListener('mouseleave', () => {
      coin.style.transform = baseTilt;
    });
    card.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        buyCase(card);
      }
    });

    return card;
  }

  function stockCases() {
    casesEl.replaceChildren(...pickStock(3).map(buildPiece));
  }

  function refresh() {
    const spot = Math.round(Wallet.goldSpot());
    document.getElementById('spotVal').textContent = `${money(spot)}/oz`;
    casesEl.querySelectorAll('.piece').forEach((card) => {
      const oz = Number(card.dataset.oz);
      const cashAsk = Wallet.goldBuyCost(oz, caseFee(card));
      card.querySelectorAll('[data-price]').forEach((el) => {
        el.textContent = money(cashAsk);
      });
      card.classList.toggle('is-unaffordable', Wallet.cash() < cashAsk);
    });
  }

  function buyCase(card) {
    if (!card || card.classList.contains('is-unaffordable')) {
      toast('Not enough cash', true);
      return;
    }
    const oz = Number(card.dataset.oz);
    const result = Wallet.buyGold(oz, 'cash', { fee: caseFee(card) });
    if (!result.ok) {
      toast(result.reason || 'Couldn’t buy', true);
      return;
    }
    toast(`${caseLabel(card)} — ${money(result.cost)} cash`);
    refresh();
  }

  casesEl.addEventListener('click', (ev) => {
    if (ev.target.closest('.coin')) return;
    const card = ev.target.closest('.piece');
    if (!card || !casesEl.contains(card)) return;
    buyCase(card);
  });

  stockCases();
  Wallet.subscribe(refresh);
  refresh();
})();
  </script>
</body>
</html>
