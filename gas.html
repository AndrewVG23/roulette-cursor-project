<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quik-Fill 64</title>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=zodiak@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wallet.css">
  <script src="wallet.js"></script>
  <script src="orientation.js"></script>
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
      --color-bg: #0d1512; --color-surface: #13211b; --color-surface-2: #173027;
      --color-border: #2c473c; --color-text: #f5edd8; --color-text-muted: #bdb39b;
      --color-text-faint: #897f6d; --color-primary: #d0a23a;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,.28); --shadow-md: 0 12px 30px rgba(0,0,0,.34);
      --font-display: 'Zodiak', Georgia, serif;
      --font-body: 'General Sans', 'Inter', sans-serif;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html { height: 100%; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--color-text);
      background: linear-gradient(180deg, #0a1018, #060a08 60%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .app { width: 100%; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }
    .stage { position: relative; flex: 1; min-height: 0; }
    canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: var(--space-3);
      padding: 8px 10px;
      background: linear-gradient(180deg, rgba(8,12,10,.72), transparent);
      pointer-events: none;
    }
    .stats { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: flex-end; }
    .stat {
      min-width: 64px;
      padding: 6px 10px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(20,53,40,.78), rgba(12,26,21,.92));
      border: 1px solid rgba(238,194,97,.18);
      text-align: center;
    }
    .stat .label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-faint);
    }
    .stat .value {
      display: block;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-base);
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }
    .stat.red .value { color: #f26e6e; }

    @media (max-width: 640px) {
      .topbar {
        justify-content: center;
        gap: 6px;
        padding-left: 8px;
        padding-right: 8px;
      }
      .stats {
        gap: 4px;
        justify-content: center;
        width: 100%;
      }
      .stat {
        flex: 1 1 0;
        min-width: 0;
        padding: 4px 5px;
      }
      .stat .label {
        font-size: 0.52rem;
        letter-spacing: 0.06em;
      }
      .stat .value {
        font-size: 0.82rem;
      }
    }

    .toast {
      position: absolute;
      left: 50%; top: 14%;
      transform: translateX(-50%) translateY(-6px);
      z-index: 4;
      padding: 8px 18px;
      border-radius: var(--radius-md);
      background: rgba(10, 18, 14, 0.88);
      border: 1px solid rgba(238,194,97,.32);
      font-family: var(--font-display);
      font-size: var(--text-lg);
      color: var(--color-primary);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease, transform 240ms ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast small { display: block; font-family: var(--font-body); font-size: var(--text-xs); color: var(--color-text-muted); }

    .overlay {
      position: absolute; inset: 0; z-index: 6;
      display: grid; place-items: center;
      background: rgba(5, 9, 7, 0.78);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      max-width: min(440px, calc(100vw - 40px));
      padding: var(--space-6) var(--space-6) var(--space-5);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(23,48,39,.96), rgba(13,21,18,.98));
      border: 1px solid rgba(238,194,97,.24);
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .overlay-card h2 {
      margin: 0 0 var(--space-2);
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: var(--color-primary);
      letter-spacing: 0.01em;
    }
    .overlay-card p { margin: 0 0 var(--space-4); color: var(--color-text-muted); font-size: var(--text-sm); line-height: 1.5; }
    .overlay-card .keys { color: var(--color-text); }
    .overlay-card .overlay-price {
      margin: 0 0 var(--space-4);
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.02em;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--space-2);
      padding: 9px 16px;
      border-radius: 3px;
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      color: var(--color-text);
      font-size: var(--text-sm);
      font-weight: 600;
      text-decoration: none;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }
    .btn:hover { border-color: rgba(238,194,97,.4); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: linear-gradient(180deg, #e3b756, #c2922e);
      border-color: #8a6a1e;
      color: #221806;
    }
    .btn.subtle { background: rgba(19,33,27,.82); }
    .control-row { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center; }

    .controls {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--space-2);
      justify-content: flex-start;
      padding: 10px;
      background: linear-gradient(0deg, rgba(8,12,10,.72), transparent);
      pointer-events: none;
    }
    .controls .control-row { pointer-events: auto; justify-content: flex-start; }

    .help-btn {
      position: absolute;
      right: 12px; bottom: 64px;
      z-index: 4;
      width: 36px; height: 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: rgba(19,33,27,.85);
      color: var(--color-text-muted);
      font-weight: 700;
    }
    .help-panel {
      position: absolute;
      right: 12px; bottom: 108px;
      z-index: 5;
      width: min(280px, calc(100vw - 24px));
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      background: rgba(13,21,18,.96);
      border: 1px solid rgba(238,194,97,.22);
      box-shadow: var(--shadow-md);
    }
    .help-panel[hidden] { display: none; }
    .help-panel h3 { margin: 0 0 var(--space-2); font-family: var(--font-display); color: var(--color-primary); font-size: var(--text-base); }
    .help-panel p { margin: 0 0 var(--space-2); font-size: var(--text-xs); color: var(--color-text-muted); line-height: 1.55; }
    .help-panel b { color: var(--color-text); font-weight: 600; }

    /* Touch controls */
    .touch-ui { display: none; }
    @media (pointer: coarse) { .touch-ui { display: block; } }
    .joy {
      position: absolute;
      left: 18px; bottom: 56px;
      z-index: 4;
      width: 118px; height: 118px;
      border-radius: 50%;
      border: 1px solid rgba(238,194,97,.22);
      background: rgba(13,21,18,.4);
      touch-action: none;
    }
    .joy .nub {
      position: absolute;
      left: 50%; top: 50%;
      width: 48px; height: 48px;
      margin: -24px 0 0 -24px;
      border-radius: 50%;
      background: rgba(208,162,58,.5);
      border: 1px solid rgba(238,194,97,.5);
    }
    .jump-btn {
      position: absolute;
      right: 22px; bottom: 118px;
      z-index: 4;
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 1px solid rgba(238,194,97,.4);
      background: radial-gradient(circle at 35% 30%, rgba(227,183,86,.75), rgba(140,102,30,.75));
      color: #221806;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      touch-action: none;
    }
  </style>
</head>
<body class="has-purse-hud">
  <div class="app">
    <main class="stage" id="stage">
      <canvas id="game" aria-label="Quik-Fill 64: run and jump around the gas station"></canvas>

      <div class="toast" id="toast"></div>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle" hidden></h2>
          <p id="overlayText">Pump your own gas</p>
          <p class="keys" id="overlayKeys" hidden></p>
          <div class="control-row" id="overlayStartRow">
            <button class="btn primary" id="startBtn" type="button">Start</button>
          </div>
        </div>
      </div>

      <div class="touch-ui">
        <div class="joy" id="joy"><div class="nub" id="joyNub"></div></div>
        <button class="jump-btn" id="jumpBtn" type="button" aria-label="Jump">A</button>
      </div>

      <div class="controls" aria-label="Game controls">
        <div class="control-row">
          <a class="btn subtle" id="leaveBtn" href="frogger.html?resumeDrive=1">Leave</a>
        </div>
      </div>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // Every trip to the station compounds the whole economy — gas, gold spot,
    // and every inflated price tick up together, harder each visit.
    Wallet.recordGasVisit();

    // ---------------------------------------------------------------- fuel / night-drive sync
    const leaveBtn = document.getElementById('leaveBtn');

    function hasDriveCheckpoint() {
      try {
        const raw = sessionStorage.getItem('drive-checkpoint');
        if (!raw) return false;
        const data = JSON.parse(raw);
        return !!(data && data.drive);
      } catch (_) {
        return false;
      }
    }

    function syncCheckpointFuel() {
      try {
        const raw = sessionStorage.getItem('drive-checkpoint');
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data?.drive) return;
        data.drive.maxFuel = Wallet.GAS_TANK_GAL;
        data.drive.fuel = Wallet.fuel();
        sessionStorage.setItem('drive-checkpoint', JSON.stringify(data));
      } catch (_) { /* ignore */ }
    }

    leaveBtn.textContent = 'Leave';

    // ---------------------------------------------------------------- setup
    const canvas = document.getElementById('game');
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b12);
    scene.fog = new THREE.FogExp2(0x070b12, 0.011);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    // ---------------------------------------------------------------- audio
    let audioCtx = null;
    let muted = false;
    function ac() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function beep(freq, dur, type = 'square', gain = 0.05, slide = 0) {
      if (muted) return;
      try {
        const ctx = ac();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ctx.currentTime + dur);
        g.gain.setValueAtTime(gain, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + dur + 0.02);
      } catch (_) { /* no audio */ }
    }
    const sfx = {
      jump(n) { beep(220 + n * 90, 0.18, 'sine', 0.05, 260 + n * 120); },
      land() { beep(120, 0.08, 'sine', 0.035, -40); },
      coin() { beep(1180, 0.07, 'square', 0.038); setTimeout(() => beep(1568, 0.12, 'square', 0.038), 60); },
      red() { beep(880, 0.07, 'square', 0.04); setTimeout(() => beep(1174, 0.07, 'square', 0.04), 60); setTimeout(() => beep(1760, 0.14, 'square', 0.04), 120); },
      gold() { beep(660, 0.08, 'triangle', 0.05); setTimeout(() => beep(988, 0.1, 'triangle', 0.05), 70); setTimeout(() => beep(1318, 0.16, 'triangle', 0.05), 140); },
      can() {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.06), i * 110));
      },
      win() {
        [392, 523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.06), i * 130));
      }
    };

    // ---------------------------------------------------------------- textures
    function canvasTexture(w, h, draw) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }

    const asphaltTex = canvasTexture(512, 512, (g, w, h) => {
      g.fillStyle = '#2b2b2e';
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 4200; i++) {
        const v = 30 + Math.random() * 30;
        g.fillStyle = `rgba(${v},${v},${v + 4},${0.25 + Math.random() * 0.3})`;
        g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
      }
      // cracks
      g.strokeStyle = 'rgba(14,14,16,0.7)';
      g.lineWidth = 1.4;
      for (let i = 0; i < 8; i++) {
        g.beginPath();
        let x = Math.random() * w, y = Math.random() * h;
        g.moveTo(x, y);
        for (let s = 0; s < 6; s++) {
          x += (Math.random() - 0.5) * 90; y += (Math.random() - 0.5) * 90;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      // faded parking lines
      g.strokeStyle = 'rgba(210,200,170,0.16)';
      g.lineWidth = 6;
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.moveTo(60 + i * 120, h - 20);
        g.lineTo(60 + i * 120, h - 130);
        g.stroke();
      }
      // oil stains
      for (let i = 0; i < 6; i++) {
        const x = Math.random() * w, y = Math.random() * h, r = 20 + Math.random() * 40;
        const gr = g.createRadialGradient(x, y, 2, x, y, r);
        gr.addColorStop(0, 'rgba(8,8,10,0.55)');
        gr.addColorStop(1, 'rgba(8,8,10,0)');
        g.fillStyle = gr;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
    });
    asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;
    asphaltTex.repeat.set(4, 4);

    const fasciaTex = canvasTexture(1024, 96, (g, w, h) => {
      g.fillStyle = '#5e1d1d'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#7c2a2a'; g.fillRect(0, 0, w, 16);
      g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(0, h - 14, w, 14);
      g.font = '700 52px "General Sans", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(240,220,160,0.82)';
      g.fillText('Q U I K - F I L L', w / 2, h / 2 + 2);
      // grime streaks
      g.fillStyle = 'rgba(20,10,8,0.25)';
      for (let i = 0; i < 26; i++) g.fillRect(Math.random() * w, 0, 3, h * (0.3 + Math.random() * 0.7));
    });

    const signTex = canvasTexture(512, 640, (g, w, h) => {
      g.fillStyle = '#1c1c20'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#5e1d1d'; g.fillRect(16, 16, w - 32, 210);
      g.font = '700 96px "General Sans", sans-serif';
      g.textAlign = 'center';
      g.fillStyle = '#f0dca0';
      g.fillText('QUIK', w / 2, 112);
      g.fillText('FILL', w / 2, 208);
      g.fillStyle = '#101014'; g.fillRect(16, 250, w - 32, 360);
      g.font = '700 74px "General Sans", sans-serif';
      g.fillStyle = '#c0392b';
      g.fillText(`REG  ${Wallet.formatGas(Wallet.gasPrice())}`, w / 2, 340);
      g.fillText(`PLUS ${Wallet.formatGas(Wallet.gasPrice() + 0.4)}`, w / 2, 440);
      g.font = '700 58px "General Sans", sans-serif';
      g.fillStyle = '#f0c400';
      g.fillText('NO GAS', w / 2, 552);
    });

    const storeFrontTex = canvasTexture(1024, 512, (g, w, h) => {
      g.fillStyle = '#3a3834'; g.fillRect(0, 0, w, h);
      // siding
      g.strokeStyle = 'rgba(0,0,0,0.22)';
      for (let y = 0; y < h; y += 34) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      // boarded windows
      const win = (x, ww) => {
        g.fillStyle = '#241f1a'; g.fillRect(x, 170, ww, 200);
        g.fillStyle = '#6a5233';
        for (let i = 0; i < 4; i++) g.fillRect(x - 6, 186 + i * 48, ww + 12, 26);
        g.strokeStyle = 'rgba(0,0,0,0.4)';
        g.strokeRect(x, 170, ww, 200);
      };
      win(80, 240); win(700, 240);
      // door
      g.fillStyle = '#2a2622'; g.fillRect(440, 150, 150, 300);
      g.strokeStyle = '#151210'; g.lineWidth = 6; g.strokeRect(440, 150, 150, 300);
      g.fillStyle = 'rgba(180,40,40,0.85)';
      g.save();
      g.translate(515, 300); g.rotate(-0.18);
      g.fillRect(-70, -18, 140, 36);
      g.fillStyle = '#f0e6d0';
      g.font = '700 26px "General Sans", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('CLOSED', 0, 1);
      g.restore();
      // sign band
      g.fillStyle = '#5e1d1d'; g.fillRect(0, 30, w, 92);
      g.font = '700 56px "General Sans", sans-serif';
      g.textAlign = 'center';
      g.fillStyle = 'rgba(240,220,160,0.85)';
      g.fillText('QUIK-FILL FOOD MART', w / 2, 96);
      // graffiti
      g.fillStyle = 'rgba(180,60,160,0.55)';
      g.font = 'italic 700 40px "General Sans", sans-serif';
      g.fillText('SKR', 220, 470);
    });

    const billboardTex = canvasTexture(1024, 448, (g, w, h) => {
      g.fillStyle = '#101b16'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#0d1512'; g.fillRect(14, 14, w - 28, h - 28);
      g.font = '700 104px "Zodiak", Georgia, serif';
      g.textAlign = 'center';
      g.fillStyle = '#d0a23a';
      g.fillText('LOOSE SLOTS', w / 2, 172);
      g.font = '600 58px "General Sans", sans-serif';
      g.fillStyle = '#bdb39b';
      g.fillText('CASINO — 1 MILE', w / 2, 268);
      g.font = '500 40px "General Sans", sans-serif';
      g.fillStyle = '#897f6d';
      g.fillText('free parking · cold air', w / 2, 344);
      // peeling corner
      g.fillStyle = '#1c2a22';
      g.beginPath(); g.moveTo(w, h); g.lineTo(w - 130, h); g.lineTo(w, h - 130); g.fill();
    });

    // ---------------------------------------------------------------- world
    const colliders = [];
    const mats = {
      pole: new THREE.MeshStandardMaterial({ color: 0x4a4a4e, roughness: 0.7, metalness: 0.4 }),
      rust: new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.9 }),
      rustDark: new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.95 }),
      canopyTop: new THREE.MeshStandardMaterial({ color: 0x6a2020, roughness: 0.85 }),
      curb: new THREE.MeshStandardMaterial({ color: 0x8a8578, roughness: 0.95 }),
      crate: new THREE.MeshStandardMaterial({ color: 0x7a5c33, roughness: 0.9 }),
      dumpster: new THREE.MeshStandardMaterial({ color: 0x274d33, roughness: 0.8, metalness: 0.15 }),

    // red $2 bills (8)
    bill(-8, 6.1, -10.8, true);            // canopy roof back edge
    bill(2.2, 5.38, -18.2, true);          // on the AC unit
    bill(-22.2, 7.0, -14.8, true);         // billboard catwalk end
    bill(18, 10.4, -16.5, true);           // top spiral ledge
    bill(-2.6, 1.5, -18.2, true);          // on the dumpster
    bill(10, 1.86, 8, true);               // car roof
    bill(-19.5, tallStackH, 6.5, true);    // tallest tire stack
    bill(26.5, 0, 26.5, true);             // far corner of the lot

    const totalCoins = pickups.filter(c => c.kind === 'bill').length;
    const totalRed = pickups.filter(c => c.kind === 'red').length;

    // gas cans (stars)
    const cans = [];
    function gasCan(x, y, z, label, hidden = false) {
      const grp = new THREE.Group();
      const bodyM = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.4, metalness: 0.3, emissive: 0x2a0604, emissiveIntensity: 0.6 });
      const capM = new THREE.MeshStandardMaterial({ color: 0xf0c400, roughness: 0.4, metalness: 0.5 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.34), bodyM);
      body.position.y = 0.36; body.castShadow = true;
      const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.3, 10), capM);
      spout.position.set(0.2, 0.82, 0); spout.rotation.z = -0.5;
      const handle = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.045, 8, 14, Math.PI), capM);
      handle.position.set(-0.08, 0.74, 0);
      grp.add(body, spout, handle);
      grp.position.set(x, y + 0.35, z);
      grp.visible = !hidden;
      scene.add(grp);
      const glow = new THREE.PointLight(0xff5533, hidden ? 0 : 7, 5, 2);
      glow.position.set(x, y + 1.1, z);
      scene.add(glow);
      cans.push({ mesh: grp, glow, taken: false, baseY: y + 0.35, label, hidden });
    }
    gasCan(-8, 6.35, -8, 'ON THE CANOPY');
    gasCan(18, 11.95, -18, 'TOP OF THE SIGN');
    gasCan(-22.2, 7.0, -9.4, 'BILLBOARD CATWALK');
    gasCan(-2.6, 0, -20.6, 'BEHIND THE DUMPSTER');
    gasCan(-19.5, tallStackH, 6.5 - 0.0, 'KING OF THE TIRES');
    gasCan(-8, 2.6, -8, 'RED BILL BONUS', true);
    // nudge: tire-stack can sits above its red coin
    cans[4].mesh.position.y = tallStackH + 1.5;
    cans[4].glow.position.y = tallStackH + 2.2;
    cans[4].baseY = tallStackH + 1.5;

    // ---------------------------------------------------------------- state & hud
    const state = {
      running: false,
      paused: false,
      won: false,
      coins: 0,
      red: 0,
      cans: 0,
      time: 0
    };
    const toast = document.getElementById('toast');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayKeys = document.getElementById('overlayKeys');
    const overlayStartRow = document.getElementById('overlayStartRow');
    const startBtn = document.getElementById('startBtn');

    let toastTimer = 0;
    function showToast(html, ms = 2200) {
      toast.innerHTML = html;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
    }
    // Progress (bills / red / cans / tank) stays in `state` for bonuses — no header UI.

    // ---------------------------------------------------------------- input
    const keys = {};
    let jumpHeld = false;
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      keys[e.code] = true;
      if (e.code === 'Space') {
        player.jumpBuffer = 0.12;
        jumpHeld = true;
        e.preventDefault();
      }
      if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') jumpHeld = false;
    });

    // chase camera — yaw lags facing a bit; wider default framing
    const cam = { pitch: 0.40, dist: 15, yaw: player.facing, lookY: player.pos.y + 1.5 };
    canvas.addEventListener('wheel', (e) => {
      cam.dist = Math.min(18, Math.max(6, cam.dist + e.deltaY * 0.01));
      e.preventDefault();
    }, { passive: false });

    // touch joystick
    const joyEl = document.getElementById('joy');
    const joyNub = document.getElementById('joyNub');
    const joy = { active: false, x: 0, y: 0 };
    function joyUpdate(e) {
      const r = joyEl.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2);
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      joy.x = dx; joy.y = dy;
      joyNub.style.transform = `translate(${dx * 34}px, ${dy * 34}px)`;
    }
    joyEl.addEventListener('pointerdown', (e) => { joy.active = true; joyEl.setPointerCapture(e.pointerId); joyUpdate(e); });
    joyEl.addEventListener('pointermove', (e) => { if (joy.active) joyUpdate(e); });
    const joyEnd = () => { joy.active = false; joy.x = joy.y = 0; joyNub.style.transform = ''; };
    joyEl.addEventListener('pointerup', joyEnd);
    joyEl.addEventListener('pointercancel', joyEnd);

    const jumpBtn = document.getElementById('jumpBtn');
    jumpBtn.addEventListener('pointerdown', (e) => { player.jumpBuffer = 0.12; jumpHeld = true; e.preventDefault(); });
    jumpBtn.addEventListener('pointerup', () => { jumpHeld = false; });
    jumpBtn.addEventListener('pointercancel', () => { jumpHeld = false; });

    // ---------------------------------------------------------------- physics
    const GRAV = 24;
    const RUN_MAX = 9.2;
    const ACCEL_G = 60;
    const ACCEL_A = 26;
    const JUMP_V = [9.8, 11.4, 13.4];
    const TURN_RATE = 2.75;

    function playerBounds() {
      return {
        min: new THREE.Vector3(player.pos.x - player.half, player.pos.y, player.pos.z - player.half),
        max: new THREE.Vector3(player.pos.x + player.half, player.pos.y + player.height, player.pos.z + player.half)
      };
    }
    function overlaps(a, b) {
      return a.min.x < b.max.x && a.max.x > b.min.x &&
             a.min.y < b.max.y && a.max.y > b.min.y &&
             a.min.z < b.max.z && a.max.z > b.min.z;
    }

    function groundHeightAt(x, z, belowY) {
      let g = 0;
      for (const c of colliders) {
        if (x > c.min.x - player.half && x < c.max.x + player.half &&
            z > c.min.z - player.half && z < c.max.z + player.half &&
            c.max.y <= belowY + 0.02 && c.max.y > g) {
          g = c.max.y;
        }
      }
      return g;
    }

    function physicsStep(dt) {
      let throttle = 0;
      let turn = 0;
      if (keys.KeyW || keys.ArrowUp) throttle += 1;
      if (keys.KeyS || keys.ArrowDown) throttle -= 1;
      if (keys.ArrowLeft || keys.KeyA) turn += 1;
      if (keys.ArrowRight || keys.KeyD) turn -= 1;
      if (joy.active) {
        throttle += -joy.y;
        turn -= joy.x;
      }
      throttle = Math.max(-1, Math.min(1, throttle));
      turn = Math.max(-1, Math.min(1, turn));

      if (Math.abs(turn) > 0.05) {
        player.facing += turn * TURN_RATE * dt;
      }

      const wishX = Math.sin(player.facing) * throttle;
      const wishZ = Math.cos(player.facing) * throttle;
      const moving = Math.abs(throttle) > 0.05;

      const accel = player.onGround ? ACCEL_G : ACCEL_A;
      if (moving) {
        player.vel.x += (wishX * RUN_MAX - player.vel.x) * Math.min(1, accel * dt / RUN_MAX);
        player.vel.z += (wishZ * RUN_MAX - player.vel.z) * Math.min(1, accel * dt / RUN_MAX);
      } else if (player.onGround) {
        const f = Math.exp(-11 * dt);
        player.vel.x *= f; player.vel.z *= f;
      }

      // jumping
      player.coyote = player.onGround ? 0.12 : Math.max(0, player.coyote - dt);
      player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);
      const hSpeed = Math.hypot(player.vel.x, player.vel.z);
      if (player.jumpBuffer > 0 && player.coyote > 0) {
        const chained = state.time - player.landTime < 0.34 && hSpeed > 4 &&
          player.chain > 0 && player.chain < 3;
        if (chained) {
          player.chain += 1;
          if (player.chain === 3 && hSpeed < 6.5) player.chain = 2;
        } else {
          player.chain = 1;
        }
        player.vel.y = JUMP_V[player.chain - 1];
        player.onGround = false;
        player.coyote = 0;
        player.jumpBuffer = 0;
        player.squash = -0.18;
        sfx.jump(player.chain);
      }
      if (!jumpHeld && player.vel.y > 4.5) player.vel.y = 4.5;

      player.vel.y -= GRAV * dt;
      if (player.vel.y < -30) player.vel.y = -30;

      // integrate + resolve, axis by axis
      player.pos.x += player.vel.x * dt;
      resolveAxis('x');
      player.pos.z += player.vel.z * dt;
      resolveAxis('z');

      const wasGround = player.onGround;
      player.onGround = false;
      player.pos.y += player.vel.y * dt;
      if (player.pos.y <= 0) {
        player.pos.y = 0;
        if (player.vel.y < 0) land(wasGround);
      }
      const pb = playerBounds();
      for (const c of colliders) {
        if (!overlaps(pb, c)) continue;
        if (player.vel.y <= 0 && c.max.y - pb.min.y <= 0.62) {
          player.pos.y = c.max.y;
          land(wasGround);
        } else if (player.vel.y > 0 && pb.max.y - c.min.y <= 0.62) {
          player.pos.y = c.min.y - player.height;
          player.vel.y = 0;
        } else {
          // deep side overlap fallback: push out horizontally
          pushOut(c);
        }
        pb.min.y = player.pos.y; pb.max.y = player.pos.y + player.height;
      }
      // remain grounded when standing still on a surface
      if (!player.onGround && player.vel.y <= 0) {
        const g = groundHeightAt(player.pos.x, player.pos.z, player.pos.y + 0.01);
        if (player.pos.y - g < 0.06 && player.pos.y - g > -0.01) {
          player.pos.y = g;
          player.vel.y = 0;
          player.onGround = true;
        }
      }

      if (player.pos.y < -6) { player.pos.set(0, 0.2, 20); player.vel.set(0, 0, 0); }
    }

    function land(wasGround) {
      player.vel.y = 0;
      if (!wasGround) {
        player.landTime = state.time;
        player.squash = 0.22;
        sfx.land();
      }
      player.onGround = true;
    }

    function resolveAxis(axis) {
      let pb = playerBounds();
      for (const c of colliders) {
        if (!overlaps(pb, c)) continue;
        // ignore boxes we are standing on (feet at their top)
        if (c.max.y - pb.min.y <= 0.28 && player.vel.y <= 0.1) continue;
        if (player.vel[axis] > 0 || (player.vel[axis] === 0 && player.pos[axis] < (c.min[axis] + c.max[axis]) / 2)) {
          player.pos[axis] -= (pb.max[axis] - c.min[axis]) + 0.001;
        } else {
          player.pos[axis] += (c.max[axis] - pb.min[axis]) + 0.001;
        }
        player.vel[axis] = 0;
        pb = playerBounds();
      }
    }

    function pushOut(c) {
      const pb = playerBounds();
      const dxL = pb.max.x - c.min.x, dxR = c.max.x - pb.min.x;
      const dzL = pb.max.z - c.min.z, dzR = c.max.z - pb.min.z;
      const m = Math.min(dxL, dxR, dzL, dzR);
      if (m === dxL) player.pos.x -= dxL + 0.001;
      else if (m === dxR) player.pos.x += dxR + 0.001;
      else if (m === dzL) player.pos.z -= dzL + 0.001;
      else player.pos.z += dzR + 0.001;
    }

    // ---------------------------------------------------------------- pickups
    function collectPickups() {
      const px = player.pos.x, py = player.pos.y, pz = player.pos.z;
      for (const c of pickups) {
        if (c.taken) continue;
        const m = c.mesh.position;
        if (Math.hypot(m.x - px, m.z - pz) < 0.95 && Math.abs(m.y - (py + 0.7)) < 1.25) {
          c.taken = true;
          c.mesh.visible = false;
          if (c.kind === 'krugerrand') {
            const snap = Wallet.snapshot();
            Wallet.restore({
              d: snap.d,
              c: snap.c,
              g: Math.round((snap.g + KRUGER_OZ) * 100) / 100
            });
            sfx.gold();
            showToast(`KRUGERRAND<small>+${Wallet.formatGold(KRUGER_OZ)}</small>`, 2200);
          } else if (c.kind === 'red') {
            state.red++;
            Wallet.addCash(2);
            sfx.red();
            if (state.red >= totalRed) {
              const bonus = cans.find(k => k.hidden);
              if (bonus && !bonus.taken) {
                bonus.mesh.visible = true;
                bonus.glow.intensity = 7;
                showToast('A GAS CAN APPEARS<small>over the pump island</small>', 2600);
                sfx.can();
              }
            } else {
              showToast(`RED $2 ${state.red}/${totalRed}<small>+$2 cash</small>`, 1200);
            }
          } else {
            state.coins++;
            Wallet.addCash(1);
            sfx.coin();
          }
        }
      }
      for (const k of cans) {
        if (k.taken || !k.mesh.visible) continue;
        const m = k.mesh.position;
        if (Math.hypot(m.x - px, m.z - pz) < 1.05 && Math.abs(m.y - (py + 0.7)) < 1.4) {
          k.taken = true;
          k.mesh.visible = false;
          k.glow.intensity = 0;
          state.cans++;
          const before = Wallet.fuel();
          Wallet.addFuel(1);
          syncCheckpointFuel();
          const gained = Math.round((Wallet.fuel() - before) * 100) / 100;
          sfx.can();
          if (gained > 0) {
            showToast(`GAS CAN — ${k.label}<small>+${gained} gal · ${state.cans}/${cans.length}</small>`, 2600);
          } else {
            showToast(`GAS CAN — ${k.label}<small>tank already full · ${state.cans}/${cans.length}</small>`, 2600);
          }
          if (state.cans >= cans.length) win();
        }
      }
    }

    function tryPump(p) {
      const needed = Wallet.gasFillGallons();
      if (needed <= 0.05) {
        showToast('TANK FULL<small>already topped off</small>', 1800);
        return false;
      }
      const priceLine = `${Wallet.formatGas(Wallet.gasPrice())}/gal · ${needed.toFixed(1)} gal`;
      const res = Wallet.buyGasFill(p.method);
      if (!res.ok) {
        showToast(
          `${p.label} DECLINED<small>${res.reason || 'Not enough funds'} · ${priceLine}</small>`,
          2600
        );
        return false;
      }
      syncCheckpointFuel();
      sfx.win();
      const pay = p.method === 'cash' ? 'cash' : 'credit';
      showToast(
        `${p.label} PUMP<small>${Wallet.format(res.cost)} ${pay} · +${res.gallons.toFixed(1)} gal</small>`,
        2800
      );
      if (hasDriveCheckpoint()) {
        setTimeout(() => { window.location.href = 'frogger.html?resumeDrive=1'; }, 900);
      }
      return true;
    }

    function checkPumps(dt) {
      const px = player.pos.x, pz = player.pos.z;
      for (const p of pumps) {
        if (p.cooldown > 0) p.cooldown -= dt;
        const dist = Math.hypot(p.x - px, p.z - pz);
        const inside = dist < p.r;
        if (inside && !p.near && p.cooldown <= 0) {
          tryPump(p);
          p.cooldown = 1.4;
        }
        p.near = inside;
      }
    }

    function win() {
      state.won = true;
      state.running = false;
      Wallet.addCash(40);
      sfx.win();
      overlayTitle.hidden = false;
      overlayText.hidden = false;
      overlayKeys.hidden = false;
      overlayStartRow.hidden = false;
      overlayTitle.textContent = 'CANS CLEARED';
      overlayText.innerHTML =
        `Every can on the lot is in the tank (<b>${Wallet.fuel()}/${Wallet.GAS_TANK_GAL}</b> gal). ` +
        `Need a full fill? Hit the <b>cash</b> or <b>credit</b> pump.<br><br>` +
        `Cash: <b style="color:var(--color-primary)">${Wallet.format(Wallet.cash())}</b> (+$40 scavenge bonus)`;
      overlayKeys.innerHTML = '';
      startBtn.textContent = 'Run it back';
      overlay.hidden = false;
    }

    // ---------------------------------------------------------------- camera follow
    const camTarget = new THREE.Vector3();
    function shortestAngleDelta(from, to) {
      let d = (to - from) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }
    function updateCamera(dt) {
      // Avatar may whip around; the lens still lags, but not as heavily.
      const yawErr = shortestAngleDelta(cam.yaw, player.facing);
      const yawFollow = Math.abs(yawErr) > 1.2 ? 0.95 : 0.55;
      let dyaw = yawErr * (1 - Math.exp(-yawFollow * dt));
      const maxYawRate = 1.15; // rad/s ≈ 66°/s — trails the body without crawling
      const maxStep = maxYawRate * dt;
      if (dyaw > maxStep) dyaw = maxStep;
      if (dyaw < -maxStep) dyaw = -maxStep;
      cam.yaw += dyaw;

      const lookYWant = player.pos.y + 1.45;
      cam.lookY += (lookYWant - cam.lookY) * (1 - Math.exp(-5 * dt));
      camTarget.set(player.pos.x, cam.lookY, player.pos.z);

      const behind = cam.yaw + Math.PI;
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const wantX = camTarget.x + Math.sin(behind) * cp * cam.dist;
      const wantY = Math.max(0.5, camTarget.y + sp * cam.dist);
      const wantZ = camTarget.z + Math.cos(behind) * cp * cam.dist;

      // Track the avatar's spot, but ease orbit drift so turns don't jerk the frame.
      const posFollow = 1 - Math.exp(-6.5 * dt);
      camera.position.x += (wantX - camera.position.x) * posFollow;
      camera.position.y += (wantY - camera.position.y) * posFollow;
      camera.position.z += (wantZ - camera.position.z) * posFollow;
      camera.lookAt(camTarget);
    }

    // ---------------------------------------------------------------- game flow
    function togglePause() {
      if (!state.running && !state.paused) return;
      if (state.won) return;
      state.paused = !state.paused;
      if (state.paused) {
        state.running = false;
        overlayTitle.hidden = false;
        overlayText.hidden = false;
        overlayKeys.hidden = false;
        overlayStartRow.hidden = false;
        overlayTitle.textContent = 'Paused';
        overlayText.textContent = 'The lot will wait.';
        overlayKeys.innerHTML = '';
        startBtn.textContent = 'Keep going';
        overlay.hidden = false;
      } else {
        overlay.hidden = true;
        state.running = true;
      }
    }
    startBtn.addEventListener('click', () => {
      ac();
      if (state.won) { location.reload(); return; }
      overlay.hidden = true;
      state.paused = false;
      state.running = true;
    });

    // ---------------------------------------------------------------- loop
    const clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame);
      const rawDt = Math.min(0.05, clock.getDelta());

      if (state.running) {
        state.time += rawDt;
        const steps = Math.max(1, Math.ceil(rawDt / 0.0166));
        const dt = rawDt / steps;
        for (let i = 0; i < steps; i++) physicsStep(dt);
        collectPickups();
        checkPumps(rawDt);
      }

      // visuals
      playerGroup.position.copy(player.pos);
      playerGroup.rotation.y = player.facing;
      player.squash += (0 - player.squash) * Math.min(1, 10 * rawDt);
      playerGroup.scale.set(1 + player.squash * 0.6, 1 - player.squash, 1 + player.squash * 0.6);
      const hSpeed = Math.hypot(player.vel.x, player.vel.z);
      const { armL, armR } = playerGroup.userData;
      const swing = player.onGround ? Math.sin(state.time * 13) * Math.min(1, hSpeed / RUN_MAX) * 0.7 : 0.9;
      armL.rotation.x = swing;
      armR.rotation.x = -swing;

      const gY = groundHeightAt(player.pos.x, player.pos.z, player.pos.y + 0.01);
      blobShadow.position.set(player.pos.x, gY + 0.02, player.pos.z);
      const drop = player.pos.y - gY;
      blobShadow.material.opacity = Math.max(0.08, 0.42 - drop * 0.035);
      const s = Math.max(0.5, 1 - drop * 0.04);
      blobShadow.scale.set(s, s, 1);

      const t = performance.now() / 1000;
      for (const c of pickups) {
        if (c.taken) continue;
        const bob = Math.sin(t * 2 + c.baseY) * 0.06;
        c.mesh.position.y = c.baseY + bob;
        if (c.kind === 'krugerrand') {
          c.mesh.rotation.z = t * 2.4;
        } else {
          c.mesh.rotation.y += 0.012;
          c.mesh.rotation.z = Math.sin(t * 1.8 + c.phase) * 0.22;
          c.mesh.rotation.x = -Math.PI * 0.42 + Math.sin(t * 2.3 + c.phase) * 0.12;
        }
      }
      for (const k of cans) {
        if (k.taken || !k.mesh.visible) continue;
        k.mesh.rotation.y = t * 1.4;
        k.mesh.position.y = k.baseY + Math.sin(t * 1.8) * 0.14;
      }

      updateCamera(rawDt);
      renderer.render(scene, camera);
    }

    resize();
    updateCamera(1);
    frame();
  </script>
</body>
</html>
